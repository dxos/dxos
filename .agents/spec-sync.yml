# Spec sync state — written by the spec-sync Routine (agents/routines/spec-sync.md).
# `main` is the origin/main commit the last incremental run reconciled against; `plugins` records,
# per plugin short name, the commit its PLUGIN.mdl was last reconciled with. `null` means never synced:
# the Routine then runs a sweep (every plugin, in batches) instead of a diff against nothing.
main: null
plugins: {}
