    prs: [12649, 12668]
    resume: "Benchmarks landed (PR #12649 native vitest bench() for both storage kinds; #12668 adds a batched-insert bench + delete-pool exhaustion guard, watching CI). Profiling analysis complete, written up as two separate track files (not the usual TASKS/DESIGN split): AUTOMERGE-TRACK.md — top hotspot is bs58check/noble-hashes doc-ID checksum overhead (~20% of CPU), traced to Repo.create2()s redundant encode-then-decode round trip with zero memoization in AutomergeUrl.js; second finding is EntityManager.flush() (entity-manager.ts:662-685) passing _getAllDocHandles() (ALL loaded per-object doc handles, entity-manager.ts:1420-1424) to Repo.flush()/DataService.flush instead of scoping to the touched doc, making disk-flush O(loaded docs) not O(dirty) despite Repo.flush(documents) supporting scoping. FEED-TRACK.md — verified via direct source read of feed-handle.ts (full file) + independent research agent that feed appends never touch automerge-repo (confirmed by profile: automerge+checksum buckets are 1.8% on this track vs 30.4% on the automerge track); no feed-specific hotspot found AT N=250, BUT that was revised after investigating why batching didn't close the gap to raw sqlite: FeedHandle#addOptimistic (feed-handle.ts) rebuilt a Set of every working-set id plus copied the whole `_objects` array on every single append call — O(current working-set size) per call, O(n²) total, worsened by `_objects` holding reactive proxies so every `.id` read went through the proxy get trap. FIXED — feed-handle.ts now maintains `#objectIds: Set<string>` incrementally instead of rebuilding it; per-item registration cost at a 5,000-item batch went from 1.238ms (worse than a 1,000-item batch — the smoking gun) to 0.301ms (better, true amortization). Post-fix, batch=5,000 total per-item cost is ~0.44ms vs raw sqlite's 0.33ms — ~1.3x, not the ~1000x that prompted the investigation. echo-client (525 tests) and echo-client-e2e (301 tests) full suites pass unchanged. THROUGHPUT-OVERVIEW.md also adds a fresh full-suite run (sqlite/automerge/feed side by side) and documents a live example of the automerge un-scoped-flush finding: raising DELETE_POOL to 1,000 for a correctness fix made automerge update/delete ~7x slower purely from corpus growth. NEXT: neither proposed automerge-track fix (bs58check memoization; scoped flush) is implemented yet — pending go-ahead since both touch shared code outside echo-client-e2e (automerge-repo dist patch / AutomergeUrl.js, and EntityManager.flush())."
  - name: client-startup-timeout
