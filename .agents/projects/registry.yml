    summary: 'Client fails to start on document-heavy profiles — the worker blocks its own thread ~18s on local subduction hydration (O(docs) synchronous SQLite reads), misses the flat 15s connect deadline, and the abandoned-but-uncancelled onConnect then deadlocks the retry path so every reload fails. Distinct from startup-latency (app-framework module activation); this is the worker/storage thread.'
