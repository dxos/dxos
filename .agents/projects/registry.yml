195); and app-graph's _expanded / _initialized latches and _initialNodes / _initialEdges seeds were never recording anything -- built with Record.empty() and written with Record.set(), which is immutable in Effect -- so every Graph.expand re-fired the node connector. Now Set/Map (43995bff6b). Measured in the running app: expands logging expanded:true went 0 -> 163 of 226, real expansions 306 -> 14, sqlite queries per navigation ~4700 -> ~550, with no not-found or retry signals. NEXT (all needing a human at the browser): (1) cold-restore a deep link into a fresh profile -- the latch fix means the url-handler retry no longer re-fires an already-expanded connector, and no test covers that path; (2) fold-spine sigil alignment and pinned-plank scroll offset after the Splitter/ScrollIntoView rework; (3) decide whether the app-graph latch fix ships in this PR or is cherry-picked to its own branch (it is a main bug, self-contained: one file + changeset). Still open: companionFrameSizing is dead on DeckState; navtree marks `current` on a 500ms timer that every Layout notification cancels and restarts (main's code, and the likely remaining cause of the reported selected-state lag); 'existing node' churn stayed flat while expansions dropped ~20x, so connector re-emission has a separate cause. GOTCHAS: never import a DOM/UI package into worker-reachable modules; Mosaic.Tile must re-sync size on prop change; a plugin AppGraphBuilder must register on the default SetupAppGraph event; moon's cache hid a broken cold build once (app-graph had @dxos/effect as a dev dep only) -- use --force when a result looks too clean; ALWAYS check git branch --show-current before editing or committing (this worktree was switched under the session once)."

