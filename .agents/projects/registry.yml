arate cause. GOTCHAS: never import a DOM/UI package into worker-reachable modules; Mosaic.Tile must re-sync size on prop change; a plugin AppGraphBuilder must register on the default SetupAppGraph event; moon's cache hid a broken cold build once (app-graph had @dxos/effect as a dev dep only) -- use --force when a result looks too clean; ALWAYS check git branch --show-current before editing or committing (this worktree was switched under the session once)."

