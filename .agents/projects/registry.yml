ried via toolInvocations). NEXT: verify build/lint/test green, commit, re-verify with CodeRabbit. Then: G2→C mocked unit conversions (scheduled-run/model-pinning work explicitly deferred per direct instruction), then E/F tiers. Also tracked, own PRs: delete orphaned .agent/ (singular) dir; decide whether AiRequest.run needs a max-iterations cap (none exists today); consider tool-error/malformed-output branch tests."

