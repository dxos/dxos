    resume: 'Spec written, no code yet. Key finding: the SDK -> OTel -> OTLP -> SigNoz pipeline ALREADY EXISTS and is enabled for Composer (metrics: true at composer-app/src/util/config.ts:90) — RemoteMetrics in @dxos/tracing is the collector-free SDK facade, OtelMetrics registers itself as its processor, and client-observability.ts already produces network/runtime/per-space gauges. So this is not a pipeline build; it is 5 exporter fixes + 10 new instruments (plus 10 existing ones migrated/retagged) + a dashboard. Phase 1 (blocking) fixes: (P1) exporter has no temporalityPreference so counters export cumulative and every browser reload reads as a counter reset; (P2) session.id is stamped as a metrics RESOURCE attribute so every page reload mints a permanent new ClickHouse fingerprint — SigNoz does no write-time sampling, so cardinality is the only cost lever; (P3) createGauge/createCounter called on every record; (P4) MetricsMethods is push-only, which is why providers poll on a 10-min timer against a 60s export interval producing mostly-gap series — add observe() -> createObservableGauge and every new gauge uses it; (P5) MetricData.unit is discarded and default histogram buckets are ms-shaped, capping at 10000. New metrics per DESIGN.md: spaces.count/ready.count; documents.count{local|remote} + unsynced.count from getSyncSummary (sdk/client/src/echo/util.ts:23); edge ws reconnect.count{bounded reason enum}/connected/connect.duration via trace.metrics from edge-client.ts:355 (edge-client must NOT depend on @dxos/observability); sync episode.duration histogram + stalled.duration observable gauge — BOTH are needed because an episode that never closes never records a histogram sample, so the histogram alone cannot see a permanently stuck client; memory phase migrates the existing heap gauges to observe() with By units (keeping names so history is not orphaned) and adds memory.bytes{scope} via measureUserAgentSpecificMemory to cover the shared/dedicated workers that performance.memory cannot see. Cross-project coupling: the memory phase overlaps jdw memory-usage project (300-400MB resting target, scripts/memory/soak.mjs) — coordinate names. PHASE 4 IS NOW UNBLOCKED: #12561 merged as 8ca2ac7be8 and db.subscribeToSyncState (echo-client/src/proxy-db/database.ts:778) now owns a no-change poll backoff (2s -> 15s ceiling) and already selects the EDGE peer, so the provider just consumes it and adds no timer of its own. The earlier not-on-main check was looking in the wrong package (sdk/client/src/echo rather than echo-client/src/proxy-db). Use subscribeToSyncState, NOT subscribeToAutomergeSyncState, since only the former sees feed blocks — and define the sync episode over unsyncedDocumentCount + blocksToPull + blocksToPush, matching how toSpaceUpdate in plugin-client decides a space is caught up. ONE BLOCKER REMAINS: Phase 5: the signoz MCP server is configured but unauthenticated, so nothing is verified against a live instance and the dashboard/cardinality check cannot run. Two corrections from review: (a) P2 must build a SEPARATE resource for MeterProvider — extension.ts hands one resource object to logs/metrics/traces and an OTel View cannot strip a provider-level resource attribute (attributeKeys filters datapoint attributes only); (b) the real cardinality budget is 65 series/device, not 24 — histograms are 37 of those because SigNoz stores one _bucket series per boundary plus _count/_sum, so cut bucket boundaries before attributes if it needs trimming. Also added a first-sample policy for sync episodes (a provider starting, or a tab reloading, with a non-zero backlog never sees the 0 -> non-zero transition, so open the episode at first observation with openedAt = lastProgressAt = now, both lower bounds; truncated episodes are recorded and under-report rather than paying an origin attribute). PHASE 1 IS DONE AND MERGED INTO THE BRANCH: all five exporter fixes landed with tests (tracing 18/18, observability 63 passed + 1 skipped), plus RemoteMetrics.unregisterProcessor after review found that OtelMetrics.close left a dead processor registered on the TRACE_PROCESSOR singleton. NEXT: Phase 2 (spaces, documents, memory gauges in client-observability.ts).'
