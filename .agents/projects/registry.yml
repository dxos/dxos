    resume: 'PR #12380 MERGED 2026-07-29 (squash 3502b3d5) — carried the illustrator base, the plugin-sketch->plugin-tldraw rename, the mermaid dialect, the sketch->drawing migration, the excalidraw label/arrow-binding fixes, AND the initial react-ui-diagram spike. The branch continues past the squash: grid-alignment work plus a fresh origin/main merge (96066fd). Three separate causes were found behind "nodes not on the grid", each hidden by the fix for the previous one: (1) React Flow Background computes `offset * zoom || 1 + gap/2`, so a 0 offset is falsy and shifts the pattern half a cell; (2) registering containers under the type key `group` collides with React Flow''s four built-in styled type names, whose border lands on the wrapper, making the container 2px small so its right/bottom edges left the grid while left/top stayed — type keys are now `node`/`container`; (3) neither pattern is anchored to the cell corner — DotPattern draws `circle cx=r cy=r` (error proportional to zoom) and LinePattern draws at the half-cell (off by grid/2), so `offset` now compensates per variant. Verified 0.000px edge-to-dot-centre on all four edges of all six nodes at two zooms. Also landed on the branch: Diagram composed as Root/Canvas/Background per the composite-components skill, Panel/Toolbar/Statusbar story layout, args-driven stories (Default/Nested/Neutral), the drag-updates-live fix (local mirror so React Flow owns gesture interim state), and mermaid syntax highlighting (codemirror-lang-mermaid, MIT; custom tags need mermaidHighlightStyle; fenced registration must live in ui-editor''s markdown bundle because codeLanguages is construction-time). All green: 307 lint tasks, 15 react-ui-diagram + 346 ui-editor + 12 illustrator + 15 tldraw + 7 excalidraw tests, oxfmt clean. PHASE 4 DESIGNED AND APPROVED, NOT IMPLEMENTED — design + phasing in agents/superpowers/specs/2026-07-29-diagram-substrate-design.md. LICENSING (needs legal review, not an engineering call): @tldraw/* 3.0.0 