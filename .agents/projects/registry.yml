    resume: 'MERGED: #12235 implementation (7b270f2e), #12368 + #12391 roadmap docs. OPEN: #12464 — this roadmap re-staging (https://github.com/dxos/dxos/pull/12464 · preview https://pr-12464-composer-main.dxos.workers.dev); mark merged here when it lands. No stage code exists (verified fcdd424a). NEXT: land #12464, then stage 1 — backend-computed queries. Roadmap RE-STAGED 2026-08-04 (jdw) around the query-shaped model: the feed is the REPLICATION METHOD, not an order consumers see — display is domain-order everywhere (email AND chat), deep history is served by backend-computed queries, and the client never cursors the remote feed (range-map / patchUp / range-hydration dropped: a backend query answers latest-per-id from its own index). Stages (DESIGN.md "Roadmap"): 1 backend-computed queries incl. aggregates (additive, ships while replicas are full; mailbox thread aggregate; results hydrate live via the FeedObjectCore identity map; backend token|insertionId pagination); 2 partial replication — replication floor (sync pulls a tail window, not from position 0) + local eviction (deleteOldestBlocks) + LRU result cache + the local/remote query seam (watermark stitching, local side sees unsynced writes; exposes a monotonic server version, which also fixes the clean-state rollback in reconcile); 3 multi-writer lost-update protection (write versioning: per-object ordering ONLY, no feed-wide display order — reorder-on-position-arrival dropped; server-version compare in reconcile + Lamport (sequence, actorId) tiebreaker; chat-WRITES gate — edits/reactions are multi-writer mutations of one object; deferrable because production feeds are single-writer connectors today); 4 consumer cursors + read state + EDGE push (motivated by chat UNREAD — chat does NOT depend on feed order for display; unread needs a monotonic DELIVERY watermark on the server-position axis because client timestamps skew; also push latency replacing 1s polling and dispatcher dedup replacing processedVersions). Deferred with pull triggers: retention + epoch chaining (trigger: total-feed growth hurts EDGE storage), delta blocks (trigger: write amplification), projections (demand). Companion workstreams noted in DESIGN.md: first-party chat plugin (needs ephemeral presence channel, not feed blocks), large-source ingestion (source-cursor pipeline), pluggable FeedBackend interface (read-through against non-EDGE backends; stages 1-2 only keep the seam clean), Matrix shelf (strong FeedBackend-consumer candidate and likely long-term production chat backend — first consumer could equally be freeq; ATProto identity broker is a parenthetical adjunct). Project docs land via PR #12391.'

