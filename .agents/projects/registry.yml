    resume: "scripts/migrate-esm-imports.ts (kept as a repo utility, needs TS_PARSER_PATH pointed at a classic-TypeScript install — the workspace typescript catalog entry is TS7/tsgo, which drops the synchronous parser API) rewrote 7118 files repo-wide, idempotent, 0 unresolved specifiers on the final pass. PR #12893 open; user said 'keep spinning until ci passes'. Found and fixed FOUR real regressions the migration exposed, beyond the three oxlint resolveModule() double-extension bugs from the first pass: (1) protobuf-compiler's substitutions-parser.ts — ts-morph's vendored TS ~4.8 rejects .ts-extensioned imports outright, silently poisoning every substitution to raw wire types; fixed via a RealFileSystemHost subclass rewriting extensions only in ts-morph's isolated parse. (2) .config/knip.ts — knip's traversal does not credit a dynamic import() with an explicit extension (Capability.lazyModule(..., () => import('./Debug.tsx'))), so a solely-reached dependency read as unused; added to TRAVERSAL_MISSED. (3) composer-app/vite.config.ts — the DX_PLUGIN_SET alias matched only the bare './plugin-defs' specifier, so main.tsx's now-extensioned import silently bypassed it and a 'production' build shipped all 106 plugins instead of 30 (confirmed via check-plugin-set: 73 unexpected -> 0); widened the regex. (4) SAME three oxlint rules, a SECOND distinct bug: extension-unaware path-depth/name derivation — dxos-subpath-exports counted './dir/index.ts' one level deeper than old './dir' (false nestedPathExport, caught on plugin-discord:lint), import-as-namespace derived namespace 'index' instead of the directory name, dxos-package-imports's self-import regex stopped matching a barrel's own extensioned re-export. Full moon :lint (340 pkgs) + :build :test-types + :check-module-structure all clean after these. Merged main TWICE (moved ~20 commits during this PR) — each merge was 'take theirs on every conflict, then re-run the codemod repo-wide' since every conflict was real upstream logic vs. this branch's extension-only edits to the same lines; also dropped this session's own plugin-assistant queue-while-processing implementation (Chat.tsx/ChatActions.tsx/ChatPrompt.tsx) in favor of the superset landed by main's agent-feed-messages project (same UX, feed-backed, tested — see that entry) and updated pnpm-lock.yaml via pnpm install (not just taking main's copy) to keep this branch's own @ts-morph/common addition. Check / check and Model Fixture are now GREEN. Only Check / test shard=1 remains red, root-caused via two clean full local :test runs to ONE pre-existing flaky test (echo-host automerge-repo-subduction-policy.test.ts '...(empirical)', file documents its own flakiness, git log shows only this branch's extension-only touch) — documented in a PR comment (Depot jobs aren't re-runnable from here). NEXT: watch PR #12893 for shard=1 to go green on the next push (main is still moving) and for review; keep re-merging main and re-running the codemod if it moves again before landing."
