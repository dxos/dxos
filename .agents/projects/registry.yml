  - name: plugin-s3
    status: active
    user: burdon
    host: burdon-mbp-2092
    created: 2026-08-26
    summary: 'Upload/download Composer files to an S3-compatible bucket (Cloudflare R2, AWS S3, MinIO) via a new headless @dxos/plugin-s3 — a BlobBackend on the hypergraph plus a plugin-connector credential form. plugin-file is unchanged: it already exposes the backend seam plugin-wnfs uses.'
    tasks: .agents/projects/plugin-s3/TASKS.md
    design: .agents/projects/plugin-s3/DESIGN.md
    prs: [12789]
    resume: "PR #12789 OPEN and green (https://github.com/dxos/dxos/pull/12789) — NOTHING HERE IS ON MAIN YET. IMPLEMENTED IN THAT PR: plugin-s3 (BlobBackend + connector), verified against REAL R2 end to end — signing, upload, byte-identical read, presigned fetch, wrong-secret rejection, delete, plus the OPTIONS preflights for HEAD and PUT. SigV4 is hand-rolled over WebCrypto and pinned to AWS's OWN published example signatures, which is what makes those tests evidence rather than self-consistency. ADDRESSING: five values fit AccessToken's three fields via virtual-hosted addressing — source = <bucket>.<account>.r2.cloudflarestorage.com carries bucket AND endpoint, account = access key id, token = secret, region parsed from host with `auto` for R2/MinIO. FOUR REAL BUGS FOUND, each invisible to the previous layer of testing: (1) R2 answers an UNAUTHENTICATED request to a private bucket with 400 InvalidArgument, not the 403 AWS returns, so a 404/403-only miss rule made the public-bucket fallback THROW — reads now split signed (authoritative) from unsigned (speculative: any 4xx = not publicly readable); (2) testConnection probed with headObject, which reports 403 and 404 alike as not-there, so A WRONG SECRET TESTED CLEAN — replaced with probeAccess reading the S3 error code; (3) ConnectionTestError carries a STATIC message so every cause flattened to 'Connection test failed.' — the connector now passes the cause through; (4) CreateObjectResult.object was required but plugin-connector satisfied it with `undefined as unknown as Obj.Unknown`, so creating a Connection threw from Obj.getURI — the type is now honest, which immediately exposed two more unguarded dereferences the cast had hidden. ALSO: connection creation merged from two dialogs into one customPanel (which orphaned CreateConnectionForm/ConnectorSelectorField/ConnectorAnnotationId, all deleted); retest no longer blanks its own verdict; rename from settings; describeConnection publishes non-secret metadata as one JSON block; destructive delete that lands on the Connections section. CI GOTCHA THAT COST TWO CYCLES: plugin-connector's CreateObject declares environments:['node'], so create-object.ts must not reach React — the customPanel import broke check-module-structure and is fixed via the #create-panel conditional subpath (the same pattern as #commands). A new subpath ALSO needs a vite.config entry or it builds fine and dies at runtime. ASSISTANT UPLOAD (Phase 3, done): @dxos/util safe-fetch extracted from plugin-crm (which now imports it) with 14 tests it never had, and FileOperation.CreateFromSource — Create is unreachable from any tool call because its input is a live browser File, and AN OPERATION WHOSE INPUT CANNOT RENDER AS JSON SCHEMA IS DROPPED FROM THE REGISTRY SILENTLY. MIME allowlist widened to text/csv/markdown/json; text/html deliberately excluded (stored HTML served from the blob origin executes). NEXT (Phase 4, the only thing left before a cloud agent can write to a customer bucket, and it needs NO EDGE-REPO CHANGE): extract sigv4/s3-client/s3-uri + the backend factory into a core package and register it in functions-runtime-cloudflare. The registration seam is FunctionContext's EchoClient in compute-runtime (THIS repo) and the backend needs no Cloudflare binding — it is a plain outbound fetch to the customer's endpoint, and operation-service sets no global_fetch_strictly_public. LAYERING CONSTRAINT: the call site must be in functions-runtime-cloudflare, NOT compute-runtime, since s3-credentials imports credentialsLayerFromDatabase FROM compute-runtime and would cycle. DECIDED, DO NOT REOPEN: a new file service is NOT the answer for bring-your-own-bucket — blob-service is the 'we store your files' product; for BYO the credential is the user's own key to their own bucket and a service minting presigned URLs would have to custody customer keys, which is a larger liability. Also: bucket CORS is needed for uploads and programmatic reads ONLY, never for rendering, since presigned URLs load in img/video/iframe without a crossorigin attribute. FLAGGED, UNRELATED: every blob-service route in the edge repo sets skipAuth:true and discards the presentation the client sends; whether the edge route authenticates in front of it is unverified."
