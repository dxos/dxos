    resume: 'PR #12594 OPEN, ready for review, CI green (Check, PR Build, Model Fixture) and mergeable/CLEAN at bb555a1b09. Phases 1-10 IMPLEMENTED: @dxos/graph is rebuilt on Effect Graph (long-lived MutableGraph + version atom, per-node/edge atom views with equality cutoffs, codec, adjacency index, topoLevels/findCycle); the generic expansion engine lives in @dxos/graph/GraphBuilder with ModelGraphBuilder as its default specialization and AppGraphBuilder as the app subclass; app-graph storage is consolidated onto the core model; graph.ts is dissolved into a single AppGraph.ts. PUBLIC API RENAME, the part consumers feel: @dxos/app-graph/{Graph,GraphBuilder,Node} became /{AppGraph,AppGraphBuilder,AppGraphNode}, and NodeMatcher split by dependency, generic combinators to @dxos/graph/GraphNodeMatcher and the ECHO-aware ones to @dxos/app-toolkit/AppNodeMatcher, with node-id path helpers moving to @dxos/graph/GraphNode. 147 consumer files swept. Perf beats the pre-refactor bar: expansion ~19-27x faster, updates ~2.4x, removal ~2x. THE MERGE HAZARD THAT KEEPS RECURRING, expect it on every update from main: main adds code against the retired app-graph API in files that merge WITHOUT conflict and only fail at compile time. Three merges in a row hit it (plugin-lingo; then plugin-mobile x6 + plugin-deck testing + the whole new plugin-stream-deck). Named imports are the sharp edge, `import { qualifyId } from @dxos/app-graph` is invisible to a namespace-shaped sweep and bit twice. After ANY merge run the three greps: retired subpaths, named qualifyId, and packages importing @dxos/graph without declaring it. Also run `moon run :lint` and not just build/test, since a namespace mentioned only in a COMMENT will make an import-need check add a real unused import (caught by CI twice). REMAINING WORK, none blocking the merge: release POLICY is an explicit follow-up per jdw 2026-08-25, the mechanism (GraphModel.release / GraphBuilder.release / Store.release) is in and tested but has no production caller, recommendation is LRU over workspace roots in plugin-space; Phase 3 ECHO adapter (remote-change wiring, ComputeGraphModel and CanvasGraphModel ports) is unported but conductor 31/31, schema 51, react-ui-graph 19 all pass on the current path so nothing is broken; algorithm upgrades (getPath to dijkstra, reactive pathAtom); the explore isolation decision (no production callers, dropping the option is the cheap answer); two upstream Effect reports (batch() discarding invalidations gathered after its rebuild pass, single-clone Graph.snapshot). E2E CAVEAT: e2e never runs on a PR, only main/changeset-release/manual dispatch, so verify with `gh workflow run check.yml --ref <branch> -f e2e=true`. Judge any e2e failure against a SECOND run before believing it: one dispatch showed composer 43% slower with six red shards and an identical-SHA rerun came back +2% with everything green, it was a slow runner, and a day was spent chasing a regression that did not exist.'
