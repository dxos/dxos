id: vendor-hyperformula
layer: library
language: typescript
tags:
  - vendor
  - pack
  # Publishes no `source` condition, so every consumer resolves it to dist — including vite's
  # dependency scan, which aborts wholesale on a single unresolvable import.
  - dist-runtime
workspace:
  inheritedTasks:
    exclude:
      - lint

tasks:
  build:
    args:
      - '--entryPoint=src/hyperformula.js'
      - '--platform=neutral'
      - '--mainFields=browser,module,main'
      - '--bundlePackage=hyperformula'
      - '--bundlePackage=chevrotain'
      - '--bundlePackage=unorm'
      - '--bundlePackage=tiny-emitter'
      - '--bundlePackage=regexp-to-ast'
