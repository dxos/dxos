$schema: https://moonrepo.dev/schemas/tasks.json
tasks:
  check-edge-release:
    # Builds the package's one plugin bundle (as `dx registry publish` does), loads it alone in workerd as
    # EDGE does (a plugin's `dependsOn` is not activated on EDGE), and fails when the bundle check fails,
    # a module does not import or activate, or it contributes no operations, skills or types.
    # See `@dxos/plugin-builder`.
    # TODO(dmaretskyi): Reorganize all plugin-related tasks under a single `dx-plugin` tag.
    command: node $workspaceRoot/packages/core/compute/plugin-builder/dist/lib/bin/check-release.mjs --package .
    deps:
      # The bundle is built from source; dependencies' `dist` provide their types and the shared packages.
      - ^:build
      # The bundle resolves the package's own `#` imports to its `dist`, which must be complete before it builds.
      - build
      - plugin-builder:build
      - plugin-host-cloudflare:build
    inputs:
      - '@group(sources)'
      - package.json
      - dx.config.ts
      - /packages/core/compute/plugin-builder/src/**/*
      - /packages/core/compute/plugin-host-cloudflare/src/**/*
      - /packages/sdk/app-framework/src/vite-plugin/**/*
    outputs:
      - dist/plugin
    options:
      timeout: 900

  publish-edge-release:
    # Uploads the bundle `check-edge-release` built and checked to the EDGE at `DX_EDGE_BASE_URL` as a first-party
    # plugin, with the admin key in `DX_HUB_API_KEY`. `-- --dry-run` lists what it would upload. Deploy Apps runs it
    # for every `edge-release` plugin against preview. See `@dxos/plugin-builder`.
    command: node $workspaceRoot/packages/core/compute/plugin-builder/dist/lib/bin/publish-release.mjs --package .
    deps:
      - check-edge-release
      - plugin-builder:build
    options:
      # An upload is a side effect on EDGE, not an output moon can restore.
      cache: false

inheritedBy:
  tags: edge-release
