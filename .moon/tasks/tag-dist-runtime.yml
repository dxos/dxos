$schema: https://moonrepo.dev/schemas/tasks.json
# Packages a consumer cannot import from source: they publish no `source` export condition (or map a
# subpath straight at `dist/`), so `@dxos/<pkg>` resolves to a build artifact under every condition
# set — vite dev, vitest, and the production bundle alike. Their `build` is therefore not optional
# work the way every other package's is.
#
# Tag membership is verifiable, not a judgement call: resolve each `@dxos/*` specifier the repo
# actually imports with `source` first (the conditions `PluginImportSource` uses) and see whether the
# target lands in `dist/`. Adding a `source` condition to a package is what removes it from here.
tasks:
  source-deps:
    deps:
      - ~:build

inheritedBy:
  tags: dist-runtime
