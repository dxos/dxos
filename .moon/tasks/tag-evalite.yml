$schema: https://moonrepo.dev/schemas/tasks.json

tasks:
  evals:
    # evalite takes one positional, so a passthrough file replaces the directory rather than joining it.
    command: bash -c 'pnpm exec dx-killorphans evalite run --outputPath out/evals.json "${1:-src/evals}"' --
    deps:
      - esbuild-plugins:build
      - node-std:build
      - vite-plugin-import-source:build
      - ^:build
      - '^:#prebuild'
    options:
      cache: false
      outputStyle: stream
      timeout: 5400
  evals-watch:
    command: pnpm exec dx-killorphans evalite watch src/evals
    deps:
      - esbuild-plugins:build
      - node-std:build
      - vite-plugin-import-source:build
      - ^:build
      - '^:#prebuild'
    preset: server

inheritedBy:
  tags: evalite
