$schema: https://moonrepo.dev/schemas/tasks.json

tasks:
  evals:
    # evalite takes one positional, so a passthrough file replaces the directory rather than joining it.
    command: bash -c 'pnpm exec dx-killorphans evalite run "${1:-src/evals}"' --
    deps:
      - esbuild-plugins:build
      - node-std:build
      - vite-plugin-import-source:build
      - ^:build
      - '^:#prebuild'
    options:
      cache: false
      outputStyle: stream
      timeout: 5400
  # The latest run from evalite's store, as a job summary and as PostHog events. A task so it runs
  # on the toolchain's node: the store is SQLite through a native module built for that version.
  evals-report:
    command: node scripts/eval-events.mjs --summary out/summary.md --posthog
    options:
      cache: false
      outputStyle: stream
  evals-watch:
    command: pnpm exec dx-killorphans evalite watch src/evals
    deps:
      - esbuild-plugins:build
      - node-std:build
      - vite-plugin-import-source:build
      - ^:build
      - '^:#prebuild'
    preset: server

inheritedBy:
  tags: evalite
