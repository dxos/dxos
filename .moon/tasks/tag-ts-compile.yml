$schema: https://moonrepo.dev/schemas/tasks.json
tasks:
  # Single-pass type-and-JS build via raw `tsc` (used by workspace tools and a handful of
  # packages). The tag is named `ts-compile` for historical reasons; the task it contributes
  # is `build`, like every other build tag.
  #
  # `dist` is cleaned first because a surviving `tsconfig.tsbuildinfo` makes an incremental
  # `tsc` consider a restored-but-stale (or moon-cache-missing) `dist` up to date and emit
  # nothing at all.
  build:
    command: bash -c 'rm -rf dist && pnpm exec tsc'
    deps:
      - ^:build
    inputs:
      - /tsconfig.base.json
      - tsconfig.json
      - '@group(production)'
    outputs:
      - dist/
    options:
      timeout: 60

inheritedBy:
  tags: ts-compile
