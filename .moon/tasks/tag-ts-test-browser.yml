$schema: https://moonrepo.dev/schemas/tasks.json
tasks:
  test-browser:
    command: pnpm exec dx-killorphans vitest run --passWithNoTests --project="browser-*"
    deps:
      - esbuild-plugins:build
      - node-std:build
      - vite-plugin-icons:build
      - vite-plugin-import-source:build
      - vite-plugin-module-url:build
      - ^:build
    inputs:
      - '@group(sources)'
      - /vite.base.config.ts
      - /vitest.base.config.ts
      - vite.config.ts # Combined build + test config; most packages use this rather than `vitest.config.ts`.
      - vitest.config.ts
      - $VITEST_COVERAGE
      - $VITEST_DEBUG
      - $VITEST_ENV
      - $VITEST_XML_REPORT
      # Tag gating lives in `/vitest.tags.ts` and is read from the environment, so a cached result
      # would otherwise replay a run in which the tagged suites were skipped.
      - $DX_RUN_MANUAL_TESTS
      - $DX_RUN_MODEL_FIXTURE_TESTS
      - $DX_UPDATE_MODEL_FIXTURES
      # Set per run on the nightly, so its tests execute instead of replaying a cache hit.
      - $DX_TEST_RUN_ID
    outputs:
      - /coverage/$project/browser/**
      - /test-results/$project/browser/**
    options:
      timeout: 600

inheritedBy:
  tags: ts-test-browser
