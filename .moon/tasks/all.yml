# https://moonrepo.dev/docs/config/tasks
fileGroups:
  assets:
    - assets/**/*
    - public/**/*

  scripts:
    - scripts/**/*

  sources:
    - src/**/*

  production:
    - src/**/*
    - '!src/test/**/*'
    - '!src/**/*.test.tsx?'
    - '!src/playwright/**/*'
    - '!src/**/*.spec.ts'
    - '!src/stories/**/*'
    - '!src/**/*.stories.tsx'

  tests:
    - src/test/**/*
    - src/**/*.test.tsx?
    - src/playwright/**/*
    - src/**/*.spec.ts

# Not `/pnpm-lock.yaml`, which would rerun every task on any dependency change: `.dependency-closure`
# hashes only the installed packages the project can load (`scripts/dependency-closure.mjs`).
implicitInputs:
  - node_modules/.dependency-closure
  - package.json
  - /.pnpmfile.cjs
  - /patches/*
