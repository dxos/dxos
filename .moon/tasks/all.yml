# https://moonrepo.dev/docs/config/tasks
fileGroups:
  assets:
    - assets/**/*
    - public/**/*

  scripts:
    - scripts/**/*

  sources:
    - src/**/*

  production:
    - src/**/*
    - '!src/test/**/*'
    - '!src/**/*.test.tsx?'
    - '!src/playwright/**/*'
    - '!src/**/*.spec.ts'
    - '!src/stories/**/*'
    - '!src/**/*.stories.tsx'

  tests:
    - src/test/**/*
    - src/**/*.test.tsx?
    - src/playwright/**/*
    - src/**/*.spec.ts

# Not `/pnpm-lock.yaml`: moon already hashes each project's resolved dependency versions, and the whole
# file would rerun every task whenever any project's dependencies change. Bundles, which embed the
# whole dependency tree and which nothing builds on, list it themselves.
implicitInputs:
  - package.json
  - /.pnpmfile.cjs
  - /patches/*
