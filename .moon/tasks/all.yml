# https://moonrepo.dev/docs/config/tasks
fileGroups:
  assets:
    - assets/**/*
    - public/**/*

  scripts:
    - scripts/**/*

  # `dx.config.*` is a plugin's definition (its `#meta`), compiled into the build and the app bundle's
  # manifest. A glob, not a path: moon warns on every project that lacks a literal input.
  sources:
    - src/**/*
    - dx.config.*

  production:
    - src/**/*
    - dx.config.*
    - '!src/test/**/*'
    - '!src/**/*.test.ts'
    - '!src/**/*.test.tsx'
    - '!src/playwright/**/*'
    - '!src/**/*.spec.ts'
    - '!src/stories/**/*'
    - '!src/**/*.stories.tsx'

  tests:
    - src/test/**/*
    - src/**/*.test.ts
    - src/**/*.test.tsx
    - src/playwright/**/*
    - src/**/*.spec.ts

# Not `/pnpm-lock.yaml`, which would rerun every task on any dependency change: the `dependency-closure`
# toolchain (`tools/moon-dependency-closure`) hashes only the packages each project can load.
implicitInputs:
  - package.json
  - /.pnpmfile.cjs
  - /patches/*
