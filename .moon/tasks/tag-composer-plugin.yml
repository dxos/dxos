$schema: https://moonrepo.dev/schemas/tasks.json
tasks:
  # Fail when a plugin's EDGE build reaches a package listed in `/.config/server-import-bans.txt`.
  # `--conditional-exports` picks every export subpath that declares `workerd`, so no subpath needs
  # naming here. `node` is not checked: a node build keeps every module without an `environments`
  # list, UI included, so React stays legitimate there.
  check-server-imports:
    command: >-
      bun $workspaceRoot/tools/dx-trace-imports/cli.js
      --conditional-exports
      --to-file $workspaceRoot/.config/server-import-bans.txt
      --conditions workerd,worker
      --fail-on present
    deps:
      - dx-trace-imports:build
      - build
    inputs:
      - tsconfig.json
      - package.json
      - dx.config.ts
      - '@group(production)'
      - /.config/server-import-bans.txt
      - /pnpm-lock.yaml
    options:
      timeout: 120

inheritedBy:
  tags: composer-plugin
