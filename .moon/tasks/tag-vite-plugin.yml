$schema: https://moonrepo.dev/schemas/tasks.json
# Packages exporting a vite plugin that a consumer's `vite.config.ts` or `.storybook/main.ts` loads.
# That config runs in Node before any `source`-condition resolution is active, so the plugin export
# deliberately publishes dist only (`pkg-lint`'s `build-tool-source-export` rule) and the consumer's
# vitest run cannot start until it is built.
tasks:
  source-deps:
    deps:
      - ~:build

inheritedBy:
  tags: vite-plugin
