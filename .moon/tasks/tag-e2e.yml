$schema: https://moonrepo.dev/schemas/tasks.json
tasks:
  e2e:
    command: pnpm exec playwright test
    args:
      - --config=src/playwright/playwright.config.ts
    # The service worker breaks `page.route` interception, and specs assert on this rather than
    # silently running without it — set here so no caller has to remember it.
    env:
      DX_PWA: 'false'
    deps:
      - test-utils:build
      - vite-plugin-icons:build
      - target: ^:build
        optional: true
      # `bundle-e2e` rather than `bundle` with an `env` override: the override is hashed into the
      # dependency, so it produced a bundle no other invocation could hydrate. Only the two apps that
      # serve a production bundle define it, hence optional.
      - target: bundle-e2e
        optional: true
    inputs:
      - src/playwright/playwright.config.ts
      - '@group(sources)'
      - '@group(tests)'
      - $CI
      - $CONFIG_DYNAMIC
      # Set to a unique value (run id) to force execution without disabling the cache wholesale:
      # MOON_CACHE=off would also re-run every cached bundle/build dependency in each shard.
      - $DX_E2E_RUN_ID
      - $DX_ENVIRONMENT
      - $DX_HOST
      - $DX_HUB_URL
      - $DX_IPDATA_API_KEY
      - $DX_SHARED_WORKER
      # The browser rides an env var rather than being baked into per-browser task variants
      # (`e2e-chromium`, …). Both shapes shard equally well, but keeping the browser out of the task
      # namespace stops it multiplying with the shard dimension: a suite that outgrows one cell then
      # needs two task definitions (`e2e-shard-1of2`/`-2of2`), not six. Being a hash input already
      # gives each browser its own remote-cache entry.
      - $PLAYWRIGHT_BROWSER

  # The target CI's sharded pool runs, distinct from `e2e` only so that a suite too big for one cell
  # can opt out of it (`workspace.inheritedTasks.exclude`) and declare halves in its place, without
  # the workflow hand-listing which suites those are. `moon exec` cannot union a `--query` with
  # explicit targets — the targets silently win — so the pool has to be expressible as globs, and a
  # suite exposing both `e2e` and its own halves under one glob would run the same tests twice.
  # `e2e` itself stays the everyday local command and the one the docs name.
  e2e-ci:
    extends: e2e

inheritedBy:
  tags: e2e
