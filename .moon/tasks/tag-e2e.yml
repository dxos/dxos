$schema: https://moonrepo.dev/schemas/tasks.json
tasks:
  e2e:
    command: pnpm exec playwright test
    args:
      - --config=src/playwright/playwright.config.ts
    # The service worker breaks `page.route` interception, and specs assert on this rather than
    # silently running without it — set here so no caller has to remember it.
    env:
      DX_PWA: 'false'
    deps:
      - test-utils:build
      - vite-plugin-icons:build
      - target: ^:build
        optional: true
      # `bundle-e2e` rather than `bundle` with an `env` override: the override is hashed into the
      # dependency, so it produced a bundle no other invocation could hydrate. Only the two apps that
      # serve a production bundle define it, hence optional.
      - target: bundle-e2e
        optional: true
    inputs:
      - src/playwright/playwright.config.ts
      - '@group(sources)'
      - '@group(tests)'
      - $CI
      - $CONFIG_DYNAMIC
      # Set to a unique value (run id) to force execution without disabling the cache wholesale:
      # MOON_CACHE=off would also re-run every cached bundle/build dependency in each shard.
      - $DX_E2E_RUN_ID
      - $DX_ENVIRONMENT
      - $DX_HOST
      - $DX_HUB_URL
      - $DX_IPDATA_API_KEY
      - $DX_SHARED_WORKER
      - $PLAYWRIGHT_BROWSER

  # Per-browser variants of `e2e`, so the browser is a moon target dimension rather than only a
  # GitHub Actions matrix axis. That turns 8 suites x 3 browsers into one flat pool of 24 targets that
  # `moon run --job/--job-total` can pack across runners, instead of three per-browser pools that
  # cannot lend each other work — webkit's share of composer is nearly all skips, so a webkit-only
  # runner sits idle while chromium's is still going.
  #
  # `extends` merges `env` over the base task's, so `DX_PWA` and every input carry through, and
  # `$PLAYWRIGHT_BROWSER` already being a hash input gives each variant its own cache entry.
  #
  # Deliberately not applied to `plugin-script:e2e`: that project is not `e2e`-tagged and its `e2e`
  # task is vitest, so it runs once rather than three times.
  e2e-chromium:
    extends: e2e
    env:
      PLAYWRIGHT_BROWSER: chromium
  e2e-firefox:
    extends: e2e
    env:
      PLAYWRIGHT_BROWSER: firefox
  e2e-webkit:
    extends: e2e
    env:
      PLAYWRIGHT_BROWSER: webkit

inheritedBy:
  tags: e2e
