$schema: https://moonrepo.dev/schemas/tasks.json
tasks:
  e2e:
    command: pnpm exec playwright test
    args:
      - --config=src/playwright/playwright.config.ts
    # Declared here, never in a workflow `env`: moon hashes the AMBIENT value of env-var `inputs`, so
    # a job that sets them hashes `bundle-e2e` differently and cannot hydrate another job's entry.
    env:
      # Production edge — e2e must exercise what users hit, not a dev-tier worker.
      DX_EDGE_BASE_URL: 'https://dxos.network'
      DX_TELEMETRY_TAG: e2e
      # The service worker breaks `page.route` interception.
      DX_PWA: 'false'
    deps:
      - test-utils:build
      - vite-plugin-icons:build
      - target: ^:build
        optional: true
      # `bundle-e2e`, not `bundle` with an `env` override: an override is hashed into the dependency, so
      # it yields a bundle no other invocation can hydrate. Optional — only two apps define it.
      - target: bundle-e2e
        optional: true
    inputs:
      - src/playwright/playwright.config.ts
      - '@group(sources)'
      - '@group(tests)'
      - $CI
      - $CONFIG_DYNAMIC
      - $DX_E2E_RUN_ID
      - $DX_ENVIRONMENT
      - $DX_HOST
      - $DX_HUB_URL
      - $DX_IPDATA_API_KEY
      - $DX_SHARED_WORKER
      - $PLAYWRIGHT_BROWSER

  # Identical to `e2e`, and it exists only to give the CI pool a task name composer-app can opt out of
  # (that suite has its own cell, and the pool glob must not run it twice). `moon exec`'s `--query` is
  # NOT an alternative: with a target given it is ignored, and the pool silently ran composer as well.
  e2e-ci:
    extends: e2e

inheritedBy:
  tags: e2e
