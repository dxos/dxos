$schema: https://moonrepo.dev/schemas/tasks.json
tasks:
  e2e:
    command: pnpm exec playwright test
    args:
      - --config=src/playwright/playwright.config.ts
    # The task `env`, not the workflow, owns these, so a local `moon run <app>:e2e` exercises the
    # same edge and telemetry target as CI — and since moon hashes the AMBIENT value of env-var
    # `inputs`, keeping them out of every job's environment is what keeps `bundle-e2e` hashing
    # identically across jobs. Do not add them to a workflow env block.
    env:
      # Production edge — e2e must exercise what users hit, not a dev-tier worker.
      DX_EDGE_BASE_URL: 'https://dxos.network'
      DX_TELEMETRY_TAG: e2e
      # The service worker breaks `page.route` interception.
      DX_PWA: 'false'
    deps:
      - test-utils:build
      - vite-plugin-icons:build
      - target: ^:build
        optional: true
      # `bundle-e2e`, not `bundle` with an `env` override: an override is hashed into the dependency, so
      # it yields a bundle no other invocation can hydrate. Optional — only two apps define it.
      - target: bundle-e2e
        optional: true
    inputs:
      - src/playwright/playwright.config.ts
      - '@group(sources)'
      - '@group(tests)'
      - $CI
      - $CONFIG_DYNAMIC
      - $DX_E2E_RUN_ID
      - $DX_ENVIRONMENT
      - $DX_HOST
      - $DX_HUB_URL
      - $DX_IPDATA_API_KEY
      - $DX_SHARED_WORKER
      - $PLAYWRIGHT_BROWSER

inheritedBy:
  tags: e2e
