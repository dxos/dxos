# For vendored deps.
# I.e. external deps that we pre-build in our monorepo to eliminate tooling inconsistencies.

$schema: https://moonrepo.dev/schemas/tasks.json
tasks:
  build:
    # Runs under bun, by absolute path rather than `pnpm exec` — pnpm's `.bin` shim hardcodes
    # `exec node` and ignores the target's shebang. See `tag-ts-build.yml` for the full note.
    command: bun $workspaceRoot/tools/dx-compile/cli.js
    args:
      - --outputPath=dist/lib
    deps:
      - dx-compile:build
      - ^:build
    inputs:
      - '@group(production)'
    outputs:
      - dist/lib/
    options:
      timeout: 10

inheritedBy:
  tags: vendor
