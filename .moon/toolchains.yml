# https://moonrepo.dev/docs/config/toolchain

javascript:
  packageManager: pnpm
  dedupeOnLockfileChange: false

# Declared so moon installs it from .prototools, as it does node and pnpm — otherwise a bare `bun`
# resolves to whatever the CI image ships, which silently compiled the CLI with 1.3.4.
bun: {}

node: {}

pnpm: {}

typescript:
  rootOptionsConfigFileName: 'tsconfig.base.json'
  syncProjectReferences: false
  syncProjectReferencesToPaths: false

# Keys every task on the third-party packages its project can load: tools/moon-dependency-closure.
dependency-closure:
  plugin: 'file://../tools/moon-dependency-closure/dependency-closure.wasm'
