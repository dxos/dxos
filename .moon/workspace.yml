# https://moonrepo.dev/docs/config/workspace
$schema: ./cache/schemas/workspace.json

projects:
  - docs
  - packages/**/moon.yml
  - tools/*/moon.yml
  - vendor/*/moon.yml

# Self-hosted bazel-remote. Depot's hosted cache spent ~1,100 s hydrating a 324-task `:build`
# against this server's ~86 s from the same machine — see .agents/projects/depot-cache-benchmark.
# Certificates are materialised by `.github/actions/setup` in CI and by `tools/moon-cache/install-certs.sh`
# locally; without them moon silently falls back to local-cache-only, so the setup asserts they exist.
#
# Rollback to Depot is this block:
#   host: 'grpcs://cache.depot.dev'
#   auth:
#     token: 'DEPOT_TOKEN'
#     headers:
#       'X-Depot-Org': 't8fblrl00n'
remote:
  # Addressed by IP until `cache.dxos.network` has a DNS record — the server certificate carries
  # both, so switching to the name later needs no re-issue. moon disables the cache and continues
  # green when the host does not resolve, which is why this is not left pointing at a name that
  # does not exist yet.
  host: 'grpcs://64.225.13.237:9092'
  mtls:
    caCert: '.moon/certs/ca.pem'
    clientCert: '.moon/certs/client.pem'
    clientKey: '.moon/certs/client.key'
    domain: 'cache.dxos.network'

vcs:
  client: git
  defaultBranch: main
