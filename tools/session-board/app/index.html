<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="claude:viewport-fit-sides" content="cover" />
    <title>{{TITLE}}</title>
    <!-- Inline, so the page in an Artifact does not request /favicon.ico. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E"
    />
    <!-- Paints the theme's ground before the bundle runs, so a dark page does not flash white. -->
    <style>
      /* The theme's colours are light-dark() pairs, so the scheme must follow the theme: the Artifact frame pins light. */
      html {
        color-scheme: light;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #fafafa;
      }
      body {
        color: var(--color-fg);
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme='light']) {
          color-scheme: dark;
        }
        html:not([data-theme='light']),
        html:not([data-theme='light']) body {
          background: #0a0a0a;
        }
      }
      /* The side gutter clears a phone's system bar, as the viewport-fit-sides meta above promises. */
      #root {
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
      }
      html[data-theme='dark'],
      html[data-theme='dark'] body {
        background: #0a0a0a;
      }
      html[data-theme='dark'] {
        color-scheme: dark;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- cli.ts build replaces the placeholder with the board (session-board@1). -->
    <script type="application/json" id="board-data">
      {{BOARD}}
    </script>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
