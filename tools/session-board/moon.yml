layer: tool
language: typescript
tags:
  - typecheck
  - ts-test

tasks:
  # The prebuilt page `src/cli.ts build` fills; `template push` caches it in R2 so a session needs no build.
  build-page:
    command: node src/cli.ts template build
    deps:
      - vite-plugin-import-source:build
      - ui-theme:build
      - lit-ui:build
    inputs:
      - app/**/*
      - src/**/*
    outputs:
      - dist/app/
  test:
    options:
      mergeOutputs: replace
    outputs: []
