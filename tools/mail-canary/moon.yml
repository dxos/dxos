layer: tool
language: typescript
tags:
  - ts-compile
  - ts-test

# `test` (inherited) runs the unit tests in `Check`; its default tag filter excludes the live canary,
# tagged `sync-e2e`. `nightly` is that same task narrowed to the canary: it seeds the test account,
# waits for preview's sync and checks the space, so it is uncached and never part of `Check`.
tasks:
  # The test task inherits coverage/junit outputs this package never writes.
  test:
    options:
      mergeOutputs: replace
    outputs: []
  nightly:
    extends: test
    args:
      - src/nightly/canary.test.ts
    env:
      VITEST_TAGS_FILTER: sync-e2e
      # Identity recovery logs its device credential at info, and the job log is public.
      LOG_FILTER: warn
    options:
      cache: false
      runInCI: false
