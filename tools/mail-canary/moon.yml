layer: tool
language: typescript
tags:
  - ts-compile
  - ts-test

# `test` (inherited) runs the unit tests in `Check`; the live canary is tagged `sync-e2e`, which that
# task's default filter excludes. `nightly` is the live run against preview: it seeds the test
# account, waits for the sync and checks the space, so it is uncached and never part of `Check`.
tasks:
  nightly:
    command: bash -c 'pnpm exec vitest run --project=node --tagsFilter=sync-e2e src/canary.test.ts'
    deps:
      - cli:build
    options:
      cache: false
      runInCI: false
