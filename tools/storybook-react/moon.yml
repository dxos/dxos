layer: tool
language: typescript
tasks:
  #
  # Test locally via: npx http-server ./out/storybook-react
  #
  bundle:
    command: storybook build
    args:
      - --output-dir=out/storybook-react
    deps:
      # Ensure that all packages are built to run storybook.
      - '#ts-vite-build:build'
      - '#ts-compile:build'
      # Vendor bundles (e.g. `@dxos/vendor-hyperformula`) use the `vendor` tag, not
      # `ts-vite-build`/`ts-compile`, so they are not covered above; without their dist Vite's
      # dep-scan aborts.
      - '#vendor:build'
      # Storybook resolves packages straight from source, so anything *generated* — assets, sprites,
      # compiled shaders — is missing until its producer runs. Each such producer tags its task `prebuild`;
      # depending on their `build` instead would drag in ts-vite-build's recursive `^:build`.
      - '#storybook:#prebuild'
    inputs:
      - .storybook/*
      - /tools/storybook-react/.storybook/main.ts
      - static/*
      - $NODE_OPTIONS
    outputs:
      - out/storybook-react/
  # Static build of only the stories the chat perf flow loads (`assistant-e2e:e2e-perf`), which serves
  # it with `vite preview` so its stages measure the bundled app, not Vite serving unbundled modules.
  bundle-perf:
    command: storybook build
    args:
      - --output-dir=out/storybook-perf
    env:
      DX_STORIES: stories/stories-assistant
    deps:
      # See `bundle`.
      - '#ts-vite-build:build'
      - '#ts-compile:build'
      - '#vendor:build'
      - '#storybook:#prebuild'
    outputs:
      - out/storybook-perf/
    options:
      # The stories resolve every `@dxos/*` package from source, which no input list here can cover, and
      # a perf run must measure the checkout as it is.
      cache: false
  serve:
    # Wrapper, not `storybook dev` directly: it arms the hang watcher beside the server (see
    # `diagnose.sh`) and forwards every argument through.
    command: ./serve.sh
    args:
      - --port=9009
      - --no-open
    deps:
      # Build the full package closure the stories need, mirroring `bundle`. `^:build` alone only
      # covers storybook-react's own project deps, so on a fresh worktree it omits artifacts that
      # stories import transitively — e.g. `@dxos/vendor-hyperformula`'s bundle (Vite's dep-scan then
      # aborts and no story loads).
      - '#ts-vite-build:build'
      - '#ts-compile:build'
      # Vendor bundles (e.g. `@dxos/vendor-hyperformula`) use the `vendor` tag, not
      # `ts-vite-build`/`ts-compile`; their dist is what the dep-scan above needs.
      - '#vendor:build'
      # See `bundle` — generated sources and static assets, which hang off each package's `build` and so
      # are absent in a fresh worktree.
      - '#storybook:#prebuild'
    inputs:
      - .storybook/*
      - /tools/storybook-react/.storybook/main.ts
      - serve.sh
      - diagnose.sh
      - static/*
    preset: server
  # `serve` without its build deps, for restarting on a worktree whose `dist` is already built: those
  # deps are the same `:build` tasks another moon run (e.g. `composer-app:bundle`) may be running, and
  # moon does not coordinate across processes, so two runs rewrite the same `dist/types` at once.
  serve-nodeps:
    command: ./serve.sh
    args:
      - --port=9009
      - --no-open
    inputs:
      - .storybook/*
      - /tools/storybook-react/.storybook/main.ts
      - serve.sh
      - diagnose.sh
      - static/*
    preset: server
  # Fast dev variant: DX_FASTBUNDLE skips the `importSource` source-resolution plugin and
  # pre-bundles heavy deps, shrinking the live module graph so long sessions are less likely
  # to wedge the browser renderer. Trades granular HMR on DXOS source for lower memory/churn.
  serve-fast:
    # See `serve` — the wrapper arms the hang watcher and forwards to `storybook dev`.
    command: ./serve.sh
    args:
      - --port=9009
      - --no-open
    env:
      DX_FASTBUNDLE: '1'
    deps:
      # See `serve` — build the full closure so a fresh worktree has every artifact stories import.
      - '#ts-vite-build:build'
      - '#ts-compile:build'
      - '#vendor:build'
      # See `bundle` — generated sources and static assets the tag deps above never produce.
      - '#storybook:#prebuild'
    inputs:
      - .storybook/*
      - /tools/storybook-react/.storybook/main.ts
      - serve.sh
      - diagnose.sh
      - static/*
    preset: server
  # TODO(wittjosiah): No inputs or deps to avoid moon re-building things when running e2e tests.
  serve-e2e:
    command: storybook dev
    args:
      - --port=9009
      - --ci
      - --quiet
      - --config-dir=config/e2e
    preset: server
