layer: tool
language: typescript
tags:
  - ts-compile
  - ts-test

tasks:
  test:
    options:
      mergeOutputs: replace
    outputs: []
  # The Store, Reasoner and Indexer suites again, against the native backend. Needs a Rust toolchain,
  # which CI does not install (design/NATIVE-BACKEND.md § CI).
  native-test:
    command: vitest run --project=node src/Store.test.ts src/Reasoner.test.ts src/Indexer.test.ts
    env:
      CODE_INDEX_BACKEND: native
    deps:
      - code-index-native:cargo-build
    options:
      runInCI: false
