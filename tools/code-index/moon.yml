layer: tool
language: typescript
tags:
  - ts-compile
  - ts-test

tasks:
  test:
    # The store is the Rust addon, so the suite needs it built first.
    deps:
      - code-index-native:cargo-build
    options:
      mergeOutputs: replace
    outputs: []
  # Cold index, warm one-file reindex and store size on this repository.
  bench:
    command: bun scripts/bench.ts
    deps:
      - code-index-native:cargo-build
    options:
      cache: false
      runInCI: false
  # The design pipeline against plugin-illustrator's hand-drawn diagrams. Live and billed: System One
  # (TYPESAFE_API_KEY) and, with `-- --llm`, Anthropic for the LLM explorer — never in CI.
  design-eval:
    command: node --experimental-transform-types --no-warnings scripts/design-eval.ts
    options:
      cache: false
      runInCI: false
