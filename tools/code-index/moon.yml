layer: tool
language: typescript
tags:
  - ts-compile
  - ts-test

tasks:
  test:
    options:
      mergeOutputs: replace
    outputs: []
  # The Store, Reasoner, Indexer, Summary and MCP server suites again, against the native backend.
  # Needs a Rust toolchain, which CI does not install (design/NATIVE-BACKEND.md § CI).
  native-test:
    command: vitest run --project=node src/Store.test.ts src/Reasoner.test.ts src/Indexer.test.ts src/Summary.test.ts src/mcp/Server.test.ts
    env:
      CODE_INDEX_BACKEND: native
    deps:
      - code-index-native:cargo-build
    options:
      runInCI: false
  # Cold index, warm one-file reindex and store size on this repository, for each backend.
  bench:
    command: bun scripts/bench.ts
    deps:
      - code-index-native:cargo-build
    options:
      cache: false
      runInCI: false
  # The design pipeline against plugin-illustrator's hand-drawn diagrams. Live and billed: System One
  # (TYPESAFE_API_KEY) and, with `-- --llm`, Anthropic for the LLM explorer — never in CI.
  design-eval:
    command: node --experimental-transform-types --no-warnings scripts/design-eval.ts
    options:
      cache: false
      runInCI: false
