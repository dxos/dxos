layer: tool
language: typescript
description: Performance benchmarks for various DXOS systems

tasks:
  build:
    command: tsc
    outputs:
      - 'dist'
    options:
      runInCI: false

  echo:storage:
    command: node dist/echo-storage-benchmarks.js
    deps:
      - ':build'
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    options:
      runInCI: false

  property:access:
    command: node property-benchmarks-extended.js
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    options:
      runInCI: false
