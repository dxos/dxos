layer: tool
language: typescript
tags:
  - ts-compile

tasks:
  build:
    outputs:
      - 'dist'

  echo:storage:
    command: node dist/echo-storage-benchmarks.js
    deps:
      - ':build'
    env:
      NODE_OPTIONS: --max-old-space-size=4096

  property:access:
    command: node property-benchmarks-extended.js
    env:
      NODE_OPTIONS: --max-old-space-size=4096
