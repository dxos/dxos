layer: application
language: typescript
tags:
  - typecheck

tasks:
  studio:
    command: pnpm exec remotion studio
    preset: server

  render:
    command: node scripts/render.mjs
    inputs:
      - remotion.config.ts
      - '@group(sources)'
      - '@group(scripts)'
      - '@group(assets)'
    outputs:
      - out/**/*
    options:
      cache: false
      runInCI: false

  render-first-run:
    extends: render
    args: --first-run

  sounds:
    command: python3 scripts/make-sounds.py
    options:
      cache: false
      runInCI: false
