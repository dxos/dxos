# A Rust crate with no package.json; CI's setup action installs the toolchain `rust-toolchain.toml` pins.
layer: tool
language: rust

tasks:
  build-native:
    command: bash scripts/build.sh
    inputs:
      - src/**/*.rs
      - build.rs
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
    outputs:
      - code-index-native.node
  # `test-native`, not `test`: CI's `:test` sweep must not reach a Rust compile. Check's `native` job
  # runs every `:test-native`.
  test-native:
    command: cargo test
    inputs:
      - src/**/*.rs
      - tests/**/*.rs
      - tests/fixtures/*.n3
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - /tools/code-index/rules/*.n3
  # The synthetic engine benchmark; CODE_INDEX_BENCH_FILES scales it.
  cargo-bench:
    command: cargo bench
    options:
      cache: false
      runInCI: false
