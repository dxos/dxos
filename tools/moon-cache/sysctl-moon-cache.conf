# Deploy to /etc/sysctl.d/99-moon-cache.conf. See README item 8.
#
# bazel-remote's LRU index is several GB of live heap that every GC cycle walks. Paging any of it
# out turns each collection into a fault storm against the same disk the cache reads from. The
# default swappiness of 60 did exactly that. 1 rather than 0 keeps the swapfile as a safety net
# under a heap spike, where swapping is slow but an OOM kill costs a full index rebuild.
vm.swappiness = 1
