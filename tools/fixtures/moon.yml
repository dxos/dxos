layer: library
language: typescript
tags:
  - ts-compile

# Fixture transfer and inspection are developer actions against a private R2 bucket, never part of a
# build: every task is uncached and out of CI, and takes its arguments after `--`.
tasks:
  push:
    command: node bin/fixtures.mjs push
    options:
      cache: false
      runInCI: false

  pull:
    command: node bin/fixtures.mjs pull
    options:
      cache: false
      runInCI: false

  info:
    command: node bin/fixtures.mjs info
    options:
      cache: false
      runInCI: false
