layer: library
language: typescript
tags:
  - ts-compile
  - ts-test

tasks:
  # Sanity check over a pulled fixture; skips (rather than fails) wherever none is present.
  # Uncached: the fixture lives outside the project (and outside git), so moon cannot see it change —
  # a cached pass would report a corpus that is no longer there.
  test:
    options:
      cache: false
      mergeOutputs: replace
    outputs: []

  # Transfer is a developer action against a private R2 bucket, never part of a build: uncached,
  # never in CI, arguments after `--`.
  push:
    command: node bin/fixtures.mjs push
    options:
      cache: false
      runInCI: false

  pull:
    command: node bin/fixtures.mjs pull
    options:
      cache: false
      runInCI: false

  list:
    command: node bin/fixtures.mjs list
    options:
      cache: false
      runInCI: false
