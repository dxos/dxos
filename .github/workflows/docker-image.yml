name: Build and Push Docker Image

# TODO(depot-ci): stays on GitHub Actions. Pushes to ghcr.io via `secrets.GITHUB_TOKEN`, which Depot
# CI's jobs cannot authenticate with (GHCR only accepts PATs, not the GitHub App tokens Depot CI gets;
# flagged by CodeRabbit on #12779). Revisit once a write:packages PAT exists as a Depot secret - and
# consider swapping docker/build-push-action for `depot build --push` at the same time, since Depot's
# actual container-build product (not just Depot CI) is built for exactly this and would still need
# the same PAT for the registry side.

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - main
      - gh-docker
    paths:
      - .github/Dockerfile
      - .github/workflows/docker-image.yml
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/dxos/gh-actions
  DEFAULT_NODE_VERSION: 20.19.5
  IMAGE_TAG_SUFFIX: ''

jobs:
  build-and-push:
    strategy:
      matrix:
        node_version: ['20.19.5', '24.11.1']
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set suffix if on branch
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            BRANCH=${GITHUB_REF#refs/heads/}
            echo "IMAGE_TAG_SUFFIX=-${BRANCH//\//-}" >> $GITHUB_ENV
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .github
          file: .github/Dockerfile
          push: true
          build-args: |
            NODE_VERSION=${{ matrix.node_version }}
          # TODO(wittjosiah): Tag latest for the default node version.
          tags: |
            ${{ env.IMAGE_NAME }}:${{ matrix.node_version }}${{ env.IMAGE_TAG_SUFFIX }}
