name: Deploy Apps

# Single workflow for all app deploys. The deployable apps are listed in scripts/apps.mjs (a package dir
# per app); everything else — Worker name, bundle task, output dir, and which environments it targets — is
# derived from that app's `wrangler.jsonc`. The app set for an env follows its config's `env.*` sections:
# preview → all preview-enabled apps (auto, daily); dev → composer; staging → composer + docs;
# production → all. Fully decoupled from npm publishing.
#
# Production additionally cuts a versioned Composer release (bump composer-app/crx, commit to main, tag
# composer-v<x>) — the ONLY path that advances Composer's version (Composer is not in Changesets). The other
# apps are unversioned and just deploy. There are no separate release workflows; that logic is the
# production-only `release` job below. See the App deploys section of .github/RELEASE-SPEC.md.
#
# The `plan` job resolves the environment + which jobs run into named booleans, so every other job's `if:`
# is a plain `needs.plan.outputs.<flag> == 'true'` instead of an inline boolean soup.
#
# "What's deployed where" is tracked by per-app floating git tags `<app>/<environment>`. No GitHub
# Environments.

on:
  # Preview: `main`'s tip, once a day, rather than a deploy per commit. 07:00 UTC = 03:00 EDT / 02:00 EST
  # (cron has no timezone, so the wall-clock hour shifts by one across US DST).
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      environment:
        # Defaults the app set (each app's wrangler.jsonc `env.*`): dev → composer, preview → all,
        # staging → composer + docs, production → all. Choose the commit via the branch/tag selector.
        description: Target environment
        type: choice
        options: [dev, preview, staging, production]
        default: dev
      app:
        # Optional — deploy a single app instead of the whole environment (e.g. a docs hotfix to
        # production); still tagged per-app. `all` (default) deploys every app the environment targets.
        # (GitHub requires a choice default to be a listed option, hence `all` is the first entry.)
        description: App to deploy (default `all` = the whole environment)
        type: choice
        options: [all, composer, docs, storybook-react, todomvc, tasks, testbench]
        default: all
      bump:
        # Only used by the production `release` job (the Composer version bump); ignored otherwise.
        description: Composer version bump — production only
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  # One in-flight deploy per environment. Superseding is right everywhere except production, where the
  # `release` job has already pushed a commit and a `composer-v*` tag by the time the artifacts build —
  # cancelling there would strand a tagged release with nothing published against it.
  group: deploy-${{ inputs.environment || 'preview' }}
  cancel-in-progress: ${{ inputs.environment != 'production' }}

permissions:
  contents: read # `deploy` (pointer tags) and `tauri` (build-counter tags) opt in; the bump uses a PAT.

jobs:
  # Resolve the run into named booleans so downstream `if:` conditions stay readable. Outputs:
  #   env      — resolved environment (dev | preview | staging | production).
  #   app      — app to deploy, or `all`.
  #   release  — cut a versioned Composer release (production + Composer in the set).
  #   bundle   — build the shared Composer bundle (Composer in the set).
  #   tauri    — signed native build (Composer in the set — every environment ships a desktop app).
  #   ios      — also build iOS (`dev` only — see the `ios` input on deploy-tauri.yaml).
  plan:
    if: github.repository == 'dxos/dxos'
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.plan.outputs.env }}
      app: ${{ steps.plan.outputs.app }}
      release: ${{ steps.plan.outputs.release }}
      bundle: ${{ steps.plan.outputs.bundle }}
      tauri: ${{ steps.plan.outputs.tauri }}
      ios: ${{ steps.plan.outputs.ios }}
    steps:
      - id: plan
        env:
          IN_ENV: ${{ inputs.environment }}
          IN_APP: ${{ inputs.app }}
        run: |
          # Resolve the environment: the dispatch input, else `preview` (the scheduled run).
          env="${IN_ENV:-preview}"
          app="${IN_APP:-all}"

          # Does Composer participate? (drives release / bundle / tauri).
          composer=false; if [ "$app" = all ] || [ "$app" = composer ]; then composer=true; fi

          release=false; if [ "$env" = production ] && [ "$composer" = true ]; then release=true; fi
          bundle="$composer"
          tauri="$composer"
          ios=false;     if [ "$composer" = true ] && [ "$env" = dev ]; then ios=true; fi

          {
            echo "env=$env"
            echo "app=$app"
            echo "release=$release"
            echo "bundle=$bundle"
            echo "tauri=$tauri"
            echo "ios=$ios"
          } >> "$GITHUB_OUTPUT"
          echo "plan → env=$env app=$app composer=$composer | release=$release bundle=$bundle tauri=$tauri ios=$ios"

  # PRODUCTION ONLY — cut a versioned Composer release: bump composer-app/crx, record it on main, tag
  # composer-v<x>. The bumped commit is what the rest of the run builds + deploys (needs.release.outputs.sha).
  # No `Setup` step: the container image ships node + git, and the bump/sync-versions scripts use only Node
  # built-ins (no dependency install needed).
  release:
    needs: [plan]
    if: needs.plan.outputs.release == 'true'
    runs-on: depot-ubuntu-24.04-4
    container:
      image: ghcr.io/dxos/gh-actions:24.11.1
      credentials:
        username: dxos-bot
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main # A production release always cuts from main.
          # Leave no credential in the workspace: persisted, it would be readable by the repo-controlled
          # bump/sync scripts below, turning "can land a commit on main" into "can read dxos-bot's PAT".
          persist-credentials: false

      # composer-app + composer-crx share the desktop/extension version line; bump-composer-version.mjs bumps
      # both in lockstep and prints the new version. sync-versions.mjs then stamps the derived files.
      - name: Bump version
        id: bump
        run: |
          version=$(.github/workflows/scripts/bump-composer-version.mjs "${{ inputs.bump }}")
          node scripts/sync-versions.mjs
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Composer -> $version"

      # dxos-bot's PAT reaches only this step: main requires the merge queue and its push allow-list is
      # empty, so only an admin identity (dxos-bot, with enforce_admins off) can land the bump.
      - name: Commit + tag on main
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GH_DXOS_BOT_PAT }}
        run: |
          git config user.name 'dxos-bot'
          git config user.email 'bot@dxos.org'
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          git add -A
          # `[skip ci]` because a PAT push (unlike GITHUB_TOKEN) triggers workflows, and a Check + `main`
          # deploy of a version-bump-only commit would race this run's production deploy.
          git commit -m "composer: release v${{ steps.bump.outputs.version }} [skip ci]"

          # Rebase onto anything the merge queue landed while this run was bumping, rather than losing the
          # release to a non-fast-forward rejection.
          attempt=1
          while ! git push "$remote" HEAD:main; do
            if [ "$attempt" -ge 3 ]; then
              echo "::error::main moved under the release commit 3 times — rerun the workflow"
              exit 1
            fi
            attempt=$((attempt + 1))
            git pull --rebase "$remote" main
          done

          # Tagged after the push so the tag names the commit that actually landed (a rebase rewrites it).
          git tag "composer-v${{ steps.bump.outputs.version }}"
          git push "$remote" "refs/tags/composer-v${{ steps.bump.outputs.version }}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # The version every Composer artifact in this run carries — the web bundle and the native build alike,
  # so About, the feedback report and the updater all agree on what you are running. Production ships the
  # release job's clean version; every other environment gets `<next patch>-<env>.<build>`.
  #
  # The next patch, not the shipped one: a prerelease sorts below its own release, so numbering a preview
  # build against the shipped version would make it look like a downgrade from stable and nobody could move
  # to it. `<build>` counts that channel's builds of that base version, claimed by an immutable
  # `composer-<env>-<base>-<n>` tag — pushing the tag IS the claim, so a run that loses a race recounts
  # instead of shipping a duplicate number.
  version:
    needs: [plan, release]
    if: ${{ !cancelled() && needs.release.result != 'failure' && needs.plan.outputs.bundle == 'true' }}
    permissions:
      contents: write # Claims the build-counter tag.
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.sha || github.sha }}

      - id: version
        env:
          ENVIRONMENT: ${{ needs.plan.outputs.env }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          base=$(jq -r '.version' packages/apps/composer-app/package.json)
          if [ "$ENVIRONMENT" = production ]; then
            # The release job already bumped package.json; prefer its output when it ran.
            version="${RELEASE_VERSION:-$base}"
          else
            core="${base%%-*}"
            major="${core%%.*}"; rest="${core#*.}"
            minor="${rest%%.*}"; patch="${rest#*.}"
            base="${major}.${minor}.$((patch + 1))"

            prefix="composer-${ENVIRONMENT}-${base}-"
            attempt=1
            while :; do
              # -1 so the first build of a base version is 0, not 1 — it has to be distinguishable
              # from "the highest build so far is 0".
              last=-1
              while read -r _sha ref; do
                n="${ref#refs/tags/${prefix}}"
                case "$n" in '' | *[!0-9]*) continue ;; esac
                if [ "$n" -gt "$last" ]; then last="$n"; fi
              done < <(git ls-remote --tags origin "refs/tags/${prefix}*")

              build=$((last + 1))
              if git tag "${prefix}${build}" && git push origin "refs/tags/${prefix}${build}"; then
                break
              fi
              git tag -d "${prefix}${build}" || true
              if [ "$attempt" -ge 3 ]; then
                echo "::error::could not claim a build number for ${ENVIRONMENT} after 3 attempts"
                exit 1
              fi
              attempt=$((attempt + 1))
            done
            version="${base}-${ENVIRONMENT}.${build}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Composer version: $version (env=$ENVIRONMENT)"

  # Build Composer's web bundle ONCE and share it as an artifact so the web deploy + native (Tauri) jobs
  # don't each rebuild it.
  build-bundle:
    needs: [plan, release, version]
    if: ${{ !cancelled() && needs.release.result != 'failure' && needs.version.result == 'success' }}
    runs-on: depot-ubuntu-24.04-4
    container:
      image: ghcr.io/dxos/gh-actions:24.11.1
      credentials:
        username: dxos-bot
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 90
    env:
      DEPLOY_ENV: ${{ needs.plan.outputs.env }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
          # On production, the bumped release commit; otherwise the triggering commit.
          ref: ${{ needs.release.outputs.sha || github.sha }}

      - name: Set environment variables (Cloudflare creds, PostHog, …)
        run: .github/workflows/scripts/populate-env.sh "$DEPLOY_ENV" >> $GITHUB_ENV
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
          COMPOSER_APP_PROD_POSTHOG_API_KEY: ${{ secrets.COMPOSER_APP_PROD_POSTHOG_API_KEY }}
          COMPOSER_APP_PROD_POSTHOG_PROJECT_ID: ${{ secrets.COMPOSER_APP_PROD_POSTHOG_PROJECT_ID }}
          COMPOSER_APP_PROD_POSTHOG_FEEDBACK_SURVEY_ID: ${{ secrets.COMPOSER_APP_PROD_POSTHOG_FEEDBACK_SURVEY_ID }}
          COMPOSER_APP_TEST_POSTHOG_API_KEY: ${{ secrets.COMPOSER_APP_TEST_POSTHOG_API_KEY }}
          COMPOSER_APP_TEST_POSTHOG_PROJECT_ID: ${{ secrets.COMPOSER_APP_TEST_POSTHOG_PROJECT_ID }}
          COMPOSER_APP_TEST_POSTHOG_FEEDBACK_SURVEY_ID: ${{ secrets.COMPOSER_APP_TEST_POSTHOG_FEEDBACK_SURVEY_ID }}
          DX_POSTHOG_API_HOST: ${{ secrets.DX_POSTHOG_API_HOST }}
          IPDATA_API_KEY: ${{ secrets.IPDATA_API_KEY }}
          IPFS_API_SECRET: ${{ secrets.IPFS_API_SECRET }}

      - name: Setup
        uses: ./.depot/actions/setup
        with:
          remote-cache: 'false'

      # Stamp the version BEFORE the bundle: `runtime.app.build.version` (what About and the feedback
      # report show) is read out of package.json at vite build time, so a bundle built without this
      # would report the last shipped version on a preview build.
      - name: Stamp the Composer version
        run: |
          jq --arg version "$VERSION" '.version = $version' packages/apps/composer-app/package.json > version.tmp
          mv version.tmp packages/apps/composer-app/package.json
        env:
          VERSION: ${{ needs.version.outputs.version }}

      # Build only — the artifact is deployed by `deploy` and embedded by the tauri jobs.
      - name: Build Composer bundle
        run: .github/workflows/scripts/bundle-env.mjs "$DEPLOY_ENV" composer
        env:
          NODE_ENV: production

      - name: Upload Composer bundle
        uses: actions/upload-artifact@v4
        with:
          name: composer-bundle
          path: packages/apps/composer-app/out/composer
          include-hidden-files: true
          retention-days: 1

  deploy:
    needs: [plan, release, version, build-bundle]
    # Run once the prep jobs succeeded or were skipped (static-only app sets); skip only on a failure.
    # `version` must be here explicitly: its failure leaves `build-bundle` *skipped* (not failed), which
    # would otherwise pass the build-bundle check and let this job rebuild Composer inline from the
    # un-stamped package.json — deploying a bundle that reports the previous release's version.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.release.result != 'failure' && needs.version.result != 'failure' && needs.build-bundle.result != 'failure' }}
    permissions:
      contents: write # Force-updates the per-app `<app>/<env>` deploy pointer tags.
    runs-on: depot-ubuntu-24.04-4
    container:
      image: ghcr.io/dxos/gh-actions:24.11.1
      credentials:
        username: dxos-bot
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 90
    env:
      DEPLOY_ENV: ${{ needs.plan.outputs.env }}
      DEPLOY_APP: ${{ needs.plan.outputs.app }}
      DEPLOY_REF: ${{ needs.release.outputs.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
          ref: ${{ needs.release.outputs.sha || github.sha }}

      # Needed before "Check app targets this environment" — apps.mjs imports json5 from node_modules.
      - name: Setup
        uses: ./.depot/actions/setup
        with:
          remote-cache: 'false'

      # Catches e.g. `app=storybook-react` on an environment it doesn't define (no env.staging/dev) —
      # before this existed, bundle-env.mjs/deploy-env.mjs silently no-op'd and the job still went green
      # with a false "succeeded" Discord ping despite deploying nothing. The failure notification checks
      # this step's conclusion so an invalid combo posts nothing either way.
      - name: Check app targets this environment
        id: validate
        run: |
          resolved=$(.github/workflows/scripts/apps.mjs "$DEPLOY_ENV" "$DEPLOY_APP")
          if [ -z "$resolved" ]; then
            valid=$(.github/workflows/scripts/apps.mjs "$DEPLOY_ENV" all | paste -sd, - | sed 's/,/, /g')
            echo "::error::\"$DEPLOY_APP\" has no env.$DEPLOY_ENV — nothing would be deployed. Apps with that env: ${valid:-(none)}"
            exit 1
          fi

      # Select the env file by the DEPLOY environment (not the git branch) — environment is a deploy
      # parameter, so a production deploy running from main must still read env/production.
      - name: Set environment variables (Cloudflare creds, PostHog, …)
        run: .github/workflows/scripts/populate-env.sh "$DEPLOY_ENV" >> $GITHUB_ENV
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
          COMPOSER_APP_PROD_POSTHOG_API_KEY: ${{ secrets.COMPOSER_APP_PROD_POSTHOG_API_KEY }}
          COMPOSER_APP_PROD_POSTHOG_PROJECT_ID: ${{ secrets.COMPOSER_APP_PROD_POSTHOG_PROJECT_ID }}
          COMPOSER_APP_PROD_POSTHOG_FEEDBACK_SURVEY_ID: ${{ secrets.COMPOSER_APP_PROD_POSTHOG_FEEDBACK_SURVEY_ID }}
          COMPOSER_APP_TEST_POSTHOG_API_KEY: ${{ secrets.COMPOSER_APP_TEST_POSTHOG_API_KEY }}
          COMPOSER_APP_TEST_POSTHOG_PROJECT_ID: ${{ secrets.COMPOSER_APP_TEST_POSTHOG_PROJECT_ID }}
          COMPOSER_APP_TEST_POSTHOG_FEEDBACK_SURVEY_ID: ${{ secrets.COMPOSER_APP_TEST_POSTHOG_FEEDBACK_SURVEY_ID }}
          DX_POSTHOG_API_HOST: ${{ secrets.DX_POSTHOG_API_HOST }}
          IPDATA_API_KEY: ${{ secrets.IPDATA_API_KEY }}
          IPFS_API_SECRET: ${{ secrets.IPFS_API_SECRET }}

      # Reuse the prebuilt Composer bundle when the prep job produced one — populating out/composer means
      # bundle-env.mjs reuses it instead of rebuilding.
      - name: Download Composer bundle
        if: needs.build-bundle.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: composer-bundle
          path: packages/apps/composer-app/out/composer

      # Build any selected app not already present (bundle-env.mjs skips populated output dirs), then deploy.
      # DEPLOY_APP defaults to `all` (the whole environment); a single app narrows it (e.g. a docs hotfix).
      - name: Bundle apps
        run: .github/workflows/scripts/bundle-env.mjs "$DEPLOY_ENV" "$DEPLOY_APP"
        env:
          NODE_ENV: production

      - name: Deploy apps
        run: .github/workflows/scripts/deploy-env.mjs "$DEPLOY_ENV" "$DEPLOY_APP"
        env:
          NODE_ENV: production

      # Floating pointer to the SHA deployed for each app+env (the branch-pointer replacement). Every env
      # tags each app it deployed — per-app even for `all`, so an individual redeploy (hotfix) moves only
      # that app's tag. Preview carries one too: it is a daily snapshot of `main`, not `main` itself, so
      # the branch tip is no longer an answer to "what is on preview?".
      - name: Update deploy pointer tags
        run: |
          for app in $(.github/workflows/scripts/apps.mjs "$DEPLOY_ENV" "$DEPLOY_APP"); do
            tag="${app}/${DEPLOY_ENV}"
            git tag -f "$tag" "$DEPLOY_REF"
            git push -f origin "refs/tags/$tag"
          done

      # Every environment but `preview`: a dispatched deploy is sporadic, so its success is news to whoever
      # pressed the button. Preview lands at the same time every day and can be assumed to have worked —
      # its failure still notifies below. No "started" ping either way; the deploy is no longer slow enough
      # for one to earn its place.
      - name: Notify Discord — deploy succeeded
        if: success() && env.DEPLOY_ENV != 'preview'
        continue-on-error: true
        env:
          DX_DISCORD_WEBHOOK_URL: ${{ secrets.DX_DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          payload=$(jq -nc --arg env "$DEPLOY_ENV" --arg app "$DEPLOY_APP" --arg url "$RUN_URL" \
            '{content: (":white_check_mark: Deployed **" + $app + "** to `" + $env + "`\nRun: " + $url)}')
          curl -sS --fail-with-body -X POST "$DX_DISCORD_WEBHOOK_URL" -H "Content-Type: application/json" -d "$payload"

      # Unconditional, preview included — a silent preview deploy is only safe to read as success if a
      # broken one says so.
      - name: Notify Discord — deploy failed
        # Skip only when it was the "app targets this environment" check that failed — that's an invalid
        # app/environment combo caught before any deploy was attempted, not a real deploy failure. Anything
        # earlier (Checkout, Setup) leaves `validate` skipped and must still notify.
        if: failure() && steps.validate.conclusion != 'failure'
        continue-on-error: true
        env:
          DX_DISCORD_WEBHOOK_URL: ${{ secrets.DX_DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          payload=$(jq -nc --arg env "$DEPLOY_ENV" --arg app "$DEPLOY_APP" --arg url "$RUN_URL" \
            '{content: (":x: Deploy of **" + $app + "** to `" + $env + "` failed\nRun: " + $url)}')
          curl -sS --fail-with-body -X POST "$DX_DISCORD_WEBHOOK_URL" -H "Content-Type: application/json" -d "$payload"

  # A run that breaks before `deploy` must still say so: a prep failure (release, version, build-bundle)
  # skips `deploy`, so its own failure ping never fires — and since preview successes are deliberately
  # silent, a silent broken preview deploy would read as a good one.
  notify-prep-failure:
    needs: [plan, release, version, build-bundle]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.release.result == 'failure' || needs.version.result == 'failure' || needs.build-bundle.result == 'failure') }}
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      DEPLOY_ENV: ${{ needs.plan.outputs.env }}
      DEPLOY_APP: ${{ needs.plan.outputs.app }}
    steps:
      - name: Notify Discord — deploy preparation failed
        env:
          DX_DISCORD_WEBHOOK_URL: ${{ secrets.DX_DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          payload=$(jq -nc --arg env "$DEPLOY_ENV" --arg app "$DEPLOY_APP" --arg url "$RUN_URL" \
            '{content: (":x: Deploy of **" + $app + "** to `" + $env + "` failed before deploying (release/version/build)\nRun: " + $url)}')
          curl -sS --fail-with-body -X POST "$DX_DISCORD_WEBHOOK_URL" -H "Content-Type: application/json" -d "$payload"

  # Desktop/mobile build for Composer — every environment ships a desktop app, so dogfooders on the
  # preview channel get the same daily build the web deploy does. iOS ships on `dev` alone for now (see the
  # `ios` input). CrabNebula channel is derived from the environment inside the reusable workflow. On
  # production it builds the bumped release commit.
  #
  # TODO(wittjosiah): this job (and deploy-tauri.yaml, which it calls) keeps this workflow on GitHub Actions rather
  # than Depot CI — deploy-tauri.yaml's build_tauri/build_tauri_ios jobs need depot-macos-latest, and
  # Depot CI's own orchestrator has no macOS sandboxes yet. Revisit once Depot CI supports macOS runners.
  tauri:
    needs: [plan, release, version, build-bundle]
    if: ${{ !cancelled() && needs.release.result != 'failure' && needs.build-bundle.result == 'success' && needs.plan.outputs.tauri == 'true' }}
    uses: ./.github/workflows/deploy-tauri.yaml
    with:
      environment: ${{ needs.plan.outputs.env }}
      ref: ${{ needs.release.outputs.sha || github.sha }}
      ios: ${{ needs.plan.outputs.ios == 'true' }}
      version: ${{ needs.version.outputs.version }}
    secrets: inherit
