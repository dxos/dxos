# Measures a Blacksmith runner with a sticky disk holding moon's cache, against the current
# Depot-runner baseline. Dispatch only — this is an experiment, not a check.
#
# Three unknowns it exists to settle, in order of how likely they are to sink the idea:
#   1. Does the sticky disk mount reach inside the job container? Jobs run in
#      ghcr.io/dxos/gh-actions, and the mount happens on the runner.
#   2. How fast is hydration off a bind-mounted clone, against the 86 s (self-hosted
#      bazel-remote) and 1,100 s (Depot) measured in .agents/projects/ci/REPORT.md?
#   3. Do the local-cache hits actually materialise, or does moon re-hash and rebuild anyway?
#
# Run it twice: once to populate and commit the snapshot, once to measure hydration.
name: Bench Blacksmith

on:
  # `workflow_dispatch` only fires for workflows already on the default branch, and `main` is
  # protected — so until this lands, the branch-scoped push trigger is the only way to run it.
  # REMOVE the push trigger before merging.
  push:
    branches:
      - claude/depot-vs-self-hosted-cache-3fbd62
  workflow_dispatch:
    inputs:
      remote_cache:
        description: 'Keep the remote cache enabled alongside the sticky disk.'
        type: boolean
        default: false
      runner:
        description: 'Blacksmith runner label.'
        default: 'blacksmith-8vcpu-ubuntu-2404'

jobs:
  bench:
    runs-on: ${{ inputs.runner || 'blacksmith-8vcpu-ubuntu-2404' }}
    container:
      image: ghcr.io/dxos/gh-actions:24.11.1
      credentials:
        username: dxos-bot
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Keyed per job rather than per repository: concurrent jobs never share a live disk, and on
      # a shared key the last one to finish would be the only one whose artifacts survive.
      - name: Mount moon cache
        uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-moon-cache-${{ github.job }}
          path: .moon/cache

      - name: Report mount state
        run: |
          echo "mounted at .moon/cache:"
          df -h .moon/cache || echo "  (not a separate mount — the sticky disk did not reach the container)"
          du -sh .moon/cache 2>/dev/null || echo "  (empty)"
        shell: bash

      # The sticky-disk arm runs with the remote cache off, so it must not require the
      # certificates — otherwise this job cannot run until the secrets exist.
      - name: Setup
        uses: ./.github/actions/setup
        with:
          cache-ca-pem: ${{ secrets.MOON_CACHE_CA_PEM }}
          cache-client-pem: ${{ secrets.MOON_CACHE_CLIENT_PEM }}
          cache-client-key: ${{ secrets.MOON_CACHE_CLIENT_KEY }}
          cache-certs-optional: 'true'

      # MOON_REMOTE_HOST wins over .moon/workspace.yml, so an unroutable host disables the remote
      # cache without editing config — the sticky disk is then the only thing under test.
      - name: Build
        run: |
          start=$(date +%s)
          if [ "${{ inputs.remote_cache }}" = "true" ]; then
            moon run :build
          else
            MOON_REMOTE_HOST='grpc://127.0.0.1:1' moon run :build
          fi
          echo "wall_s=$(( $(date +%s) - start ))"
        shell: bash

      - name: Report cache breakdown
        if: always()
        run: |
          node -e '
            const report = require("./.moon/cache/runReport.json");
            const ms = (op) => (op.duration?.secs ?? 0) * 1000 + (op.duration?.nanos ?? 0) / 1e6;
            const totals = { local_hits: 0, local_ms: 0, remote_hits: 0, remote_ms: 0, executed: 0, exec_ms: 0, hash_ms: 0 };
            for (const action of report.actions) {
              for (const op of action.operations ?? []) {
                const dur = ms(op);
                if (op.meta?.type === "output-hydration" && op.status === "cached") { totals.local_hits++; totals.local_ms += dur; }
                if (op.meta?.type === "output-hydration" && op.status === "cached-from-remote") { totals.remote_hits++; totals.remote_ms += dur; }
                if (op.meta?.type === "task-execution") { totals.executed++; totals.exec_ms += dur; }
                if (op.meta?.type === "hash-generation") { totals.hash_ms += dur; }
              }
            }
            for (const [key, value] of Object.entries(totals)) console.log(`${key}: ${Math.round(value)}`);
          '
          echo "sticky disk size after the run:"
          du -sh .moon/cache
        shell: bash
