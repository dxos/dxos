name: Deploy Docs Daily

# Publishes blog posts whose `date` has arrived (docs/src/utils/blog.ts), so posts can merge ahead of their
# publish date. Dispatches Deploy Apps with inputs rather than adding a cron there: a scheduled run carries no
# inputs, so the deploy would have to special-case the cron string, while a dispatch runs exactly like a
# manual one (same inputs, same production concurrency group, same per-app tags).
#
# Skips the dispatch when the build would match what is live: `docs/` is unchanged since the `docs/production`
# pointer tag and every post whose date has arrived is already in the live RSS feed. Both checks compare against
# production rather than the calendar, so a failed deploy is retried the next day. Changes outside `docs/` (e.g.
# the typedoc packages) ship with the next docs change.

on:
  schedule:
    # 12:00 UTC = 08:00 EDT / 07:00 EST.
    - cron: '0 12 * * *'

permissions:
  actions: write # `gh workflow run`; a dispatch is the one event a GITHUB_TOKEN may start a run with.
  contents: read

jobs:
  dispatch:
    if: github.repository == 'dxos/dxos'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          filter: blob:none
          sparse-checkout: docs/src/content/blog

      - name: Check for unpublished docs changes
        id: changes
        run: |
          if ! git fetch --depth=1 --filter=blob:none origin '+refs/tags/docs/production:refs/tags/docs/production'; then
            echo "No docs/production tag; deploying."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git diff-tree --quiet refs/tags/docs/production HEAD -- docs; then
            echo "docs/ changed since $(git rev-parse --short refs/tags/docs/production)."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A post merged ahead of its date is in the tagged build but not on the site until a deploy on or after
          # that date. The 14-day window stops a post the feed never lists from forcing a deploy every day.
          if ! feed=$(curl -fsSL --retry 3 https://dxos.org/blog/rss.xml); then
            echo "Could not fetch the live RSS feed; deploying."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          today=$(date -u +%F)
          since=$(date -u -d '14 days ago' +%F)
          for post in docs/src/content/blog/*.md*; do
            grep -qE '^draft: true' "$post" && continue
            date=$(sed -nE "s/^date: ['\"]?([0-9]{4}-[0-9]{2}-[0-9]{2}).*/\1/p" "$post" | head -1)
            slug=$(sed -nE "s/^slug: ['\"]?([^'\"]+)['\"]?\$/\1/p" "$post" | head -1)
            [[ -z "$date" || -z "$slug" || "$date" > "$today" || "$date" < "$since" ]] && continue
            if ! grep -qF "/blog/${slug}/</link>" <<< "$feed" && ! grep -qF "/blog/${slug}</link>" <<< "$feed"; then
              echo "$post is dated ${date} but not live."
              echo "deploy=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "docs/ unchanged and every post dated through ${today} is live; skipping."
          echo "deploy=false" >> "$GITHUB_OUTPUT"

      - name: Dispatch Deploy Apps (production, docs)
        if: steps.changes.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-apps.yml --repo "$GITHUB_REPOSITORY" --ref main -f environment=production -f app=docs
