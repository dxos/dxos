name: Publish

# npm publishing for Group A (core/SDK) and Group B (plugins + cli). This filename is load-bearing: npm's
# OIDC trusted publisher is configured against `publish-all.yml`, so every `changeset publish` MUST run from
# here (a different filename fails OIDC). Two flows, by trigger:
#
#   - push to main (automatic → @latest): maintain the Changesets "Version Packages" PR; merging that PR
#     publishes the bumped packages to npm @latest with provenance, then tags and releases each version group.
#     The merge publishes even when other PRs have landed more changesets on main since the PR was last
#     refreshed; those wait for the next Version PR. The human gate is merging the PR — nobody runs
#     changeset/publish locally, and the PR is maintained by dxos-bot's PAT so Check runs on it like any
#     other PR.
#   - manual workflow_dispatch (→ @next): cut a SNAPSHOT pre-release — `changeset version --snapshot next`
#     then `changeset publish --tag next`. Ephemeral versions, no commit, no git tags, no `pre` mode.
#
# Apps deploy via deploy-apps.yml (which also cuts the versioned Composer production release), never here.
#
# TODO(wittjosiah): stays on GitHub Actions, for two independent reasons (flagged by CodeRabbit on
# #12779): npm's trusted-publisher OIDC only trusts GitHub-hosted Actions runners (plus GitLab.com and
# CircleCI cloud) - Depot CI's runner identity isn't one of them, so the `id-token: write` provenance
# flow would fail there. Separately, this job's `container:` pulls ghcr.io/dxos/gh-actions using
# `secrets.GITHUB_TOKEN`, which doesn't authenticate to GHCR from Depot CI either. The OIDC constraint
# alone is enough to keep this on GitHub Actions regardless of the GHCR one.

on:
  push:
    branches:
      - main
  workflow_dispatch: {} # Manual dispatch = a @next snapshot pre-release (pick the commit via the ref selector).

# Release runs queue in their own group. GitHub keeps one pending run per group and cancels it when a newer one
# arrives, so in a shared group an ordinary push landing while the release run waited would cancel the release,
# and no later push triggers a publish. The release test is the same as the job's `RELEASE` below; concurrency
# is evaluated before the job, so it cannot read the job's env.
concurrency:
  group: publish-${{ github.ref }}${{ github.event_name == 'push' && contains(format('::commit::{0}', join(github.event.commits.*.message, '::commit::')), '::commit::Version packages (#') && '-release' || '' }}
  cancel-in-progress: false

permissions:
  # Both write scopes are dormant — the @latest flow writes as GH_DXOS_BOT_PAT — but are kept so reverting
  # the changesets step to GITHUB_TOKEN stays a one-line change.
  contents: write # Version Packages branch + git tags (@latest flow).
  pull-requests: write # Maintain the Version Packages PR.
  id-token: write # npm trusted-publisher OIDC + provenance.

jobs:
  publish:
    if: github.repository == 'dxos/dxos'
    # GitHub-hosted runner required for npm provenance (sigstore attestation).
    runs-on: ubuntu-24.04-4
    container:
      image: ghcr.io/dxos/gh-actions:24.11.1
      credentials:
        username: dxos-bot
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 90
    env:
      # True when the push contains the squash-merged Version PR, whose message starts `Version packages (#N)`.
      # The merge queue lands up to five PRs in one push, so every commit is checked, not just `head_commit`.
      # Expressions have no per-line or regex match, so the messages are joined with a marker in front of
      # each; `marker + subject` then matches only a message that starts with the subject, and a PR titled
      # "fix the Version packages PR" does not trigger a release.
      RELEASE: ${{ github.event_name == 'push' && contains(format('::commit::{0}', join(github.event.commits.*.message, '::commit::')), '::commit::Version packages (#') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # changesets/action pushes over a `~/.netrc` it writes from `github-token`, and a persisted
          # checkout credential outranks netrc (`http.extraheader` is an explicit Authorization header),
          # which would silently put the Version PR's commits back on GITHUB_TOKEN.
          persist-credentials: false

      # This repo does not use Changesets `pre` mode — the @next channel uses snapshot releases instead.
      # A stray `.changeset/pre.json` would silently turn a stable publish into a pre-release, so fail fast.
      - name: Guard against pre-release state on main
        run: |
          if [ -f .changeset/pre.json ]; then
            echo "::error::.changeset/pre.json present — @next uses snapshot releases, not pre mode. Remove it (changeset pre exit)."
            exit 1
          fi

      - name: Setup
        uses: ./.depot/actions/setup
        with:
          # Published artifacts are built from source, never trusted from a cache any CI job can
          # write to — the same reasoning as the isolated pnpm scope below.
          remote-cache: 'false'
          # Isolate publish cache from PR caches (cache-poisoning defense).
          cache-scope: publish
          verify-integrity: 'true'

      # @next (dispatch): stamp ephemeral snapshot versions for packages with pending changesets, then
      # mirror them into version.ts / tauri.conf.json — before the build, so it builds the snapshot version.
      # No commit, no lockfile rewrite; the bump is throwaway.
      - name: Version (snapshot)
        if: github.event_name == 'workflow_dispatch'
        run: |
          # Changesets v3 makes `changeset version` exit 1 when nothing is pending, so gate on the
          # presence of a changeset file to keep an empty @next dispatch a no-op rather than a failure.
          if ls .changeset/*.md 2>/dev/null | grep -qv '^\.changeset/README\.md$'; then
            pnpm exec changeset version --snapshot next
            node scripts/sync-versions.mjs
          else
            echo 'No pending changesets — skipping snapshot version.'
          fi

      # Only runs that publish need a build: an ordinary push just refreshes the Version PR.
      - name: Build
        if: env.RELEASE == 'true' || github.event_name == 'workflow_dispatch'
        run: moon run :build
        env:
          NODE_ENV: production

      # Shell must be bundled before npm publish.
      - name: Bundle Shell
        if: env.RELEASE == 'true' || github.event_name == 'workflow_dispatch'
        run: moon run shell:bundle
        env:
          NODE_ENV: production

      # @latest (release push): publish every package whose version npm does not have yet. This runs directly
      # rather than through changesets/action, which publishes only when no changesets are pending: one
      # changeset landing on main between the Version PR's last refresh and its merge turned the 0.12.0 merge
      # into a version-only run, and nothing reached npm. `changeset publish` reads package.json versions and
      # ignores pending changesets. It also skips versions already on npm, so re-running a failed release run
      # picks up where it stopped.
      #
      # `--no-git-tag`: the tag step below tags once per group. Per-package tags meant ~300 back-to-back
      # single-ref pushes, and GitHub's ref backend rejected about half with `fatal error in commit_refs`.
      - name: Publish (@latest)
        if: env.RELEASE == 'true'
        run: pnpm changeset:publish --no-git-tag
        env:
          NPM_CONFIG_PROVENANCE: 'true' # provenance via OIDC; trusted publisher means no NPM_TOKEN.

      # `changeset publish` cannot ship the CLI: `@dxos/cli` is `private`, and what it actually ships is one
      # prebuilt binary per platform generated into `dist/`, so neither is a workspace member Changesets can
      # see. Runs before the tag step so a failed CLI publish is not tagged as a complete release.
      - name: Publish the CLI (@latest)
        if: env.RELEASE == 'true'
        run: moon run cli:publish
        env:
          NODE_ENV: production
          # Baked into the binary by `scripts/build.ts` rather than committed. A build without it
          # reports nowhere, so a fork's binary cannot land in this project.
          DX_CLI_POSTHOG_API_KEY: ${{ secrets.DX_CLI_POSTHOG_API_KEY }}
          NPM_CONFIG_PROVENANCE: 'true' # provenance via OIDC; trusted publisher means no NPM_TOKEN.

      - name: Publish the CLI (@next snapshot)
        if: github.event_name == 'workflow_dispatch'
        run: moon run cli:publish -- --tag next
        env:
          NODE_ENV: production
          DX_CLI_POSTHOG_API_KEY: ${{ secrets.DX_CLI_POSTHOG_API_KEY }}
          NPM_CONFIG_PROVENANCE: 'true'

      # One tag + one GitHub Release per lockstep group (`v<version>` for core/SDK, `plugins-v<version>` for
      # plugins + CLI), both refs in a single push. No `always()`/`!cancelled()`: a failed publish must not be
      # tagged, and a plain `if:` keeps the implicit "previous steps succeeded" requirement. `--ref` names the
      # commit this run built and published.
      - name: Tag + release groups (@latest)
        if: env.RELEASE == 'true'
        run: |
          git config user.name 'dxos-bot'
          git config user.email 'bot@dxos.org'
          node scripts/release-groups.mjs --ref "$GITHUB_SHA"
        env:
          # Carries both the tag push (the checkout persists no credentials) and the Releases API calls.
          GH_TOKEN: ${{ secrets.GH_DXOS_BOT_PAT }}

      # @latest (ordinary push): open or refresh the "Version Packages" PR from pending changesets. There is no
      # `publish` input, so this step never publishes; with nothing pending it does nothing. Release runs skip
      # it: they queue in their own concurrency group and can overlap an ordinary run, and two runs would race
      # to force-push `changeset-release/main`. Changesets a release leaves pending get their PR on the next
      # ordinary push.
      - name: Version PR (@latest)
        if: github.event_name == 'push' && env.RELEASE != 'true'
        uses: changesets/action@v1
        with:
          # dxos-bot's PAT, not GITHUB_TOKEN: GitHub's recursion guard parks every `pull_request` run a
          # GITHUB_TOKEN update triggers in `action_required`, so a GITHUB_TOKEN-owned Version PR reports
          # zero check runs until a human approves each one by hand. The action reads
          # `process.env.GITHUB_TOKEN` ahead of this input, so that env var must stay unset here.
          github-token: ${{ secrets.GH_DXOS_BOT_PAT }}
          version: pnpm changeset:version
          commit: 'Version packages'
          title: 'Version packages'

      # @next (dispatch): publish the snapshot versions under the `next` dist-tag. --no-git-tag: snapshots
      # are ephemeral and never tagged. No-op when no changesets are pending.
      - name: Publish @next (snapshot)
        if: github.event_name == 'workflow_dispatch'
        run: pnpm exec changeset publish --tag next --no-git-tag
        env:
          NPM_CONFIG_PROVENANCE: 'true' # provenance via OIDC; trusted publisher means no NPM_TOKEN.
