name: Publish

# npm publishing for Group A (core/SDK) and Group B (plugins + cli). This filename is load-bearing: npm's
# OIDC trusted publisher is configured against `publish-all.yml`, so every `changeset publish` MUST run from
# here (a different filename fails OIDC). Two flows, by trigger:
#
#   - push to main (automatic → @latest): maintain the Changesets "Version Packages" PR; merging that PR
#     (a push with the versions bumped and no changesets left) publishes the bumped packages to npm @latest
#     with provenance, then tags and releases each version group. The human gate is merging the PR — nobody
#     runs changeset/publish locally, and the PR is maintained by dxos-bot's PAT so Check runs on it like any
#     other PR.
#   - manual workflow_dispatch (→ @next): cut a SNAPSHOT pre-release — `changeset version --snapshot next`
#     then `changeset publish --tag next`. Ephemeral versions, no commit, no git tags, no `pre` mode.
#
# Apps deploy via deploy-apps.yml (which also cuts the versioned Composer production release), never here.

on:
  push:
    branches:
      - main
  workflow_dispatch: {} # Manual dispatch = a @next snapshot pre-release (pick the commit via the ref selector).

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  # Both write scopes are dormant — the @latest flow writes as GH_DXOS_BOT_PAT — but are kept so reverting
  # the changesets step to GITHUB_TOKEN stays a one-line change.
  contents: write # Version Packages branch + git tags (@latest flow).
  pull-requests: write # Maintain the Version Packages PR.
  id-token: write # npm trusted-publisher OIDC + provenance.

jobs:
  publish:
    if: github.repository == 'dxos/dxos'
    # GitHub-hosted runner required for npm provenance (sigstore attestation).
    runs-on: ubuntu-24.04-4
    container:
      image: ghcr.io/dxos/gh-actions:24.11.1
      credentials:
        username: dxos-bot
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # changesets/action pushes over a `~/.netrc` it writes from `github-token`, and a persisted
          # checkout credential outranks netrc (`http.extraheader` is an explicit Authorization header),
          # which would silently put the Version PR's commits back on GITHUB_TOKEN.
          persist-credentials: false

      # This repo does not use Changesets `pre` mode — the @next channel uses snapshot releases instead.
      # A stray `.changeset/pre.json` would silently turn a stable publish into a pre-release, so fail fast.
      - name: Guard against pre-release state on main
        run: |
          if [ -f .changeset/pre.json ]; then
            echo "::error::.changeset/pre.json present — @next uses snapshot releases, not pre mode. Remove it (changeset pre exit)."
            exit 1
          fi

      - name: Setup
        uses: ./.github/actions/setup
        with:
          # Isolate publish cache from PR caches (cache-poisoning defense).
          cache-scope: publish
          verify-integrity: 'true'

      # @next (dispatch): stamp ephemeral snapshot versions for packages with pending changesets, then
      # mirror them into version.ts / tauri.conf.json — before the build, so it builds the snapshot version.
      # No commit, no lockfile rewrite; the bump is throwaway.
      - name: Version (snapshot)
        if: github.event_name == 'workflow_dispatch'
        run: |
          pnpm exec changeset version --snapshot next
          node scripts/sync-versions.mjs

      - name: Build
        run: moon run :build
        env:
          NODE_ENV: production

      # Shell must be bundled before npm publish.
      - name: Bundle Shell
        run: moon run shell:bundle
        env:
          NODE_ENV: production

      # @latest (push): when changesets exist, maintains/updates the "Version Packages" PR; when that PR is
      # merged (versions bumped, no changesets remain), runs the publish command instead.
      - name: Version PR or publish (@latest)
        if: github.event_name == 'push'
        uses: changesets/action@v1
        with:
          # dxos-bot's PAT, not GITHUB_TOKEN: GitHub's recursion guard parks every `pull_request` run a
          # GITHUB_TOKEN update triggers in `action_required`, so a GITHUB_TOKEN-owned Version PR reports
          # zero check runs until a human approves each one by hand. The action reads
          # `process.env.GITHUB_TOKEN` ahead of this input, so that env var must stay unset here.
          github-token: ${{ secrets.GH_DXOS_BOT_PAT }}
          version: pnpm changeset:version
          # `--no-git-tag`: tagging and releases are done per group by the next step, not per package. The
          # action pushes each tag it finds in the publish output as its own `git push`, and GitHub's ref
          # backend rejected roughly half of ~300 back-to-back single-ref pushes with `fatal error in
          # commit_refs`. Suppressing the tags at the source leaves that loop nothing to iterate over.
          publish: pnpm changeset:publish --no-git-tag
          # Per-package releases are replaced by one release per version group (see the next step). The
          # action derives releases from the tags `changeset publish` prints, so this is already inert under
          # `--no-git-tag` — set explicitly so the intent survives a future flag change.
          createGithubReleases: 'false'
          commit: 'Version packages'
          title: 'Version packages'
        env:
          NPM_CONFIG_PROVENANCE: 'true' # provenance via OIDC; trusted publisher means no NPM_TOKEN.

      # One tag + one GitHub Release per lockstep group (`v<version>` for core/SDK, `plugins-v<version>` for
      # plugins + CLI), both refs in a single push.
      #
      # Gated on the commit subject rather than the action's `published` output: that output is derived by
      # scraping `New tag:` out of the publish log, so `--no-git-tag` leaves it permanently false
      # (changesets/action#141). A "Version packages" commit on main IS the release commit — every other push
      # only refreshes the Version PR. No `always()`/`!cancelled()`: a failed publish must not be tagged, and
      # a plain `if:` keeps the implicit "previous steps succeeded" requirement.
      - name: Tag + release groups (@latest)
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Version packages')
        run: |
          git config user.name 'dxos-bot'
          git config user.email 'bot@dxos.org'
          node scripts/release-groups.mjs
        env:
          # Carries both the tag push (the checkout persists no credentials) and the Releases API calls.
          GH_TOKEN: ${{ secrets.GH_DXOS_BOT_PAT }}

      # @next (dispatch): publish the snapshot versions under the `next` dist-tag. --no-git-tag: snapshots
      # are ephemeral and never tagged. No-op when no changesets are pending.
      - name: Publish @next (snapshot)
        if: github.event_name == 'workflow_dispatch'
        run: pnpm exec changeset publish --tag next --no-git-tag
        env:
          NPM_CONFIG_PROVENANCE: 'true' # provenance via OIDC; trusted publisher means no NPM_TOKEN.
