name: PR Build

# Builds the composer-app bundle for per-PR previews and uploads it as an artifact.
# NO secrets are exposed here — this workflow runs untrusted PR code safely.
# The artifact is picked up by pr-deploy.yml (workflow_run) which runs
# from the base branch with secrets and performs the Cloudflare deploy.
#
# TODO(wittjosiah): stays on GitHub Actions, see the TODO on pr-deploy.yml - its artifact download
# failed once this workflow ran on Depot CI instead.
# Named for the trigger, not the output: `preview` is a deploy ENVIRONMENT
# (preview.composer.space), while these are Worker preview versions of `dev`.

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Bound once here rather than at every setup call site: a composite action cannot read the
  # `secrets` context, but it does inherit the process environment.
  MOON_CACHE_CA_PEM: ${{ secrets.MOON_CACHE_CA_PEM }}
  MOON_CACHE_CLIENT_PEM: ${{ secrets.MOON_CACHE_CLIENT_PEM }}
  MOON_CACHE_CLIENT_KEY: ${{ secrets.MOON_CACHE_CLIENT_KEY }}

jobs:
  build:
    # Skip forks (per project policy) — not required for safety (no secrets are
    # used here), but fork previews are intentionally unsupported.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: depot-ubuntu-24.04-8
    container:
      image: ghcr.io/dxos/gh-actions:24.11.1
      credentials:
        username: dxos-bot
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Setup
        uses: ./.depot/actions/setup

      - name: Bundle composer-app
        run: moon run composer-app:bundle
        env:
          NODE_ENV: production
          LOG_FILTER: error
          # EDGE preview — the instance Composer `dev` targets, so a PR preview and a dev deploy
          # see the same data.
          DX_EDGE_BASE_URL: https://preview.dxos.network/

      - name: Write deploy metadata
        run: |
          mkdir -p preview-meta
          echo "${{ github.event.pull_request.number }}" > preview-meta/pr-number
          echo "${{ github.event.pull_request.head.sha }}" > preview-meta/head-sha

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: composer-preview-bundle
          path: |
            packages/apps/composer-app/out/composer
            preview-meta
          retention-days: 3
          if-no-files-found: error
