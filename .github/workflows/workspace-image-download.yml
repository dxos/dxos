name: Workspace Image Download

# Experiment: network cost alone of fetching the same 2.1 GB workspace snapshot from R2's public URL and from
# GHCR, as one stream and as 8 parallel ranges. Mount and install costs do not depend on the source, so
# `workspace-image.yml` covers those.

permissions:
  contents: read

on:
  push:
    branches:
      # TODO(dmaretskyi): Remove before merging; pushes to this branch produce the measurements.
      - claude/workspace-image-mount
    paths:
      - .github/workflows/workspace-image-download.yml
  workflow_dispatch:

env:
  SNAPSHOT_SHA: f803ccb0d7a8f096a6d027b7941d7d4c2b4b92aa
  BLOB_DIGEST: sha256:42f8456db76273daebe35776b247525d3d578d4387b82152ede32636be1df275
  BLOB_SIZE: 2097119232
  # R2's development URL: rate-limited and uncached, so a lower bound on what a custom domain would give.
  R2_URL: https://pub-39066a86073446d7b77b1c157b660bb5.r2.dev/ci-workspace/f803ccb0d7a8f096a6d027b7941d7d4c2b4b92aa/workspace.sqfs

jobs:
  download:
    strategy:
      fail-fast: false
      # One of each source at a time, so samples do not compete for the same endpoint.
      max-parallel: 4
      matrix:
        sample: [1, 2, 3]
        source: [r2, r2-ranged, ghcr, ghcr-ranged]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download
        env:
          SOURCE: ${{ matrix.source }}
        run: |
          set -euo pipefail
          sudo mkdir -p /mnt/dl && sudo chown "$(id -u):$(id -g)" /mnt/dl && cd /mnt/dl
          auth=()
          case "$SOURCE" in
            r2*) url=$R2_URL ;;
            ghcr*)
              token=$(curl -fsS "https://ghcr.io/token?scope=repository:dxos/gh-actions:pull" | jq -r .token)
              auth=(-H "Authorization: Bearer $token")
              url=https://ghcr.io/v2/dxos/gh-actions/blobs/$BLOB_DIGEST ;;
          esac
          start=$(date +%s.%N)
          if [[ "$SOURCE" == *-ranged ]]; then
            parts=8; chunk=$(( (BLOB_SIZE + parts - 1) / parts ))
            for i in $(seq 0 $((parts - 1))); do
              from=$((i * chunk)); to=$(( from + chunk - 1 < BLOB_SIZE - 1 ? from + chunk - 1 : BLOB_SIZE - 1 ))
              curl -fsSL "${auth[@]}" -r "$from-$to" -o "part.$i" "$url" &
            done
            wait
            net=$(echo "$(date +%s.%N) - $start" | bc)
            cat $(for i in $(seq 0 $((parts - 1))); do echo "part.$i"; done) > workspace.sqfs && rm part.*
          else
            curl -fsSL "${auth[@]}" -o workspace.sqfs "$url"
            net=$(echo "$(date +%s.%N) - $start" | bc)
          fi
          size=$(stat -c %s workspace.sqfs)
          [ "$size" = "$BLOB_SIZE" ] || { echo "size $size, expected $BLOB_SIZE"; exit 1; }
          [ "sha256:$(sha256sum workspace.sqfs | cut -d' ' -f1)" = "$BLOB_DIGEST" ] || { echo "digest mismatch"; exit 1; }
          printf 'source=%s sample=%s download=%.1fs rate=%.0fMB/s\n' "$SOURCE" "${{ matrix.sample }}" "$net" "$(echo "$size / 1000000 / $net" | bc -l)"
