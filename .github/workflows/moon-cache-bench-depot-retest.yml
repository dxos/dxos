# TEMPORARY — retests Depot's remote cache after their blob-batching fix, on an actual
# depot-ubuntu-24.04-8 runner. Delete once .agents/projects/ci/REPORT.md has the CI numbers.
# workflow_dispatch does not work for a workflow that only exists on a non-default branch, so this
# triggers on push to this branch instead.
name: Moon cache bench (Depot retest)

on:
  push:
    branches:
      - claude/depot-cache-blob-latency-8eb63e

permissions:
  contents: read
  packages: read

env:
  MOON_CACHE_CA_PEM: ${{ secrets.MOON_CACHE_CA_PEM }}
  MOON_CACHE_CLIENT_PEM: ${{ secrets.MOON_CACHE_CLIENT_PEM }}
  MOON_CACHE_CLIENT_KEY: ${{ secrets.MOON_CACHE_CLIENT_KEY }}
  DEPOT_TOKEN: ${{ secrets.DEPOT_TOKEN }}

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        arm: [selfhosted, depot]
    runs-on: depot-ubuntu-24.04-8
    container:
      image: ghcr.io/dxos/gh-actions:24.11.1
      credentials:
        username: dxos-bot
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      # Runs for both arms so MOON_REMOTE_HOST is never force-emptied by remote-cache:'false' — the
      # depot arm then overwrites workspace.yml below, which moon reads directly since no env
      # override is set.
      - name: Setup
        uses: ./.github/actions/setup

      - name: Point workspace.yml at Depot
        if: matrix.arm == 'depot'
        run: |
          cat > .moon/workspace.yml <<'YAML'
          $schema: ./cache/schemas/workspace.json

          projects:
            - docs
            - packages/**/moon.yml
            - tools/*/moon.yml
            - vendor/*/moon.yml

          remote:
            host: 'grpcs://cache.depot.dev'
            auth:
              token: 'DEPOT_TOKEN'
              headers:
                'X-Depot-Org': 't8fblrl00n'

          vcs:
            client: git
            defaultBranch: main
          YAML

      - name: Bench (5 reps)
        run: |
          chmod +x tools/moon-cache/bench/bench.sh
          MOON=moon tools/moon-cache/bench/bench.sh ${{ matrix.arm }} 5

      - name: Analyze
        run: node tools/moon-cache/bench/analyze.mjs .moon-bench | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload run reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moon-bench-${{ matrix.arm }}
          path: .moon-bench/
          retention-days: 7
