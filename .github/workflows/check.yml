name: Check

on:
  pull_request:
  merge_group:

  push:
    branches:
      - main
      - ci/*

  schedule:
    - cron: '0 4 * * 1-5'

  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)'
        required: false
        default: false

      e2e:
        type: boolean
        description: 'Run the e2e tests'
        required: false
        default: false

permissions:
  contents: read
  packages: read

env:
  # Bound once here rather than at every setup call site: a composite action cannot read the
  # `secrets` context, but it does inherit the process environment.
  MOON_CACHE_CA_PEM: ${{ secrets.MOON_CACHE_CA_PEM }}
  MOON_CACHE_CLIENT_PEM: ${{ secrets.MOON_CACHE_CLIENT_PEM }}
  MOON_CACHE_CLIENT_KEY: ${{ secrets.MOON_CACHE_CLIENT_KEY }}
  DISCORD_TEST_REPORT_WEBHOOK: ${{ secrets.DISCORD_TEST_REPORT_WEBHOOK }}
  TRUNK_TOKEN: ${{ secrets.TRUNK_TOKEN }}

# https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/control-the-concurrency-of-workflows-and-jobs
# The event is part of the key because on a schedule `github.ref` is `refs/heads/main`: without it the
# nightly shares a group with pushes to main and the next push cancels it mid-e2e.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# https://moonrepo.dev/docs/guides/ci
jobs:
  check:
    permissions:
      contents: read
      packages: read
    runs-on: depot-ubuntu-24.04-8
    container:
      image: ghcr.io/dxos/gh-actions:24.11.1
      credentials:
        username: dxos-bot
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 30
    steps:
      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled && !inputs.e2e }}
        with:
          detached: true

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          lfs: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Extract branch
        id: extract_branch
        uses: ./.github/actions/branch

      - name: Setup
        uses: ./.github/actions/setup

      - name: Check for import cycles
        run: pnpm run check-cycles

      - name: Check public packages don't depend on private packages
        run: pnpm run check-public-dependencies

      - name: Check publish config
        run: pnpm run check-publish-config

      - name: Check public packages are published
        run: pnpm run check-packages-published

      - name: Check version files in sync
        # version.ts (DXOS_VERSION) + tauri.conf.json are derived from their package versions by
        # sync-versions.mjs during release; fail the PR if a committed copy drifts out of sync.
        run: node scripts/sync-versions.mjs --check

      - name: Check package.json paths
        run: pnpm run pkg-lint

      - name: Check formatting
        run: pnpm run format-check

      - name: Check Affected
        if: ${{ steps.extract_branch.outputs.branch != 'main' }}
        run: moon run :lint :build --affected remote

      - name: Check All
        if: ${{ steps.extract_branch.outputs.branch == 'main' }}
        run: moon run :lint :build

      # Guards the self-hosted cache against silent degradation: an unreachable or unauthenticated
      # cache still exits 0 and simply rebuilds everything. warn-only until the cache has a
      # track record — flip to a hard failure once it has been green for a week.
      - name: Assert remote cache
        uses: ./.github/actions/assert-remote-cache
        with:
          warn-only: 'true'

      - name: Check module structure (affected)
        if: ${{ steps.extract_branch.outputs.branch != 'main' }}
        run: moon run :check-module-structure --affected remote

      - name: Check module structure (all)
        if: ${{ steps.extract_branch.outputs.branch == 'main' }}
        run: moon run :check-module-structure

      - name: Check for peer dependency issues
        run: pnpm install --resolution-only --no-frozen-lockfile

  test:
    strategy:
      matrix:
        node-version: ['24.11.1']
    runs-on: depot-ubuntu-24.04-8
    container:
      image: ghcr.io/dxos/gh-actions:${{ matrix.node-version }}
      credentials:
        username: dxos-bot
        password: ${{ github.token }}
    timeout-minutes: 30
    env:
      NODE_VERSION: ${{ matrix.node-version }}
      # Opt the test job in to flaky-tagged suites (Trunk pass-on-rerun keeps signal),
      # while still excluding the heavier opt-in tag families.
      VITEST_TAGS_FILTER: '!sync && !sync-e2e && !functions-e2e && !manual'
      VITEST_ENV: 'node'
      VITEST_COVERAGE: ${{ secrets.CODECOV_TOKEN != '' && 'true' || 'false' }}
      VITEST_XML_REPORT: 'true'
      # NOTE: Browser tests also require a process for chromium. Limiting to 4 provides headroom for those processes.
      MOON_CONCURRENCY: 4
      # Exposed so step conditions can branch on token presence without referencing
      # secrets directly (secrets are not allowed in if: expressions).
      TRUNK_TOKEN: ${{ secrets.TRUNK_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          lfs: true
          persist-credentials: false

      - name: Extract branch
        id: extract_branch
        uses: ./.github/actions/branch

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install Playwright
        run: pnpm run install-playwright

      - name: Clean stale test results
        run: rm -rf test-results

      - name: Test Affected
        if: ${{ steps.extract_branch.outputs.branch != 'main' && env.TRUNK_TOKEN != '' }}
        uses: trunk-io/analytics-uploader@v1
        with:
          junit-paths: 'test-results/**/results.xml'
          org-slug: dxos
          token: ${{ secrets.TRUNK_TOKEN }}
          quarantine: true
          run: moon run :test :test-browser --affected remote -- --no-file-parallelism

      # Fallback for fork PRs and local runs where TRUNK_TOKEN is unavailable.
      - name: Test Affected (no analytics)
        if: ${{ steps.extract_branch.outputs.branch != 'main' && env.TRUNK_TOKEN == '' }}
        run: moon run :test :test-browser --affected remote -- --no-file-parallelism

      - name: Test All
        if: ${{ steps.extract_branch.outputs.branch == 'main' && env.TRUNK_TOKEN != '' }}
        uses: trunk-io/analytics-uploader@v1
        with:
          junit-paths: 'test-results/**/results.xml'
          org-slug: dxos
          token: ${{ secrets.TRUNK_TOKEN }}
          quarantine: true
          run: moon exec --on-failure continue :test :test-browser -- --no-file-parallelism

      # Fallback for forks running against their own main where TRUNK_TOKEN is unavailable.
      - name: Test All (no analytics)
        if: ${{ steps.extract_branch.outputs.branch == 'main' && env.TRUNK_TOKEN == '' }}
        run: moon exec --on-failure continue :test :test-browser -- --no-file-parallelism

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vitest-report-${{ matrix.node-version }}
          path: test-results
          retention-days: 7

      - uses: codecov/codecov-action@v5
        if: ${{ matrix.node-version == '24.11.1' && env.VITEST_COVERAGE == 'true' }}
        with:
          directory: ./coverage
          fail_ci_if_error: false
          handle_no_reports_found: true
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

  # Storybook tests run on their own runner, in parallel with `test`, so the (large)
  # set of :test-storybook tasks no longer serializes behind unit/browser tests in the
  # `test` job. File parallelism stays disabled here too — overloaded runners flake — so
  # the win is concurrency across machines, not within one.
  storybook:
    strategy:
      matrix:
        node-version: ['24.11.1']
    runs-on: depot-ubuntu-24.04-8
    container:
      image: ghcr.io/dxos/gh-actions:${{ matrix.node-version }}
      credentials:
        username: dxos-bot
        password: ${{ github.token }}
    timeout-minutes: 30
    env:
      NODE_VERSION: ${{ matrix.node-version }}
      # Opt in to flaky-tagged suites (Trunk pass-on-rerun keeps signal),
      # while still excluding the heavier opt-in tag families.
      VITEST_TAGS_FILTER: '!sync && !sync-e2e && !functions-e2e && !manual'
      VITEST_ENV: 'node'
      VITEST_COVERAGE: ${{ secrets.CODECOV_TOKEN != '' && 'true' || 'false' }}
      VITEST_XML_REPORT: 'true'
      # NOTE: Storybook tests spawn a process for chromium. Limiting to 4 provides headroom for those processes.
      MOON_CONCURRENCY: 4
      # Exposed so step conditions can branch on token presence without referencing
      # secrets directly (secrets are not allowed in if: expressions).
      TRUNK_TOKEN: ${{ secrets.TRUNK_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          lfs: true
          persist-credentials: false

      - name: Extract branch
        id: extract_branch
        uses: ./.github/actions/branch

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install Playwright
        run: pnpm run install-playwright

      - name: Clean stale test results
        run: rm -rf test-results

      - name: Test Storybook Affected
        if: ${{ steps.extract_branch.outputs.branch != 'main' && env.TRUNK_TOKEN != '' }}
        uses: trunk-io/analytics-uploader@v1
        with:
          junit-paths: 'test-results/**/results.xml'
          org-slug: dxos
          token: ${{ secrets.TRUNK_TOKEN }}
          quarantine: true
          run: moon run :test-storybook --affected remote -- --no-file-parallelism

      # Fallback for fork PRs and local runs where TRUNK_TOKEN is unavailable.
      - name: Test Storybook Affected (no analytics)
        if: ${{ steps.extract_branch.outputs.branch != 'main' && env.TRUNK_TOKEN == '' }}
        run: moon run :test-storybook --affected remote -- --no-file-parallelism

      - name: Test Storybook All
        if: ${{ steps.extract_branch.outputs.branch == 'main' && env.TRUNK_TOKEN != '' }}
        uses: trunk-io/analytics-uploader@v1
        with:
          junit-paths: 'test-results/**/results.xml'
          org-slug: dxos
          token: ${{ secrets.TRUNK_TOKEN }}
          quarantine: true
          run: moon exec --on-failure continue :test-storybook -- --no-file-parallelism

      # Fallback for forks running against their own main where TRUNK_TOKEN is unavailable.
      - name: Test Storybook All (no analytics)
        if: ${{ steps.extract_branch.outputs.branch == 'main' && env.TRUNK_TOKEN == '' }}
        run: moon exec --on-failure continue :test-storybook -- --no-file-parallelism

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vitest-report-storybook-${{ matrix.node-version }}
          path: test-results
          retention-days: 7

      - uses: codecov/codecov-action@v5
        if: ${{ matrix.node-version == '24.11.1' && env.VITEST_COVERAGE == 'true' }}
        with:
          directory: ./coverage
          fail_ci_if_error: false
          handle_no_reports_found: true
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

  # Workerd tests run in the Cloudflare Workers runtime (`@cloudflare/vitest-pool-workers`)
  # on their own runner, in parallel with `test`/`storybook`. No chromium/Playwright needed —
  # the workerd binary ships with the `workerd` npm package installed during setup.
  workerd:
    strategy:
      matrix:
        node-version: ['24.11.1']
    runs-on: depot-ubuntu-24.04-8
    container:
      image: ghcr.io/dxos/gh-actions:${{ matrix.node-version }}
      credentials:
        username: dxos-bot
        password: ${{ github.token }}
    timeout-minutes: 30
    env:
      NODE_VERSION: ${{ matrix.node-version }}
      # Opt in to flaky-tagged suites (Trunk pass-on-rerun keeps signal),
      # while still excluding the heavier opt-in tag families.
      VITEST_TAGS_FILTER: '!sync && !sync-e2e && !functions-e2e && !manual'
      VITEST_ENV: 'node'
      # v8 coverage imports `node:inspector/promises`, which the workerd runtime does not
      # provide — coverage is unsupported for the workers pool, so keep it off for this job.
      VITEST_COVERAGE: 'false'
      VITEST_XML_REPORT: 'true'
      MOON_CONCURRENCY: 4
      # Exposed so step conditions can branch on token presence without referencing
      # secrets directly (secrets are not allowed in if: expressions).
      TRUNK_TOKEN: ${{ secrets.TRUNK_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          lfs: true
          persist-credentials: false

      - name: Extract branch
        id: extract_branch
        uses: ./.github/actions/branch

      - name: Setup
        uses: ./.github/actions/setup

      - name: Clean stale test results
        run: rm -rf test-results

      - name: Test Workerd Affected
        if: ${{ steps.extract_branch.outputs.branch != 'main' && env.TRUNK_TOKEN != '' }}
        uses: trunk-io/analytics-uploader@v1
        with:
          junit-paths: 'test-results/**/results.xml'
          org-slug: dxos
          token: ${{ secrets.TRUNK_TOKEN }}
          quarantine: true
          run: moon run :test-workerd --affected remote -- --no-file-parallelism

      # Fallback for fork PRs and local runs where TRUNK_TOKEN is unavailable.
      - name: Test Workerd Affected (no analytics)
        if: ${{ steps.extract_branch.outputs.branch != 'main' && env.TRUNK_TOKEN == '' }}
        run: moon run :test-workerd --affected remote -- --no-file-parallelism

      - name: Test Workerd All
        if: ${{ steps.extract_branch.outputs.branch == 'main' && env.TRUNK_TOKEN != '' }}
        uses: trunk-io/analytics-uploader@v1
        with:
          junit-paths: 'test-results/**/results.xml'
          org-slug: dxos
          token: ${{ secrets.TRUNK_TOKEN }}
          quarantine: true
          run: moon exec --on-failure continue :test-workerd -- --no-file-parallelism

      # Fallback for forks running against their own main where TRUNK_TOKEN is unavailable.
      - name: Test Workerd All (no analytics)
        if: ${{ steps.extract_branch.outputs.branch == 'main' && env.TRUNK_TOKEN == '' }}
        run: moon exec --on-failure continue :test-workerd -- --no-file-parallelism

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vitest-report-workerd-${{ matrix.node-version }}
          path: test-results
          retention-days: 7

  # Bundles once and publishes to the moon remote cache (bundle/build tasks declare `outputs`, so
  # any later runner hydrates the artifacts instead of rebuilding). Before this job, every e2e shard
  # and queue node bundled the whole graph itself — concurrent starts meant none could hit the
  # others' cache writes, duplicating ~10m of work per runner. The env block must match the shards'
  # hash-relevant task inputs ($DX_ENVIRONMENT, $DX_EDGE_BASE_URL, $DX_PWA) or their hashes miss.
  e2e-bundle:
    if: >-
      startsWith(github.ref, 'refs/heads/main') ||
      startsWith(github.ref, 'refs/heads/changeset-release/') ||
      startsWith(github.head_ref, 'changeset-release/') ||
      inputs.e2e
    runs-on: depot-ubuntu-24.04-8
    container:
      image: ghcr.io/dxos/gh-actions:24.11.1
      credentials:
        username: dxos-bot
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 30
    env:
      DX_ENVIRONMENT: ci
      DX_EDGE_BASE_URL: 'wss://edge-main.dxos.workers.dev/'
      DX_TELEMETRY_TAG: e2e
      DX_PWA: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false

      - name: Extract branch
        id: extract_branch
        uses: ./.github/actions/branch

      - name: Setup
        uses: ./.github/actions/setup

      - name: Bundle Affected
        if: ${{ steps.extract_branch.outputs.branch != 'main' && !inputs.e2e }}
        run: moon run :bundle --affected remote

      - name: Bundle All
        if: ${{ steps.extract_branch.outputs.branch == 'main' || inputs.e2e }}
        run: moon run :bundle

  e2e:
    # e2e runs on pushes/schedules to main AND on the Changesets "Version Packages" PR (so we never
    # publish untested). For push events github.ref is refs/heads/<branch>; for pull_request events
    # github.ref is refs/pull/N/merge so we also check github.head_ref (the source branch name, set only
    # on pull_request events) to catch the changesets/action PR branch (changeset-release/<base>).
    needs: e2e-bundle
    if: >-
      startsWith(github.ref, 'refs/heads/main') ||
      startsWith(github.ref, 'refs/heads/changeset-release/') ||
      startsWith(github.head_ref, 'changeset-release/') ||
      inputs.e2e
    # One shard per Playwright browser: the serial three-browser suite measured 43m+, so splitting by
    # browser bounds each shard at roughly a third of that. Every shard runs the same tests, so the
    # split is near-even by construction — no duration bookkeeping needed. `fail-fast: false` keeps one
    # browser's failure from cancelling the other shards' signal (and their traces).
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: depot-ubuntu-24.04-8
    container:
      image: ghcr.io/dxos/gh-actions:24.11.1
      credentials:
        username: dxos-bot
        password: ${{ secrets.GITHUB_TOKEN }}
    # Headroom over the 40m test cap plus ~10m of bundling: the step timeout fails the job cleanly with
    # traces attached, whereas hitting this cap cancels it and proves nothing.
    timeout-minutes: 60
    env:
      DX_ENVIRONMENT: ci
      DX_EDGE_BASE_URL: 'wss://edge-main.dxos.workers.dev/'
      DX_TELEMETRY_TAG: e2e
      DX_PWA: false
      # Selects this shard's Playwright project; also a moon task hash input, so each shard gets its
      # own remote-cache entry.
      PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
      # Exposed so step conditions can branch on token presence without referencing
      # secrets directly (secrets are not allowed in if: expressions).
      KNAPSACK_PRO_TOKEN: ${{ secrets.KNAPSACK_PRO_TOKEN }}
    steps:
      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
        with:
          detached: true

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false

      - name: Extract branch
        id: extract_branch
        uses: ./.github/actions/branch

      - name: Setup
        uses: ./.github/actions/setup

      # Only this shard's browser — the other two engines' downloads are dead weight here.
      - name: Install Playwright
        run: pnpm run install-playwright ${{ matrix.browser }}

      # A manual `e2e` dispatch takes the "All" path on any branch: affected-scoping resolves to nothing
      # when the diff touches no project (e.g. a CI-only change), which would bundle and test nothing.
      # These normally hydrate from the remote cache warmed by `e2e-bundle` (seconds, not minutes);
      # they still execute for real on a cache miss/eviction, so keep generous step budgets upstream.
      - name: Bundle Affected
        if: ${{ steps.extract_branch.outputs.branch != 'main' && !inputs.e2e }}
        run: moon run :bundle --affected remote

      - name: Bundle All
        if: ${{ steps.extract_branch.outputs.branch == 'main' || inputs.e2e }}
        run: moon run :bundle

      # Clear Storybook Vite cache in every package so Storybook dev server does a fresh optimizeDeps run.
      # Avoids 504 Outdated Optimize Dep when graph differs from bundle step.
      # Storybook puts cache under node_modules/.cache/storybook/<hash>/sb-vite per package.
      - name: Clear Storybook Vite cache
        run: find . -type d -path '*/node_modules/.cache/storybook' -prune -print0 | xargs -0 rm -rf

      - name: Clean stale test results
        run: rm -rf test-results

      - name: Test Affected
        if: ${{ steps.extract_branch.outputs.branch != 'main' && !inputs.e2e }}
        timeout-minutes: 30
        uses: trunk-io/analytics-uploader@v1
        with:
          junit-paths: 'test-results/playwright/report/*.xml'
          org-slug: dxos
          token: ${{ secrets.TRUNK_TOKEN }}
          quarantine: true
          run: moon run :e2e --affected remote --concurrency=1

      - name: Test All
        if: ${{ (steps.extract_branch.outputs.branch == 'main' || inputs.e2e) && env.KNAPSACK_PRO_TOKEN == '' }}
        # The serial three-browser suite measured 43m+; a single browser's shard plus retries stays well
        # under this, and the step (not job) timeout fails cleanly with traces attached.
        timeout-minutes: 40
        uses: trunk-io/analytics-uploader@v1
        env:
          # Manual dispatches and the nightly must execute the suite: re-running the same commit
          # otherwise replays a remote cache hit in seconds, which reports green without running a
          # test (and the nightly exists to catch live-edge regressions a replay cannot see). A unique
          # task-input value forces only the e2e tasks to run — unlike MOON_CACHE=off, which would
          # also rebuild every cached bundle/build dependency in each shard.
          DX_E2E_RUN_ID: ${{ (inputs.e2e || github.event_name == 'schedule') && format('{0}-{1}', github.run_id, github.run_attempt) || '' }}
        with:
          junit-paths: 'test-results/playwright/report/*.xml'
          org-slug: dxos
          token: ${{ secrets.TRUNK_TOKEN }}
          quarantine: true
          run: moon exec --on-failure continue :e2e --concurrency=1

      # When the Knapsack Pro token is present, composer-app runs in the `e2e-knapsack` job instead —
      # keep this target list in sync with the `e2e`-tagged projects minus composer-app.
      - name: Test All (composer via Knapsack)
        if: ${{ (steps.extract_branch.outputs.branch == 'main' || inputs.e2e) && env.KNAPSACK_PRO_TOKEN != '' }}
        timeout-minutes: 40
        uses: trunk-io/analytics-uploader@v1
        env:
          # See "Test All": force execution on dispatch/nightly without discarding the dep cache.
          DX_E2E_RUN_ID: ${{ (inputs.e2e || github.event_name == 'schedule') && format('{0}-{1}', github.run_id, github.run_attempt) || '' }}
        with:
          junit-paths: 'test-results/playwright/report/*.xml'
          org-slug: dxos
          token: ${{ secrets.TRUNK_TOKEN }}
          quarantine: true
          run: >-
            moon exec --on-failure continue
            todomvc:e2e rpc-tunnel-e2e:e2e plugin-kanban:e2e plugin-sheet:e2e
            lit-grid:e2e react-ui-mosaic:e2e react-ui-table:e2e
            --concurrency=1

      - name: Upload Traces
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: test-results/playwright
          retention-days: 7

  # Composer-app's Playwright suite through Knapsack Pro queue mode (DX-1116 Option B trial): the 4
  # nodes pull test files from a shared queue ordered by recorded duration, so imbalance self-corrects
  # mid-run instead of being fixed up front. Trial scope is composer only (11 of 21 e2e specs, all
  # three browsers in one run) — the remaining 1-4 spec suites stay on the per-browser matrix above.
  # Token-gated: without KNAPSACK_PRO_TOKEN every step below skips and the `e2e` matrix keeps
  # composer, so fork PRs and pre-token runs lose nothing.
  e2e-knapsack:
    needs: e2e-bundle
    if: >-
      startsWith(github.ref, 'refs/heads/main') ||
      inputs.e2e
    strategy:
      fail-fast: false
      matrix:
        node: [0, 1, 2, 3]
    runs-on: depot-ubuntu-24.04-8
    container:
      image: ghcr.io/dxos/gh-actions:24.11.1
      credentials:
        username: dxos-bot
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 45
    env:
      DX_ENVIRONMENT: ci
      DX_EDGE_BASE_URL: 'wss://edge-main.dxos.workers.dev/'
      DX_TELEMETRY_TAG: e2e
      DX_PWA: false
      # All three browser projects in one run — the queue distributes per test file, and a file's
      # projects run together in whichever node pulls it.
      PLAYWRIGHT_BROWSER: all
      # Exposed so step conditions can branch on token presence without referencing
      # secrets directly (secrets are not allowed in if: expressions).
      KNAPSACK_PRO_TOKEN: ${{ secrets.KNAPSACK_PRO_TOKEN }}
    steps:
      - name: Checkout
        if: ${{ env.KNAPSACK_PRO_TOKEN != '' }}
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false

      - name: Setup
        if: ${{ env.KNAPSACK_PRO_TOKEN != '' }}
        uses: ./.github/actions/setup

      - name: Install Playwright
        if: ${{ env.KNAPSACK_PRO_TOKEN != '' }}
        run: pnpm run install-playwright

      # The queue-mode invocations below bypass moon, so deps must be materialized first (the same
      # targets the composer-app:e2e task depends on). Normally a fast hydration from the remote
      # cache warmed by `e2e-bundle`; executes for real only on a cache miss.
      - name: Bundle
        if: ${{ env.KNAPSACK_PRO_TOKEN != '' }}
        run: moon run composer-app:bundle test-utils:build vite-plugin-icons:build

      - name: Clean stale test results
        if: ${{ env.KNAPSACK_PRO_TOKEN != '' }}
        run: rm -rf test-results

      - name: Test composer-app (queue mode)
        if: ${{ env.KNAPSACK_PRO_TOKEN != '' }}
        timeout-minutes: 30
        uses: trunk-io/analytics-uploader@v1
        env:
          KNAPSACK_PRO_TEST_SUITE_TOKEN_PLAYWRIGHT: ${{ secrets.KNAPSACK_PRO_TOKEN }}
          KNAPSACK_PRO_CI_NODE_TOTAL: 4
          KNAPSACK_PRO_CI_NODE_INDEX: ${{ matrix.node }}
        with:
          junit-paths: 'test-results/playwright/report/*.xml'
          org-slug: dxos
          token: ${{ secrets.TRUNK_TOKEN }}
          quarantine: true
          run: >-
            cd packages/apps/composer-app &&
            pnpm exec knapsack-pro-playwright --config=src/playwright/playwright.config.ts

      - name: Upload Traces
        uses: actions/upload-artifact@v7
        if: ${{ always() && env.KNAPSACK_PRO_TOKEN != '' }}
        with:
          name: playwright-report-knapsack-${{ matrix.node }}
          path: test-results/playwright
          retention-days: 7

  # Builds, packs and smoke-tests the CLI on its own runner, in parallel with `e2e`. It used to ride along
  # in that job, which meant the foreign-machine check waited on the Playwright suite for an artifact that
  # was ready in minutes — and a browser test consuming the 45 minute step budget withheld it entirely.
  cli:
    if: >-
      startsWith(github.ref, 'refs/heads/main') ||
      startsWith(github.ref, 'refs/heads/changeset-release/') ||
      startsWith(github.head_ref, 'changeset-release/') ||
      inputs.e2e
    runs-on: depot-ubuntu-24.04-8
    container:
      image: ghcr.io/dxos/gh-actions:24.11.1
      credentials:
        username: dxos-bot
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          lfs: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      # `@dxos/cli` ships as prebuilt platform binaries, so its failure modes live in the packed tarball
      # rather than the source tree. Depends on `bundle`, so this compiles the binaries too.
      - name: Smoke test packed CLI
        run: moon run cli:smoke

      - name: Pack the CLI for the foreign-machine job
        run: |
          mkdir -p cli-verify
          npm pack --silent --pack-destination cli-verify ./packages/devtools/cli/dist/cli
          npm pack --silent --pack-destination cli-verify ./packages/devtools/cli/dist/cli-linux-x64
          cp packages/devtools/cli/scripts/verify-installed.mjs cli-verify/

      # The verifier travels with the tarballs because the job that runs them has no checkout.
      - name: Upload packed CLI
        uses: actions/upload-artifact@v4
        with:
          name: cli-verify
          path: cli-verify/
          retention-days: 1

  # Runs the packed CLI where the tree that built it does not exist. Deliberately no checkout, no container
  # and a different runner: a `--compile`d binary is meant to carry everything, and when a dependency
  # resolves a path at bundle time instead — `@automerge/automerge`'s WASM, `classic-level`'s native addon —
  # it works in the job that built it and nowhere else, which is how @dxos/cli@0.10.0 shipped unrunnable.
  # `cli:smoke` cannot cover this in CI because the build container forbids mount namespaces.
  cli-foreign:
    needs: cli
    if: ${{ !cancelled() && needs.cli.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download packed CLI
        uses: actions/download-artifact@v4
        with:
          name: cli-verify
          path: cli-verify

      # `--omit=optional` so the launcher's optionalDependencies are not fetched from npm — those versions
      # are published, so without it the released (and possibly broken) platform package could satisfy the
      # dependency instead of the tarball built here.
      # The `./` is load-bearing: npm reads a bare `dir/file.tgz` as the GitHub shorthand `owner/repo` and
      # tries to clone it.
      - name: Install from the tarballs
        run: |
          npm init -y > /dev/null
          npm install --no-audit --no-fund --omit=optional ./cli-verify/*.tgz

      # The same verifier `cli:smoke` runs, so the two cannot check different things.
      - name: Verify the install
        run: node cli-verify/verify-installed.mjs .

  # Reports every nightly job from one place. e2e is in `needs` so a cancelled e2e is still reported (its
  # former in-job step used `success() || failure()`, which skips on cancellation) and so the other three
  # reports can no longer go out green while e2e is still running.
  report:
    needs: [test, storybook, workerd, e2e, e2e-knapsack]
    if: always() && github.event_name == 'schedule'
    runs-on: depot-ubuntu-24.04-8
    container:
      image: ghcr.io/dxos/gh-actions:24.11.1
      credentials:
        username: dxos-bot
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 10
    steps:
      # This job only runs a repository-local action, so it never needs git auth; leaving the token in
      # `.git/config` would expose it to anything in the checked-out tree.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # Each report is `always()` so an undelivered one cannot suppress the rest — without it a failing
      # first report skips the e2e report, silencing the very signal this job exists to send. A failed
      # step still fails the job.
      - name: Send test report
        if: always()
        uses: ./.github/actions/test-report
        with:
          name: test-24.11.1
          result: ${{ needs.test.result }}
      - name: Send storybook report
        if: always()
        uses: ./.github/actions/test-report
        with:
          name: storybook-24.11.1
          result: ${{ needs.storybook.result }}
      - name: Send workerd report
        if: always()
        uses: ./.github/actions/test-report
        with:
          name: workerd-24.11.1
          result: ${{ needs.workerd.result }}
      - name: Send e2e report
        if: always()
        uses: ./.github/actions/test-report
        with:
          name: e2e
          result: ${{ needs.e2e.result }}
      - name: Send e2e-knapsack report
        if: always()
        uses: ./.github/actions/test-report
        with:
          name: e2e-knapsack
          result: ${{ needs.e2e-knapsack.result }}

  # Advisory changeset reminder (NOT a gate): when a PR changes publishable source but has no
  # `.changeset/*.md`, post/update a single sticky comment; remove it once a changeset is added.
  # A change that needs no release just omits the changeset — no empty changeset required.
  # Same-repo PRs only — fork PRs get a read-only token and cannot be commented on.
  changeset-reminder:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect missing changeset
        id: detect
        env:
          CHANGESET_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-changeset.mjs

      - name: Post or remove reminder comment
        uses: actions/github-script@v7
        env:
          MISSING: ${{ steps.detect.outputs.missing }}
          PACKAGES: ${{ steps.detect.outputs.packages }}
        with:
          script: |
            const marker = '<!-- changeset-reminder -->';
            const missing = process.env.MISSING === 'true';
            const packages = process.env.PACKAGES || '';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (missing) {
              const body = [
                marker,
                '### 🦋 No changeset found',
                '',
                'This PR changes publishable source but has no `.changeset/*.md`.',
                packages ? `Affected: ${packages}` : '',
                '',
                '- If the change is consumer-relevant (worth a changelog entry), run `pnpm changeset` and commit the file.',
                "- If it isn't changelog-relevant (chore / refactor / internal), you can ignore this — the code still ships with the next release.",
              ].filter(Boolean).join('\n');
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
              }
            } else if (existing) {
              await github.rest.issues.deleteComment({ owner, repo, comment_id: existing.id });
            }
