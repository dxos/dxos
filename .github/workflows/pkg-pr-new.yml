name: pkg.pr.new

# TODO(wittjosiah): stays on GitHub Actions. pkg.pr.new's own publish CLI verifies the calling CI
# run against GitHub's real Actions run tracking - on Depot CI (#12779) it failed every run with
# `Check failed (404): There is no workflow defined for <id>`, since a Depot-executed run isn't a
# real GitHub Actions run from pkg.pr.new's backend's perspective. Same underlying issue as
# pr-deploy.yml's artifact-download failure: third-party tools that verify against GitHub's own
# run identity don't work once the workflow actually executes on Depot's infrastructure.

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Queue rather than cancel: a cancelled run uploads nothing, so the commit it was building stays
  # permanently un-installable for anything pinning pkg.pr.new — which is how the composer plugins
  # repo tracks the SDK, and its nightly 404s when it lands on such a commit.
  cancel-in-progress: false

env:
  # Bound once here rather than at every setup call site: a composite action cannot read the
  # `secrets` context, but it does inherit the process environment.
  MOON_CACHE_CA_PEM: ${{ secrets.MOON_CACHE_CA_PEM }}
  MOON_CACHE_CLIENT_PEM: ${{ secrets.MOON_CACHE_CLIENT_PEM }}
  MOON_CACHE_CLIENT_KEY: ${{ secrets.MOON_CACHE_CLIENT_KEY }}

jobs:
  publish:
    runs-on: depot-ubuntu-24.04-4
    container:
      image: ghcr.io/dxos/gh-actions:24.11.1
      credentials:
        username: dxos-bot
        password: ${{ secrets.GITHUB_TOKEN }}
    # The CLI's five platform binaries add ~330 MB of multipart upload (5 MB parts) on top of the
    # workspace packages, which does not fit the previous 30.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none

      # Publish trust boundary: this job's output is published to pkg.pr.new and consumed by
      # dxos/edge, so it is built from source and its pnpm store is neither shared with the
      # general CI pool nor trusted without an integrity check. Same reasoning already applied to
      # dxos/edge's copy of this workflow.
      - name: Setup
        uses: ./.depot/actions/setup
        with:
          cache-scope: 'publish'
          verify-integrity: 'true'
          remote-cache: 'false'

      - name: Build
        run: moon run :build
        env:
          NODE_ENV: production

      - name: Bundle Shell
        run: moon run shell:bundle
        env:
          NODE_ENV: production

      # The CLI publishes prebuilt binaries generated into dist/, so without this the publish script
      # has nothing to attach. Deliberately no `NODE_ENV: production` — that would diverge the preview
      # binary from the one `cli:publish` produces.
      - name: Bundle CLI
        run: moon run cli:bundle

      # Gate the preview on the same check as `cli:publish`. Without it this workflow published a binary
      # compiled by the CI image's bun rather than the pinned one, which rejected its own arguments.
      - name: Smoke test CLI
        run: moon run cli:smoke

      - name: Publish to pkg.pr.new
        run: .github/workflows/scripts/pkg-pr-new-publish.sh
