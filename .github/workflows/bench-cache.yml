# Depot runners against Blacksmith runners, each with the self-hosted cache on and off.
# Dispatch only — an experiment, not a check.
#
# The 2x2 separates two things that a single job time confuses:
#   cache off — nothing is restored, so this is the runner's raw compute throughput.
#   cache on  — the same work arrives over the network instead, so this is restore speed.
# Running both on both runners says whether a runner is faster at building, at restoring, or
# neither.
#
# Run it TWICE. The first run populates the cache with each runner's hashes (toolchain and
# platform are hash inputs, so Depot and Blacksmith do not share entries); the second measures.
name: Bench Cache

on:
  # `workflow_dispatch` only fires for workflows already on the default branch, and `main` is
  # protected — so until this lands, the branch-scoped push trigger is the only way to run it.
  # REMOVE the push trigger before merging.
  push:
    branches:
      - claude/depot-vs-self-hosted-cache-3fbd62
  workflow_dispatch:

env:
  MOON_CACHE_CA_PEM: ${{ secrets.MOON_CACHE_CA_PEM }}
  MOON_CACHE_CLIENT_PEM: ${{ secrets.MOON_CACHE_CLIENT_PEM }}
  MOON_CACHE_CLIENT_KEY: ${{ secrets.MOON_CACHE_CLIENT_KEY }}

jobs:
  bench:
    name: '${{ matrix.runner }} cache=${{ matrix.cache }}'
    strategy:
      fail-fast: false
      matrix:
        runner: ['depot-ubuntu-24.04-8', 'blacksmith-8vcpu-ubuntu-2404']
        cache: ['on', 'off']
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/dxos/gh-actions:24.11.1
      credentials:
        username: dxos-bot
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 60
    env:
      # Matches the `test` job in check.yml: browser tests also need a chromium process, so 4
      # leaves headroom.
      MOON_CONCURRENCY: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup
        with:
          remote-cache: ${{ matrix.cache == 'on' }}

      - name: Machine
        run: |
          echo "runner=${{ matrix.runner }} cache=${{ matrix.cache }}"
          echo "cpus=$(nproc) mem=$(free -g | awk '/^Mem:/{print $2}')GB"
          # Only meaningful for the cache-on arms, and it is the number that explains them.
          if [ "${{ matrix.cache }}" = "on" ]; then
            printf 'tcp_connect_s:'
            for _ in 1 2 3; do
              curl -o /dev/null -s --connect-timeout 5 -w ' %{time_connect}' https://cache.dxos.network:9093/status || true
            done
            echo
          fi
        shell: bash

      - name: Build
        run: |
          start=$(date +%s)
          moon run :build
          echo "BUILD_S=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
        shell: bash

      - name: Build breakdown
        run: |
          echo "### build — ${{ matrix.runner }} cache=${{ matrix.cache }} — ${BUILD_S}s" >> "$GITHUB_STEP_SUMMARY"
          node tools/moon-cache/bench/analyze.mjs .moon/cache/runReport.json | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash

      # A fixed set rather than `:test`, so the two runners execute identical work in a bounded
      # time. With the cache on these hydrate instead of running, which is the comparison: restore
      # cost against execution cost for the same targets.
      - name: Test
        run: |
          start=$(date +%s)
          moon run echo:test protocols:test client:test react-ui:test keys:test util:test crypto:test random:test -- --no-file-parallelism
          echo "TEST_S=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
        shell: bash

      - name: Test breakdown
        if: always()
        run: |
          echo "### test — ${{ matrix.runner }} cache=${{ matrix.cache }} — ${TEST_S}s" >> "$GITHUB_STEP_SUMMARY"
          node tools/moon-cache/bench/analyze.mjs .moon/cache/runReport.json | tee -a "$GITHUB_STEP_SUMMARY"
          echo "TOTALS runner=${{ matrix.runner }} cache=${{ matrix.cache }} build_s=${BUILD_S} test_s=${TEST_S}" | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash
