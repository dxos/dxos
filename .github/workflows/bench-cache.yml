# Two ways of caching moon on the same runner class: our self-hosted bazel-remote, against
# Blacksmith's sticky disks. Dispatch only — an experiment, not a check.
#
# The two arms are not the same mechanism, which is the point of measuring rather than reasoning:
#   droplet — a fresh runner every time, so every cached task is a REMOTE hydration over the
#             network (`cached-from-remote`).
#   sticky  — the cache is a cloned block device, so a warm run is LOCAL hits (`cached`) with no
#             network at all. Its cost moves to mount and snapshot-commit time instead.
#
# Run it TWICE. The first run populates: the droplet arm uploads, and the sticky arm has an empty
# snapshot to fill, so both look like cold builds. The second run is the measurement.
#
# Sticky-disk semantics worth knowing before reading the numbers (docs.blacksmith.sh):
#   - Every job gets an isolated clone; concurrent jobs never share a live disk.
#   - A clone is committed as the new snapshot only at job end, and with branch protection enabled
#     only push/schedule/workflow_dispatch on the DEFAULT branch may commit at all. If that is on,
#     a branch run can never accumulate a snapshot and the sticky arm will look permanently cold —
#     which is itself the finding, not a broken benchmark.
name: Bench Cache

on:
  # `workflow_dispatch` only fires for workflows already on the default branch, and `main` is
  # protected — so until this lands, the branch-scoped push trigger is the only way to run it.
  # REMOVE the push trigger before merging.
  push:
    branches:
      - claude/depot-vs-self-hosted-cache-3fbd62
  workflow_dispatch:
    inputs:
      runner:
        description: 'Blacksmith runner label.'
        default: 'blacksmith-8vcpu-ubuntu-2404'

env:
  MOON_CACHE_CA_PEM: ${{ secrets.MOON_CACHE_CA_PEM }}
  MOON_CACHE_CLIENT_PEM: ${{ secrets.MOON_CACHE_CLIENT_PEM }}
  MOON_CACHE_CLIENT_KEY: ${{ secrets.MOON_CACHE_CLIENT_KEY }}

jobs:
  droplet:
    name: 'Blacksmith + droplet cache'
    runs-on: ${{ inputs.runner || 'blacksmith-8vcpu-ubuntu-2404' }}
    container:
      image: ghcr.io/dxos/gh-actions:24.11.1
      credentials:
        username: dxos-bot
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build
        run: |
          start=$(date +%s)
          moon run :build
          echo "wall_s=$(( $(date +%s) - start ))" | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Cache breakdown
        if: always()
        run: node tools/moon-cache/bench/analyze.mjs .moon/cache/runReport.json | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash

  sticky:
    name: 'Blacksmith + sticky disk'
    runs-on: ${{ inputs.runner || 'blacksmith-8vcpu-ubuntu-2404' }}
    container:
      image: ghcr.io/dxos/gh-actions:24.11.1
      credentials:
        username: dxos-bot
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      # Keyed per job: on a shared key only the last job to finish keeps its artifacts, and this
      # workflow runs two jobs at once.
      - name: Mount moon cache
        uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-moon-cache-${{ github.job }}
          path: .moon/cache

      # The mount happens on the runner while the job runs in a container, so it may not arrive.
      # If this reports the root filesystem, the arm measured a plain disk and its numbers mean
      # nothing.
      - name: Confirm the mount reached the container
        run: |
          df -h .moon/cache
          echo "contents: $(du -sh .moon/cache 2>/dev/null | cut -f1) in $(find .moon/cache -type f 2>/dev/null | wc -l) files"
        shell: bash

      - name: Setup
        uses: ./.github/actions/setup
        with:
          remote-cache: 'false'

      - name: Build
        run: |
          start=$(date +%s)
          moon run :build
          echo "wall_s=$(( $(date +%s) - start ))" | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Cache breakdown
        if: always()
        run: |
          node tools/moon-cache/bench/analyze.mjs .moon/cache/runReport.json | tee -a "$GITHUB_STEP_SUMMARY"
          echo "sticky disk now: $(du -sh .moon/cache | cut -f1)" | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash
