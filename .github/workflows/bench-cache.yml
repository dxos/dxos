# Depot runners against Blacksmith runners, against a cache on each coast and no cache at all.
# Dispatch only — an experiment, not a check.
#
# The matrix separates three things that a single job time confuses:
#   off  — nothing is restored, so this is the runner's raw compute throughput.
#   nyc3 — the cache in New York. Near Depot (us-east-1), far from Blacksmith (us-west).
#   sfo3 — the same cache in San Francisco. The mirror image.
# Each runner therefore gets a near cache and a far one, which is what makes the runners
# comparable: the first pass showed Depot restoring 4x faster than Blacksmith purely because the
# only cache was on Depot's coast.
#
# Both hosts run identical bazel-remote behind mTLS from one CA, and the sfo3 certificate carries
# `cache.dxos.network` as a SAN, so `mtls.domain` in workspace.yml verifies against either without
# a second client certificate or a DNS record.
#
# Run it TWICE — sfo3 starts empty, so the first pass populates it.
name: Bench Cache

on:
  # `workflow_dispatch` only fires for workflows already on the default branch, and `main` is
  # protected — so until this lands, the branch-scoped push trigger is the only way to run it.
  # REMOVE the push trigger before merging.
  push:
    branches:
      - claude/depot-vs-self-hosted-cache-3fbd62
  workflow_dispatch:

env:
  MOON_CACHE_CA_PEM: ${{ secrets.MOON_CACHE_CA_PEM }}
  MOON_CACHE_CLIENT_PEM: ${{ secrets.MOON_CACHE_CLIENT_PEM }}
  MOON_CACHE_CLIENT_KEY: ${{ secrets.MOON_CACHE_CLIENT_KEY }}

jobs:
  bench:
    name: '${{ matrix.runner }} cache=${{ matrix.cache }}'
    strategy:
      fail-fast: false
      matrix:
        runner: ['depot-ubuntu-24.04-8', 'blacksmith-8vcpu-ubuntu-2404']
        cache: ['nyc3', 'sfo3', 'off']
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/dxos/gh-actions:24.11.1
      credentials:
        username: dxos-bot
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 60
    env:
      # Matches the `test` job in check.yml: browser tests also need a chromium process, so 4
      # leaves headroom.
      MOON_CONCURRENCY: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup
        with:
          remote-cache: ${{ matrix.cache != 'off' }}

      # sfo3 is addressed by IP because it has no DNS record; its certificate carries the same
      # `cache.dxos.network` SAN, so mtls.domain verifies either way. nyc3 is workspace.yml's
      # default and needs no override.
      - name: Select cache
        if: ${{ matrix.cache == 'sfo3' }}
        run: echo 'MOON_REMOTE_HOST=grpcs://143.198.61.162:9092' >> "$GITHUB_ENV"
        shell: bash

      - name: Machine
        run: |
          echo "runner=${{ matrix.runner }} cache=${{ matrix.cache }}"
          echo "cpus=$(nproc) mem=$(free -g | awk '/^Mem:/{print $2}')GB"
          # RTT is the number that explains the restore columns, so measure both hosts from every
          # runner rather than only the one this arm uses.
          for host in cache.dxos.network 143.198.61.162; do
            printf 'rtt %-22s' "$host"
            for _ in 1 2 3; do
              curl -o /dev/null -s --connect-timeout 5 -w ' %{time_connect}' "https://$host:9093/status" || true
            done
            echo
          done
        shell: bash

      - name: Build
        run: |
          start=$(date +%s)
          moon run :build
          echo "BUILD_S=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
        shell: bash

      - name: Build breakdown
        run: |
          echo "### build — ${{ matrix.runner }} cache=${{ matrix.cache }} — ${BUILD_S}s" >> "$GITHUB_STEP_SUMMARY"
          node tools/moon-cache/bench/analyze.mjs .moon/cache/runReport.json | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash

      # A fixed set rather than `:test`, so the two runners execute identical work in a bounded
      # time. With the cache on these hydrate instead of running, which is the comparison: restore
      # cost against execution cost for the same targets.
      - name: Test
        run: |
          start=$(date +%s)
          moon run echo:test protocols:test client:test react-ui:test keys:test util:test crypto:test random:test -- --no-file-parallelism
          echo "TEST_S=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
        shell: bash

      - name: Test breakdown
        if: always()
        run: |
          echo "### test — ${{ matrix.runner }} cache=${{ matrix.cache }} — ${TEST_S}s" >> "$GITHUB_STEP_SUMMARY"
          node tools/moon-cache/bench/analyze.mjs .moon/cache/runReport.json | tee -a "$GITHUB_STEP_SUMMARY"
          echo "TOTALS runner=${{ matrix.runner }} cache=${{ matrix.cache }} build_s=${BUILD_S} test_s=${TEST_S}" | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash
