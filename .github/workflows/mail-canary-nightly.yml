name: Mail canary nightly

# End-to-end canary for Gmail sync on preview EDGE (packages/plugins/plugin-google/canary/README.md).
# It signs in to the canary identity with its recovery phrase on every run, so no device key ever sits
# in an Actions cache a fork could read.

on:
  schedule:
    # 03:17 UTC: after `EDGE nightly` (02:00), off the hour so it is not queued behind other crons.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      count:
        type: string
        description: 'Pool messages to seed as new mail'
        default: '100'
      stages:
        type: string
        description: 'Stages to run besides the monitor: seed (1), full (3)'
        default: 'seed,full'

permissions:
  contents: read
  packages: read

env:
  MOON_CACHE_CA_PEM: ${{ secrets.MOON_CACHE_CA_PEM }}
  MOON_CACHE_CLIENT_PEM: ${{ secrets.MOON_CACHE_CLIENT_PEM }}
  MOON_CACHE_CLIENT_KEY: ${{ secrets.MOON_CACHE_CLIENT_KEY }}

# Two runs at once would read the same cursor and judge each other's copies.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-24.04
    # Stage 2 waits up to 30 minutes and stage 3 up to 60.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup

      # The pool lives in the encrypted `enron-pool` agents fixture, not in Gmail: the sync takes every message
      # added to the account, so mail parked there would sync before the night it is seeded.
      - name: Pull the Enron pool
        if: contains(inputs.stages || 'seed,full', 'seed')
        env:
          AGE_KEY: ${{ secrets.MAIL_CANARY_FIXTURES_AGE_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.MAIL_CANARY_R2_TOKEN }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends age
          KEY_FILE="$RUNNER_TEMP/fixtures.key"
          (umask 077 && printf '%s\n' "$AGE_KEY" > "$KEY_FILE")
          DX_FIXTURES_AGE_KEY="$KEY_FILE" node tools/fixtures/bin/fixtures.mjs pull enron-pool --scope agents
          rm -f "$KEY_FILE"
          echo "DX_CANARY_POOL=$(ls testing/fixtures/enron-pool-*.mbox | sort | tail -1)" >> "$GITHUB_ENV"

      - name: Run canary
        env:
          DX_CANARY_RECOVERY_PHRASE: ${{ secrets.MAIL_CANARY_RECOVERY_PHRASE }}
          DX_CANARY_SPACE_ID: ${{ vars.MAIL_CANARY_SPACE_ID }}
          DX_CANARY_SEED_COUNT: ${{ inputs.count || '100' }}
          DX_CANARY_STAGES: ${{ inputs.stages || 'seed,full' }}
          DX_CANARY_REPORT_DIR: ${{ runner.temp }}/mail-canary
          GMAIL_CLIENT_ID: ${{ secrets.MAIL_CANARY_GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.MAIL_CANARY_GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.MAIL_CANARY_GMAIL_REFRESH_TOKEN }}
        run: moon run plugin-google:mail-canary

      - name: Report
        if: always()
        run: cat "${{ runner.temp }}/mail-canary/summary.md" >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mail-canary-report
          path: ${{ runner.temp }}/mail-canary
          retention-days: 14
          if-no-files-found: ignore

      # One event per run, so PostHog can alert on a failed night and on a night with no event at all.
      - name: Record the run
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        env:
          DX_POSTHOG_API_KEY: ${{ secrets.COMPOSER_APP_PROD_POSTHOG_API_KEY }}
        run: |
          SUMMARY="${{ runner.temp }}/mail-canary/summary.json"
          if [ ! -f "$SUMMARY" ]; then
            mkdir -p "$(dirname "$SUMMARY")"
            echo '{"ok":false,"failedChecks":"NO_REPORT"}' > "$SUMMARY"
          fi
          node scripts/ci-event.mjs --event ci.mail-canary --timestamp now --properties "$SUMMARY"
