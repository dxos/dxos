name: Crab Nebula Channel
description: Compute the channel for a Crab Nebula release

inputs:
  environment:
    description: Target environment (dev | preview | staging | production).
    required: true

outputs:
  channel:
    description: 'Crab Nebula channel'
    value: ${{ steps.release-channel.outputs.channel }}

runs:
  using: 'composite'
  steps:
    - id: release-channel
      shell: bash
      env:
        ENVIRONMENT: ${{ inputs.environment }}
      run: |
        if [ -z "$ENVIRONMENT" ]; then
          echo 'cn-channel: environment input is required' >&2
          exit 1
        fi
        # Empty for production, which ships on CrabNebula's default channel — the one the public releases
        # page lists and the download button serves. A channel here publishes where nobody can reach it.
        if [ "$ENVIRONMENT" = 'production' ]; then
          echo 'channel=' >> "$GITHUB_OUTPUT"
        else
          echo "channel=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
        fi
