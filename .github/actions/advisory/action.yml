name: Advisory suites
description: >
  Runs the suites that report on a PR without gating it, the memory retention suites and the
  model-fixture replay, and posts each result as its own commit status (`Check / memory`,
  `Model Fixture / model-fixture`). A failure never fails the calling job. Call after the setup and
  affected actions, from a job with `statuses: write`; a suite the change does not affect is skipped.

runs:
  using: 'composite'
  steps:
    # Coverage instrumentation is off for both: it would skew the retention measurements and adds
    # nothing to a replay. The model-fixture replay leaves DX_UPDATE_MODEL_FIXTURES unset, so a
    # missing fixture errors instead of calling the live model.
    - name: Run
      id: run
      shell: bash
      env:
        DX_DEBUG_LEAKS_DIR: ${{ runner.temp }}/profiles
        VITEST_COVERAGE: 'false'
      run: |
        memory=success
        VITEST_TAGS_FILTER='!flaky && !sync && !sync-e2e && !functions-e2e' VITEST_XML_REPORT=false \
          moon run echo-client-e2e:test-memory || memory=failure

        rm -rf test-results
        fixture=success
        DX_RUN_MODEL_FIXTURE_TESTS=1 VITEST_TAGS_FILTER=model-fixture VITEST_XML_REPORT=true \
          moon run '#model-fixture:test' -- --no-file-parallelism || fixture=failure

        echo "memory=$memory" >> "$GITHUB_OUTPUT"
        echo "model-fixture=$fixture" >> "$GITHUB_OUTPUT"

    - name: Upload model-fixture results
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: model-fixture-report
        path: test-results
        retention-days: 7

    # A fork PR's token is read-only, so it cannot post statuses; a rejected post only warns.
    - name: Report statuses
      if: ${{ github.event.pull_request.head.repo.fork != true }}
      uses: actions/github-script@v7
      env:
        MEMORY: ${{ steps.run.outputs.memory }}
        MODEL_FIXTURE: ${{ steps.run.outputs.model-fixture }}
      with:
        script: |
          const sha = context.payload.pull_request?.head.sha ?? context.sha;
          for (const [name, state] of [
            ['Check / memory', process.env.MEMORY],
            ['Model Fixture / model-fixture', process.env.MODEL_FIXTURE],
          ]) {
            try {
              await github.rest.repos.createCommitStatus({
                ...context.repo,
                sha,
                state,
                context: name,
                description: state === 'success' ? 'Passed or unaffected, on the advisory job' : 'Failed on the advisory job; see its log',
              });
            } catch (err) {
              core.warning(`Could not post the ${name} status (${state}): ${err.message}`);
            }
          }
