name: Crab Nebula Update Config
description: Generate a tauri config which sets the endpoints for Crab Nebula update server.

inputs:
  version:
    description: 'Version'
    required: true
  environment:
    description: Target environment (dev | nightly | staging | production) — selects the updater channel.
    required: true
  ios-bundle-version:
    description: >-
      Optional override for bundle.iOS.bundleVersion (Apple's CFBundleVersion, which must be plain digits
      separated by dots — a prerelease-tagged `version` fails Apple's validation). Skipped if empty.
    required: false
    default: ''
  working-directory:
    description: 'Working directory'
    default: '.'

runs:
  using: 'composite'
  steps:
    - uses: ./.github/actions/cn-channel
      id: release-channel
      with:
        environment: ${{ inputs.environment }}

    - name: Find tauri.conf.json
      id: find-tauri-config
      run: |
        if [ -f "${{ inputs.working-directory }}/tauri.conf.json" ]; then
          echo "tauri_conf_json_path=${{ inputs.working-directory }}/tauri.conf.json" >> $GITHUB_OUTPUT
        else
          echo "Error: tauri.conf.json not found in ${{ inputs.working-directory }}"
          exit 1
        fi
      shell: bash

    - name: Update endpoints in tauri.conf.json
      run: |
        jq \
          --arg channel "${{ steps.release-channel.outputs.channel }}" \
          '.plugins.updater.endpoints = [
            "https://cdn.crabnebula.app/update/dxos/composer/{{target}}-{{arch}}/{{current_version}}?channel=\($channel)"
          ]' \
          "${{ steps.find-tauri-config.outputs.tauri_conf_json_path }}" > "${{ steps.find-tauri-config.outputs.tauri_conf_json_path }}.tmp" && \
        mv "${{ steps.find-tauri-config.outputs.tauri_conf_json_path }}.tmp" "${{ steps.find-tauri-config.outputs.tauri_conf_json_path }}"
      shell: bash

    # A distinct app name per environment so a dogfooder can keep nightly and production installed side by
    # side and tell them apart in the dock. `bundle.identifier` deliberately does NOT change with it: iOS
    # provisioning and the App Store Connect record are bound to `org.dxos.composer`, and the `composer:`
    # deep-link scheme is claimed by name, not by product name.
    - name: Update product name in tauri.conf.json
      env:
        ENVIRONMENT: ${{ inputs.environment }}
      run: |
        case "$ENVIRONMENT" in
          production) product_name='Composer' ;;
          nightly) product_name='Composer Nightly' ;;
          staging) product_name='Composer Staging' ;;
          dev) product_name='Composer Dev' ;;
          # Fail rather than silently ship an unlabelled build under production's name.
          *) echo "::error::cn-config: no product name for environment \"$ENVIRONMENT\"" && exit 1 ;;
        esac
        jq \
          --arg name "$product_name" \
          '.productName = $name' \
          "${{ steps.find-tauri-config.outputs.tauri_conf_json_path }}" > temp.json && \
        mv temp.json "${{ steps.find-tauri-config.outputs.tauri_conf_json_path }}"
      shell: bash

    - name: Update version in tauri.conf.json
      run: |
        jq \
          --arg version "${{ inputs.version }}" \
          '.version = $version' \
          "${{ steps.find-tauri-config.outputs.tauri_conf_json_path }}" > temp.json && \
        mv temp.json "${{ steps.find-tauri-config.outputs.tauri_conf_json_path }}"
      shell: bash

    - name: Update iOS bundle version in tauri.conf.json
      if: inputs.ios-bundle-version != ''
      run: |
        jq \
          --arg version "${{ inputs.ios-bundle-version }}" \
          '.bundle.iOS.bundleVersion = $version' \
          "${{ steps.find-tauri-config.outputs.tauri_conf_json_path }}" > temp.json && \
        mv temp.json "${{ steps.find-tauri-config.outputs.tauri_conf_json_path }}"
      shell: bash

    - name: Update version in package.json
      run: |
        PACKAGE_JSON="${{ inputs.working-directory }}/../package.json"
        if [ -f "$PACKAGE_JSON" ]; then
          jq \
            --arg version "${{ inputs.version }}" \
            '.version = $version' \
            "$PACKAGE_JSON" > temp.json && \
          mv temp.json "$PACKAGE_JSON"
        fi
      shell: bash
