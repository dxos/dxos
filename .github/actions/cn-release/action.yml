name: Crab Nebula Release
description: Run a Crab Nebula release command

inputs:
  api-key:
    description: 'Cloud Release API key'
    required: true
  command:
    description: 'Cloud Release command'
    required: true
  application:
    description: 'Cloud Release application name'
    required: true
  environment:
    description: Target environment (labs | staging | production) — selects the channel.
    required: true
  framework:
    description: 'Cloud Release framework'
    default: 'tauri'
  working-directory:
    description: 'Working directory'
    default: '.'

runs:
  using: 'composite'
  steps:
    - uses: ./.github/actions/cn-channel
      id: release-channel
      with:
        environment: ${{ inputs.environment }}

    - uses: FabianLars-crabnebula/cloud-release@e0bb6ccebcb78f71883ebde2320f76aae6b9eb92
      with:
        command: release ${{ inputs.command }} ${{ inputs.application }} --framework ${{ inputs.framework }} --channel ${{ steps.release-channel.outputs.channel }}
        api-key: ${{ inputs.api-key }}
        working-directory: ${{ inputs.working-directory }}
