name: Assert remote cache
description: >
  Fail when a job hydrated fewer tasks from the remote cache than expected. moon treats every
  remote-cache failure as non-fatal — a missing token, a rejected certificate and a dropped blob
  batch all produce a green run that silently rebuilt everything — so the only way to notice is
  to look at the run report.

inputs:
  min-hits:
    description: 'Minimum number of tasks that must report cached-from-remote. 0 disables the check.'
    default: '1'
  warn-only:
    description: 'Report a warning instead of failing. Use while bedding in a new cache.'
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Assert remote cache hits
      env:
        MIN_HITS: ${{ inputs.min-hits }}
        WARN_ONLY: ${{ inputs.warn-only }}
      run: |
        report=.moon/cache/runReport.json
        if [ ! -f "$report" ]; then
          echo "::warning::No run report at $report — nothing to assert."
          exit 0
        fi
        hits=$(node -e '
          const report = require("./.moon/cache/runReport.json");
          let hits = 0;
          for (const action of report.actions) {
            for (const op of action.operations ?? []) {
              if (op.meta?.type === "output-hydration" && op.status === "cached-from-remote") hits++;
            }
          }
          console.log(hits);
        ')
        echo "cached-from-remote: $hits (minimum $MIN_HITS)"
        if [ "$MIN_HITS" -gt 0 ] && [ "$hits" -lt "$MIN_HITS" ]; then
          if [ "$WARN_ONLY" = "true" ]; then
            echo "::warning::Remote cache served $hits tasks, expected at least $MIN_HITS."
          else
            echo "::error::Remote cache served $hits tasks, expected at least $MIN_HITS. The cache is unreachable, unauthenticated, or empty."
            exit 1
          fi
        fi
      shell: bash
