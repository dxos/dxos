[package]
name = "app"
version = "0.1.0"
description = "Composer"
authors = ["dxos.org"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
anyhow = "1"
tauri = { version = "2.11", features = ["devtools", "macos-private-api", "tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-deep-link = "2.4"
tauri-plugin-dialog = "2"
tauri-plugin-fs = { version = "2", features = ["watch"] }
# `unsafe-headers` lets the web view set X-Access-Token; `dangerous-settings` lets it accept the
# LaMetric device's self-signed certificate on the LAN.
tauri-plugin-http = { version = "2", features = ["unsafe-headers", "dangerous-settings"] }

# Plugin asset cache: shared between desktop and mobile (iOS).
sha2 = "0.10"
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["rt", "fs", "net", "sync", "macros"] }
url = "2"

[target.'cfg(unix)'.dependencies]
xattr = "1"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-web-auth = "1"
tauri-plugin-haptics = "2"

[target.'cfg(target_os = "ios")'.dependencies]
# Objective-C runtime only: framework crates auto-link against the wrong SDK here, so AVFAudio is
# linked by the Xcode target instead (see src/audio_input.rs).
objc2 = "0.5"
# Runtime lookup of the Obj-C bridge entry points (see src/audio_input.rs).
libc = "0.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Localhost plugin serves bundled assets via HTTP (needed for SharedWorker in WKWebView on desktop).
tauri-plugin-localhost = "2"
# OAuth HTTP server dependencies (desktop only, mobile uses web-auth plugin).
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tauri-plugin-updater = "2"
tauri-plugin-global-shortcut = "2"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
tauri-plugin-macos-passkey = "0.1.0"
# #region DEBUG — suspension probe reads NSWindow/NSApplication state on the main thread (lib.rs).
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSApplication",
  "NSWindow",
  "NSResponder",
  "NSGraphics",
] }
# #endregion DEBUG

