[package]
name = "tauri-plugin-meeting-capture"
version = "0.1.0"
description = "Detects meetings held in other apps and captures their audio for Composer's meeting recorder."
authors = ["dxos.org"]
license = "FSL-1.1-Apache-2.0"
edition = "2021"
rust-version = "1.77.2"
links = "tauri-plugin-meeting-capture"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11" }

[target.'cfg(target_os = "macos")'.dependencies]
# CoreAudio process objects (which app holds the microphone) and process taps (system audio).
cidre = { version = "0.15", default-features = false, features = ["app", "av", "blocks", "cat", "cf", "cm", "core_audio", "dispatch", "ns", "macos_14_2"] }
# Lock-free hand-off out of the CoreAudio real-time callback, which must not allocate or lock.
ringbuf = "0.4"

[build-dependencies]
tauri-plugin = { version = "2.7", features = ["build"] }

[dev-dependencies]
serde_json = "1.0"
