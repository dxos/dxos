<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="DXOS Composer" />
    <!-- NOTE: viewport-fit=cover defines safe-area-inset-top, etc. for iOS. -->
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=no,interactive-widget=resizes-content,viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="msapplication-TileColor" content="#003E70" />
    <!-- Match the boot loader and `@dxos/ui-theme`'s `--color-base-surface`
         (Tailwind `neutral-50` / `neutral-950`) so the mobile-browser chrome
         tints match what the app renders. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />

    <title>Composer</title>

    <!-- https://realfavicongenerator.net -->
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <link rel="manifest" href="/site.webmanifest" />

    <!-- 
      Suppress lit's dev-mode warning. Lit checks `globalThis.litIssuedWarnings`
      against either the warning code or the full text and skips emitting if a
      match is already present (`@lit/reactive-element/development/reactive-element.js`).
      This must execute *before* any module loads — ESM `import`s are hoisted
      above non-import statements, so the same suppression in `src/main.tsx`
      fires after lit's `queueMicrotask` warning has already run.
    -->
    <script>
      (window.litIssuedWarnings ??= new Set()).add('dev-mode');
    </script>

    <!--
      Recover from a chunk a deploy removed. Each deploy replaces the asset manifest, so a tab that
      loaded `index.html` from an earlier build has no source for a chunk it imports later: the file is
      gone from the server, and the service worker evicts it from the precache on activate. Reloading
      picks up the current build; the app's own state lives in OPFS and IndexedDB, so nothing is lost.

      Inline for the same reason as the block above — ESM imports hoist, so a handler in `src/main.tsx`
      registers after the entry chunk has already had its chance to fail. Registering here also covers
      the entry itself, which `vite:preloadError` does not: a `<script type="module">` that fails to
      load fires a resource `error` event, not Vite's.

      One reload per tab, tracked in sessionStorage, so a genuinely broken deploy cannot loop. The
      marker is left behind for the app to report and clear once it boots (`chunk-recovery.ts`).
    -->
    <script>
      (function () {
        var MARKER = 'dxos.composer.chunk-recovery';
        var ASSETS = window.location.origin + '/assets/';

        var recover = function (reason) {
          // A failure while offline is not a missing chunk, and a reload cannot fix it.
          if (navigator.onLine === false) {
            return;
          }
          try {
            if (sessionStorage.getItem(MARKER)) {
              return;
            }
            sessionStorage.setItem(MARKER, JSON.stringify({ reason: String(reason), at: Date.now() }));
          } catch (err) {
            // No sessionStorage (private mode, blocked site data) means no way to guard against a
            // reload loop, which is far worse than not recovering. Leave the failure to surface.
            console.warn('chunk recovery unavailable:', err);
            return;
          }
          window.location.reload();
        };

        // Vite's preload helper, which covers lazily imported chunks.
        window.addEventListener('vite:preloadError', function (event) {
          event.preventDefault();
          recover((event.payload && event.payload.message) || 'vite:preloadError');
        });

        // A module script or modulepreload link that failed outright. Resource errors do not bubble,
        // hence the capture phase.
        window.addEventListener(
          'error',
          function (event) {
            var el = event.target;
            if (!el || (el.tagName !== 'SCRIPT' && el.tagName !== 'LINK')) {
              return;
            }
            var href = el.src || el.href || '';
            if (href.indexOf(ASSETS) === 0) {
              recover('resource error: ' + href);
            }
          },
          true,
        );

        // A bare `import()` outside Vite's helper rejects rather than firing either event above.
        window.addEventListener('unhandledrejection', function (event) {
          var message = (event.reason && event.reason.message) || '';
          if (
            message.indexOf('dynamically imported module') >= 0 ||
            message.indexOf('Importing a module script failed') >= 0
          ) {
            recover(message);
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root" class="contents"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
