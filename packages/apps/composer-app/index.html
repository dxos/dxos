<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="DXOS Composer" />
    <!-- NOTE: viewport-fit=cover defines safe-area-inset-top, etc. for iOS. -->
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=no,interactive-widget=resizes-content,viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="msapplication-TileColor" content="#003E70" />
    <!-- Match the boot loader and `@dxos/ui-theme`'s `--color-base-surface`
         (Tailwind `neutral-50` / `neutral-950`) so the mobile-browser chrome
         tints match what the app renders. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />

    <title>Composer</title>

    <!-- https://realfavicongenerator.net -->
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <link rel="manifest" href="/site.webmanifest" />

    <!-- 
      Suppress lit's dev-mode warning. Lit checks `globalThis.litIssuedWarnings`
      against either the warning code or the full text and skips emitting if a
      match is already present (`@lit/reactive-element/development/reactive-element.js`).
      This must execute *before* any module loads — ESM `import`s are hoisted
      above non-import statements, so the same suppression in `src/main.tsx`
      fires after lit's `queueMicrotask` warning has already run.
    -->
    <script>
      (window.litIssuedWarnings ??= new Set()).add('dev-mode');
    </script>

    <!--
      A same-origin `/assets/` script or stylesheet that fails while the page loads (e.g. stale HTML naming
      another build's chunks) is recorded, and the page re-navigates once per session so a normal load
      replaces the HTML. `util/boot-reports.ts` reports the record after the next successful boot. The
      keys must match `BOOT_ASSET_FAILURE_KEY` and `BOOT_ASSET_RETRY_KEY` in `util/constants.ts`.
    -->
    <script>
      window.addEventListener(
        'error',
        (event) => {
          const target = event.target;
          const href =
            target instanceof HTMLScriptElement
              ? target.src
              : target instanceof HTMLLinkElement && target.rel === 'stylesheet'
                ? target.href
                : '';
          // Once `load` has fired, failures come from lazily imported chunks rather than the boot HTML.
          if (!href || document.readyState === 'complete') {
            return;
          }
          const url = new URL(href);
          if (url.origin !== location.origin || !url.pathname.startsWith('/assets/')) {
            return;
          }
          try {
            const failureKey = 'dxos.composer.boot-asset-failure';
            const retryKey = 'dxos.composer.boot-asset-retry';
            const failures = (Number(JSON.parse(localStorage.getItem(failureKey) ?? 'null')?.failures) || 0) + 1;
            // Origin and path only: page URLs carry invitation codes in their query.
            const page = location.origin + location.pathname;
            localStorage.setItem(
              failureKey,
              JSON.stringify({ url: url.origin + url.pathname, page, at: Date.now(), failures }),
            );
            // Session-scoped, so a record left by an earlier session cannot use up this one's retry.
            if (!sessionStorage.getItem(retryKey)) {
              sessionStorage.setItem(retryKey, '1');
              location.replace(location.href);
            }
          } catch {
            // Storage unavailable: nothing to record, and no loop guard to reload behind.
          }
        },
        true,
      );
    </script>
  </head>
  <body>
    <div id="root" class="contents"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
