version: 1

runtime:
  client:
    storage:
      persistent: true
    edgeFeatures:
      signaling: true
      subductionReplicator: true
      feedReplicator: true
      agents: true

  services:
    edge:
      url: https://dxos.network/
    iceProviders:
      - urls: https://dxos.network/ice
    # Sandbox is reached through EDGE; its REST API is mounted at /api/sandbox.
    sandbox:
      url: https://dxos.network
    ipfs:
      server: https://api.ipfs.dxos.network/api/v0
      gateway: https://gateway.ipfs.dxos.network/ipfs
    # Every EDGE service is a path prefix on the edge host above; these mirror
    # EDGE_SERVICE_DEFAULTS so the deployed manifest stays explicit.
    edgeServices:
      - name: calls
        endpoint: https://dxos.network/calls
      - name: transcription
        endpoint: https://dxos.network/calls
      - name: image
        endpoint: https://dxos.network/image
      - name: discord
        endpoint: https://dxos.network/discord
