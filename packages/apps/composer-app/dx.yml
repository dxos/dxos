version: 1

runtime:
  client:
    storage:
      persistent: true
    edgeFeatures:
      signaling: true
      subductionReplicator: true
      feedReplicator: true
      agents: true

  services:
    # One address for every EDGE service: each is reached as `<edge>/<service>`, derived from this
    # URL. `runtime.services.edgeServices` is left unset -- it is the per-service override, and an
    # entry here would pin one service to a host that can drift from the environment above.
    edge:
      url: https://dxos.network/
    iceProviders:
      - urls: https://dxos.network/ice
    ipfs:
      server: https://api.ipfs.dxos.network/api/v0
      gateway: https://gateway.ipfs.dxos.network/ipfs
