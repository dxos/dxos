version: 1

runtime:
  client:
    storage:
      persistent: true
    edgeFeatures:
      signaling: true
      subductionReplicator: true
      feedReplicator: true
      agents: true

  services:
    edge:
      url: https://dxos.network/
    iceProviders:
      - urls: https://dxos.network/ice
    sandbox:
      url: https://sandbox-service.dxos.workers.dev
    ipfs:
      server: https://api.ipfs.dxos.network/api/v0
      gateway: https://gateway.ipfs.dxos.network/ipfs
    edgeServices:
      - name: calls
        endpoint: https://calls.dxos.network
      - name: transcription
        endpoint: https://calls.dxos.network
      - name: image
        endpoint: https://image.dxos.network
      - name: discord
        endpoint: https://discord.dxos.network
      - name: introspect
        endpoint: https://introspect.dxos.network/mcp
