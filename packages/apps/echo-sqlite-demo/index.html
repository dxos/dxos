<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- `viewport-fit=cover` so the layout reaches under the iPhone notch and home indicator. -->
    <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
    <title>ECHO on Cloudflare</title>
    <meta name="description" content="A graph database in the browser, synced through a Durable Object." />
    <!-- Paints the system background before the bundle loads, so dark mode does not flash white. -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #fafafa;
      }
      /* Full-bleed on a phone; from `sm` up the app is inset, framed and capped at a reading width,
         centred in the window. A grid row of `1fr` is what lets the panel's `height: 100%` resolve. */
      body {
        box-sizing: border-box;
        display: grid;
        grid-template-rows: minmax(0, 1fr);
      }
      @media (min-width: 640px) {
        body {
          padding: 0.75rem;
          grid-template-columns: minmax(0, 70rem);
          justify-content: center;
        }
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #0a0a0a;
        }
      }
    </style>
  </head>
  <body>
    <!-- `contents` so the Panel's grid is the body's child and inherits its height. -->
    <div id="root" class="contents"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
