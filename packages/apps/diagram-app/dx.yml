version: 1

# Account-less identities get only signaling from EDGE (swarm and signal frames): peers find each other there and
# sync directly. Replicators and agents stay off until EDGE serves unbound identities (spec Q-2).
runtime:
  client:
    storage:
      persistent: true
    edgeFeatures:
      signaling: true
      subductionReplicator: false
      feedReplicator: false
      agents: false

  services:
    edge:
      url: https://dxos.network/
    iceProviders:
      - urls: https://dxos.network/ice
