# No `check-module-structure`: this plugin declares no `environments`, so it generates no headless
# barrel and its `#capabilities` is the unconditioned default. Tracing it under node/workerd would
# assert a property of a bundle no headless host loads — those hosts leave a browser-only plugin
# out of their plugin list instead.
