layer: library
language: typescript
tags:
  - composer-plugin
  - ts-vite-build
  - ts-test
tasks:
  check-module-structure:
    command: >-
      pnpm exec dx-trace-imports
      --export ./OnboardingPlugin
      --to "{react,react-dom}"
      --conditions workerd,worker
      --conditions node
      --fail-on present
    deps:
      - dx-trace-imports:build
      - build
    inputs:
      - tsconfig.json
      - '@group(production)'
      - /pnpm-lock.yaml
    options:
      timeout: 60
  build-exemplar:
    script: pnpm run --silent build-exemplar
    deps:
      - ^:build
    inputs:
      - scripts/build-exemplar-space.ts
      - src/content/space-tour.md
      - src/content/about-bramble.md
    outputs:
      - src/content/exemplar-space.dx.json
