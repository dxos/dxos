layer: library
language: typescript
tags:
  - ts-vite-build
  - ts-test
  - pack
tasks:
  check-module-structure:
    # A provider plugin is headless: no React, no UI packages. Fail if the plugin entry ever reaches
    # one, so the constraint is enforced rather than assumed.
    command: >-
      pnpm exec dx-trace-imports
      --export ./JmapPlugin
      --to "{@dxos/react-ui,react}"
      --conditions workerd,worker
      --fail-on present
    deps:
      - dx-trace-imports:build
      - build
    inputs:
      - tsconfig.json
      - '@group(production)'
      - /pnpm-lock.yaml
    options:
      timeout: 60
