layer: library
language: typescript
tags:
  - composer-plugin
  - ts-vite-build
  - ts-test
  - pack
tasks:
  check-module-structure:
    # A provider plugin is headless: no React, no UI packages. Fail if the plugin entry ever reaches
    # one, so the constraint is enforced rather than assumed.
    command: >-
      bun $workspaceRoot/tools/dx-trace-imports/cli.js
      --export ./JmapPlugin
      --to "@dxos/react-ui"
      --to react
      --conditions workerd,worker
      --conditions node
      --fail-on present
    deps:
      - dx-trace-imports:build
      - build
    inputs:
      - tsconfig.json
      - '@group(production)'
      - /pnpm-lock.yaml
    options:
      timeout: 60
