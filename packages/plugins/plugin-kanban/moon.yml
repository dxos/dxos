layer: library
language: typescript
tags:
  - composer-plugin
  - e2e
  - ts-vite-build
  - ts-test
  - ts-test-workerd
  - ts-test-browser
  - ts-test-storybook
  - pack
  - storybook
  - headless-node
tasks:
  test-browser:
    deps:
      - ~:build
  e2e:
    # `storybook dev` resolves packages from source, but Vite's dep-scan aborts without vendor dist,
    # taking the web server down with it.
    deps:
      - target: storybook-react:e2e-deps
        cacheStrategy: hash
    inputs:
      - .storybook/*
      - /tools/storybook-react/.storybook/main.ts
