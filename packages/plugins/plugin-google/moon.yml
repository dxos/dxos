layer: library
language: typescript
tags:
  - composer-plugin
  - ts-vite-build
  - ts-test
  - ts-test-workerd
  - pack
tasks:
  check-module-structure:
    # A provider plugin is headless: no React, no UI packages. Fail if the plugin entry ever reaches
    # one, so the constraint is enforced rather than assumed.
    command: >-
      bun $workspaceRoot/tools/dx-trace-imports/cli.js
      --export ./GooglePlugin
      --to "@dxos/react-ui"
      --to react
      --conditions workerd,worker
      --conditions node
      --fail-on present
    deps:
      - dx-trace-imports:build
      - build
    inputs:
      - tsconfig.json
      - '@group(production)'
      - /pnpm-lock.yaml
    options:
      timeout: 60
  # The nightly Gmail sync canary (src/canary/README.md): the `sync-e2e`-tagged suite `test` skips, run
  # against preview with the canary's secrets. It seeds a real mailbox, so it is uncached and never in `Check`.
  mail-canary:
    extends: test
    args:
      - src/canary/nightly/canary.test.ts
    env:
      VITEST_TAGS_FILTER: sync-e2e
      # Identity recovery logs its device credential at info, and the job log is public.
      LOG_FILTER: warn
    options:
      cache: false
      runInCI: false
