layer: library
language: typescript
tags:
  - composer-plugin
  - edge-release
  - ts-vite-build
  - ts-test
  - ts-test-workerd
  - pack
tasks:
  # The nightly Gmail sync canary (canary/README.md): the `sync-e2e` suite `test` skips. Uncached, since it
  # writes to a real mailbox; `Check` never names it, and `runInCI: false` would refuse its own workflow.
  mail-canary:
    extends: test
    args:
      - canary/test/canary.test.ts
      # Streams the logs as they happen, so a run that times out or is cancelled still shows how far it got.
      - --disableConsoleIntercept
    env:
      VITEST_TAGS_FILTER: sync-e2e
      # Identity recovery logs its device credential at info, and the job log is public: info only from the canary.
      LOG_FILTER: warn,plugin-google/canary:info
    options:
      cache: false
      # Without it moon holds the output until the task ends, and the logs of a run that hangs never show.
      outputStyle: stream
      # A backstop above `runTimeoutMinutes` in canary/canary.yml; `test` would stop the run after 10 minutes.
      timeout: 3900
