layer: library
language: typescript
tags:
  - composer-plugin
  - ts-vite-build
  - ts-test
  - ts-test-storybook
  - pack
  - storybook
tasks:
  check-module-structure:
    # Every plugin generates headless capability barrels, so the plugin entry must stay UI-free
    # under each condition it produces: fail if React ever becomes reachable from it.
    command: >-
      pnpm exec dx-trace-imports
      --export ./TldrawPlugin
      --to "{react,react-dom}"
      --conditions workerd,worker
      --conditions node
      --fail-on present
    deps:
      - dx-trace-imports:build
      - build
    inputs:
      - tsconfig.json
      - '@group(production)'
      - /pnpm-lock.yaml
    options:
      timeout: 60
  build:
    deps:
      - copy-assets
  # Renamed off `prebuild` so it does not shadow the `composer-plugin` tag's barrel generation;
  # `build` depends on both.
  copy-assets:
    command: bash ./scripts/copy_assets.sh
    toolchains: node # enforce that deps are installed
    inputs:
      - scripts/copy_assets.sh
      - package.json
      - moon.yml
    outputs:
      - dist/assets
