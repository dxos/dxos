layer: library
language: typescript
tags:
  - composer-plugin
  - ts-vite-build
  - ts-test
  - ts-test-storybook
  - pack
  - storybook
  # Selected by the `#model-fixture:test` CI target; without it the two model-fixture
  # suites in this package are never picked up.
  - model-fixture
tasks:
  check-module-structure:
    # Fail when the ./plugin export pulls in `@dxos/react-ui`. The plugin entry must
    # remain UI-free under workerd so it can load in non-DOM environments.
    command: >-
      bun $workspaceRoot/tools/dx-trace-imports/cli.js
      --export ./InboxPlugin
      --to "@dxos/react-ui"
      --conditions workerd,worker
      --conditions node
      --fail-on present
    deps:
      - dx-trace-imports:build
      - build
    inputs:
      - tsconfig.json
      - '@group(production)'
      - /pnpm-lock.yaml
    options:
      timeout: 60
