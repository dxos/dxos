layer: library
language: typescript
tags:
  - composer-plugin
  - ts-vite-build
  - ts-test
  - ts-test-storybook
  - ts-test-workerd
  - pack
  - storybook

tasks:
  # EDGE's operation-service imports this handler set directly, and it declares no condition.
  check-module-structure:
    args:
      - --export
      - ./CodeOperationHandlerSet
  scan-feature-links:
    # Prints every `@feature` tag in the repository as the input of the importFeatureLinks operation.
    command: bun $projectRoot/scripts/scan-feature-links.ts
    options:
      cache: false
      runInCI: false
  build:
    deps:
      - ~:prebuild-spec-index
  test:
    deps:
      - ~:prebuild-spec-index
  test-storybook:
    deps:
      - ~:prebuild-spec-index
  # The spec index the viewer resolves `<spec id>#<item>` references through; named directly in the deps above since
  # a same-project `~:#prebuild` tag dep resolves to nothing for a tag-inherited task.
  prebuild-spec-index:
    script: mkdir -p src/components/SpecEditor/gen && pnpm --filter @dxos/deus exec node --conditions=source bin/deus.ts index --out $projectRoot/src/components/SpecEditor/gen/spec-index.json
    inputs:
      - /**/*.mdl
      # The indexer itself, so a change to it regenerates rather than restoring a stale index from cache.
      - /packages/reflect/deus/src/**/*
      - /packages/reflect/deus/bin/*
    outputs:
      - src/components/SpecEditor/gen/spec-index.json
    tags:
      - prebuild
