layer: library
language: typescript
tags:
  - composer-plugin
  - ts-vite-build
  - ts-test

tasks:
  # The manual e2e suites read these, so a cached run with other values must not replay. Credentials
  # stay out: moon records input values in its cache manifests.
  test:
    inputs:
      - $DX_E2E_EDGE_URL
      - $DX_E2E_EDGE_FAKE_AGENT
      - $DX_E2E_MODEL
      - $DX_E2E_CLAUDE_ACP_VERSION
      - $DX_E2E_CLAUDE
      - $DX_E2E_CLAUDE_MODEL
  check-module-structure:
    # The plugin generates node and workerd capability barrels, so its headless entry must stay
    # UI-free: fail if React ever becomes reachable from it under either condition.
    command: >-
      bun $workspaceRoot/tools/dx-trace-imports/cli.js
      --export ./ClaudePlugin
      --to "{react,react-dom}"
      --conditions workerd,worker
      --conditions node
      --fail-on present
    deps:
      - dx-trace-imports:build
      - build
    inputs:
      - tsconfig.json
      - '@group(production)'
      - /pnpm-lock.yaml
    options:
      timeout: 60
  # The Claude Code agent the desktop app's agent helper runs (the ACP adapter, bundled). Not part of
  # `build`: only composer-app's Tauri build consumes it, and it installs the pinned adapter from npm.
  compile-agent:
    command: bun
    args:
      - ./scripts/build-agent.ts
    inputs:
      - scripts/build-agent.ts
      - /.prototools
    outputs:
      - dist/agent/
    options:
      timeout: 300
  # The coding-agent helper the desktop app bundles, compiled for the host platform. Not part of
  # `build`: only composer-app's Tauri build consumes it.
  compile-agent-helper:
    command: bun
    args:
      - ./scripts/build-agent-helper.ts
    deps:
      - ^:build
    inputs:
      - '@group(production)'
      - scripts/build-agent-helper.ts
      - /.prototools
    outputs:
      - dist/sidecar/
    options:
      # Compiled for the host, which moon's hash does not cover: a cached artifact could be another
      # platform's executable. It builds in seconds, so it is simply never cached.
      cache: false
      timeout: 120
