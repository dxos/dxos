layer: library
language: typescript
tags:
  - composer-plugin
  - ts-vite-build
  - ts-test
  - ts-test-storybook
  - pack
  - storybook

tasks:
  check-module-structure:
    command: >-
      bun $workspaceRoot/tools/dx-trace-imports/cli.js
      --export ./BloggerPlugin
      --to "{react,react-dom}"
      --conditions workerd,worker
      --conditions node
      --fail-on present
    deps:
      - dx-trace-imports:build
      - build
    inputs:
      - tsconfig.json
      - '@group(production)'
      - /pnpm-lock.yaml
    options:
      timeout: 60
