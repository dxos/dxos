layer: library
language: typescript
tags:
  - composer-plugin
  - edge-release
  - ts-vite-build
  - ts-test
  - ts-test-workerd
  - pack
  - storybook
  - ts-test-storybook

tasks:
  test:
    # The mermaid/UML layout suites run ~180s locally but exceed the 600s preset default under CI
    # contention, so the task was killed with every test passing. Raised until the CI-side slowdown
    # is understood; see https://github.com/dxos/dxos/pull/12985 for the measurements.
    options:
      timeout: 1800
  # Renders docs/diagrams/*.mmd to .svg through the SVG variant and prints the layout report;
  # `-- --scoreboard` prints the strategy × metric table instead. See docs/diagrams/README.md.
  render-diagrams:
    # Straight from source (`--conditions=source`), so a render never waits on the plugin's ~150 upstream
    # builds. Plain node + tsx rather than vite-node, because tsx caches its transforms on disk and vite-node
    # re-transforms the whole source graph on every run; the tsconfig turns on the legacy decorators the ECHO
    # types carry, and `raw-loader.mjs` serves the diagram rules' `?raw` imports. Not bun: its CJS interop
    # cannot construct elkjs's bundled fake worker.
    command: node
    args:
      - '--conditions=source'
      - '--import'
      - tsx
      - '--import'
      - ./scripts/raw-loader.mjs
      - scripts/render-diagrams.tsx
    env:
      TSX_TSCONFIG_PATH: scripts/tsconfig.render.json
    inputs:
      - scripts/render-diagrams.tsx
      - scripts/raw-loader.mjs
      - scripts/render.tsx
      - scripts/emit-worker.ts
      - scripts/tsconfig.render.json
      - docs/diagrams/*.mmd
      - src/**/*
    outputs:
      - docs/diagrams/*.svg
    options:
      cache: false
      runInCI: false

  judge-diagrams:
    # Same runner and prerequisites as render-diagrams; the architecture rows need TYPESAFE_API_KEY.
    command: vite-node scripts/judge-diagrams.ts
    deps:
      - esbuild-plugins:build
      - vite-plugin-import-source:build
      - ^:build
    options:
      cache: false
      runInCI: false

  eval-layout-views:
    # Compares System One reading each `View` rendering with a reference that saw the image; needs TYPESAFE_API_KEY.
    command: vite-node scripts/eval-layout-views.ts
    deps:
      - esbuild-plugins:build
      - vite-plugin-import-source:build
      - ^:build
    options:
      cache: false
      runInCI: false

  appeal-diagrams:
    # Scores diagrams against @dxos/diagram's rule library, by code and, with --judge clef, from the rendered image.
    command: vite-node scripts/appeal-diagrams.ts
    deps:
      - esbuild-plugins:build
      - vite-plugin-import-source:build
      - ^:build
    options:
      cache: false
      runInCI: false
