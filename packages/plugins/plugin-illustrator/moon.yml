layer: library
language: typescript
tags:
  - composer-plugin
  - ts-vite-build
  - ts-test
  - pack

tasks:
  # Renders docs/diagrams/*.mmd to .svg through the SVG variant and prints the layout report;
  # `-- --scoreboard` prints the strategy × metric table instead. See docs/diagrams/README.md.
  render-diagrams:
    # vite-node: elkjs mistakes bun's global `self` for a web worker; `render.ts` carries the bun shim.
    command: vite-node scripts/render-diagrams.ts
    inputs:
      - scripts/render-diagrams.ts
      - docs/diagrams/*.mmd
      - scripts/standalone-svg.ts
      - src/**/*
    outputs:
      - docs/diagrams/*.svg
    options:
      cache: false
      runInCI: false

  # Renders one mermaid source to a standalone SVG: `-- --input a.mmd --output a.svg`, or stdin to
  # stdout. The layout report goes to stderr.
  render:
    command: bun scripts/render.ts
    options:
      cache: false
      runInCI: false

  check-module-structure:
    # The plugin now generates node/workerd capability barrels, so the headless entry must stay
    # UI-free: fail if React ever becomes reachable from it under either condition.
    command: >-
      bun $workspaceRoot/tools/dx-trace-imports/cli.js
      --export ./IllustratorPlugin
      --to "{react,react-dom}"
      --conditions workerd,worker
      --conditions node
      --fail-on present
    deps:
      - dx-trace-imports:build
      - build
    inputs:
      - tsconfig.json
      - '@group(production)'
      - /pnpm-lock.yaml
    options:
      timeout: 60
