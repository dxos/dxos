layer: library
language: typescript
tags:
  - composer-plugin
  - edge-release
  - ts-vite-build
  - ts-test
  - ts-test-storybook
  - pack
  - storybook
tasks:
  generate-fixtures:
    command: 'pnpm exec tsx src/testing/generate-fixtures.ts'
    options:
      runInCI: false
      cache: false

  # List the channels the bot can see. Requires DISCORD_TOKEN; prints `<id>  <#channel — guild>`.
  channels:
    command: 'pnpm exec vitest run src/services/discord-source.test.ts -t "lists channels"'
    options:
      runInCI: false
      cache: false

  # Live crawl into the fact graph. Requires DISCORD_TOKEN + DISCORD_CHANNEL_ID.
  # Tunable via DISCORD_MAX_DAYS / DISCORD_THREADS / DISCORD_LIST_FACTS and DX_ANTHROPIC_API_KEY.
  # `cache: false` so env changes (lookback, key) always take effect — the cached `test` task would not.
  crawl:
    command: 'pnpm exec vitest run src/services/discord-source.test.ts -t "crawls a real channel"'
    options:
      runInCI: false
      cache: false

  # Crawl seed channels via DiscordPipeline into persistent SQLite: messages and crawl state in DISCORD_CRAWL_DB,
  # channels as `id[:days]` in DISCORD_CRAWL_CHANNELS (DISCORD_CRAWL_REWIND=id,… re-reads a channel further back),
  # extracted RDF facts in DISCORD_FACTS_DB. Requires DISCORD_TOKEN; tunable via DISCORD_CRAWL_CHANNELS /
  # DISCORD_MAX_DAYS / DISCORD_LIST_FACTS and DX_ANTHROPIC_API_KEY. Re-running resumes.
  crawl-demo:
    command: 'pnpm exec vitest run src/testing/crawl-demo.test.ts'
    options:
      runInCI: false
      cache: false

  # Export channels (and their threads) as DiscordChatExporter JSON with DISCORD_EXPORT_TOKEN, e.g.
  # `moon run plugin-discord:export -- --guild <id> --days 30`. See the script header for flags.
  export:
    command: 'pnpm exec tsx src/testing/discord-export.ts'
    options:
      runInCI: false
      cache: false

  # Serve the RDF facts crawl-demo persisted (DISCORD_FACTS_DB) over HTTP on DISCORD_FACT_SERVER_PORT (7700) for the
  # stories-brain `FactExplorer` story. Runs until interrupted.
  fact-server:
    command: 'pnpm exec tsx src/testing/fact-server.ts'
    deps:
      - 'pipeline-rdf:build'
    options:
      runInCI: false
      cache: false
      persistent: true

  # Replay the cached messages (no token) through question and fact extraction into DISCORD_FACTS_DB, to rebuild the
  # fact store after the extractors change. Needs DX_ANTHROPIC_API_KEY.
  reextract:
    command: 'pnpm exec vitest run src/testing/reextract.test.ts'
    options:
      runInCI: false
      cache: false

  # Replay the stored SQLite messages (no token) through question extraction, print the tuples and write each
  # question to DISCORD_FACTS_DB as an `asked` fact graph (backfills earlier crawls).
  questions-demo:
    command: 'pnpm exec vitest run src/testing/questions-demo.test.ts'
    options:
      runInCI: false
      cache: false
