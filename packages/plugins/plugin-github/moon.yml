layer: library
language: typescript
tags:
  - composer-plugin
  - ts-vite-build
  - ts-test
  - ts-test-storybook
  - pack
  - storybook

tasks:
  check-module-structure:
    command: >-
      bun $workspaceRoot/tools/dx-trace-imports/cli.js
      --export ./GitHubPlugin
      --to "{react,react-dom}"
      --conditions workerd,worker
      --conditions node
      --fail-on present
    deps:
      - dx-trace-imports:build
      - build
    inputs:
      - tsconfig.json
      - '@group(production)'
      - /pnpm-lock.yaml
    options:
      timeout: 60

  # Scores the recorded walkthrough corpus. Local-only: it reads fixtures, not the build graph, and
  # runs on node's type stripping so it needs no workspace install.
  eval-walkthrough:
    command: node --experimental-strip-types scripts/score-walkthrough.ts evals/walkthrough --evidence
    options:
      cache: false
      runInCI: false
