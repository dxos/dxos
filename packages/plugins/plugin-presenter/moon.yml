layer: library
language: typescript
tags:
  - composer-plugin
  - ts-vite-build
  - ts-test
  - ts-test-storybook
  - pack
  - storybook
tasks:
  # Fail when the ./plugin export pulls in React. The node/workerd plugin variant must stay
  # loadable outside a DOM, and `Capability.lazy` does not stop a bundler walking into a React
  # surface — only a node-conditioned `#capabilities` barrel does.
  check-module-structure:
    command: >-
      bun $workspaceRoot/tools/dx-trace-imports/cli.js
      --export ./PresenterPlugin
      --to "{react,react-dom}"
      --conditions workerd,worker
      --conditions node
      --fail-on present
    deps:
      - dx-trace-imports:build
      - build
    inputs:
      - tsconfig.json
      - '@group(production)'
      - /pnpm-lock.yaml
    options:
      timeout: 60
