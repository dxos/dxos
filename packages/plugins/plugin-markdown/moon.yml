layer: library
language: typescript
tags:
  - ts-vite-build
  - ts-test
  - ts-test-storybook
  - pack
  - storybook
tasks:
  check-module-structure:
    # Fail when a module body the descriptor runs everywhere pulls in `@dxos/react-ui`: those are the
    # modules a non-DOM host loads, since `fromManifest` drops the ones declaring a `platforms` list.
    # Named as files because a descriptor's modules are package-internal, not exported subpaths.
    command: >-
      pnpm exec dx-trace-imports
      --from ./src/capabilities/skill-definition.ts
      --from ./src/capabilities/operation-handler.ts
      --from ./src/capabilities/schema.ts
      --to "@dxos/react-ui"
      --conditions workerd,worker
      --fail-on present
    deps:
      - dx-trace-imports:build
      - build
    inputs:
      - tsconfig.json
      - '@group(production)'
      - /pnpm-lock.yaml
    options:
      timeout: 60
