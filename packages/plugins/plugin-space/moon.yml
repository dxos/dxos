layer: library
language: typescript
tags:
  - ts-vite-build
  - ts-test
  - pack
  - storybook
  - ts-test-storybook
tasks:
  # Generates the headless `#capabilities` barrels (src/capabilities/gen/, gitignored) from the
  # `environments` annotations in src/capabilities/index.ts, and syncs the package.json
  # `#capabilities` condition map. overrides.<env>.ts exports are spliced over the canonical
  # declarations.
  prebuild:
    command: pnpm exec dx-gen-barrels
    deps:
      - app-framework:compile-gen-barrels
    inputs:
      - src/capabilities/index.ts
      - src/capabilities/overrides.*.ts
      - package.json
    outputs:
      - src/capabilities/gen
  build:
    deps:
      - prebuild
  test:
    deps:
      - prebuild
  lint:
    deps:
      - prebuild
  # Fail when the ./plugin export pulls in React. The node/workerd plugin variant must stay
  # loadable outside a DOM, and `Capability.lazy` does not stop a bundler walking into a React
  # surface — only a node-conditioned `#capabilities` barrel does.
  check-module-structure:
    command: >-
      pnpm exec dx-trace-imports
      --export ./SpacePlugin
      --to "{react,react-dom}"
      --conditions workerd,worker
      --fail-on present
    deps:
      - dx-trace-imports:build
      - build
    inputs:
      - tsconfig.json
      - '@group(production)'
      - /pnpm-lock.yaml
    options:
      timeout: 60
