layer: library
language: typescript
tags:
  - composer-plugin
  - ts-vite-build
  - ts-test
  - ts-test-storybook
  - storybook
tasks:
  check-module-structure:
    # The edge operation-service imports these entries directly rather than activating the plugin —
    # its React surfaces cannot load in a worker bundle — so they are the seam that headless host
    # depends on: `./operations` for the handler set, `./skills` for the codeProject skill
    # definition. Keep them UI-free: a leak here breaks that host at build time, far from here.
    command: >-
      pnpm exec dx-trace-imports
      --export ./operations
      --export ./skills
      --to "@dxos/react-ui"
      --to react
      --to react-dom
      --conditions workerd,worker
      --fail-on present
    deps:
      - dx-trace-imports:build
      - build
    inputs:
      - tsconfig.json
      - '@group(production)'
      - /pnpm-lock.yaml
    options:
      timeout: 60
