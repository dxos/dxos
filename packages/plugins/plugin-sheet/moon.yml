layer: library
language: typescript
tags:
  - e2e
  - ts-vite-build
  - ts-test
  - ts-test-storybook
  - pack
  - storybook
tasks:
  # Fail when the ./plugin export pulls in React. The node/workerd plugin variant must stay
  # loadable outside a DOM, and neither `Capability.lazy` nor `OperationHandlerSet.lazy` stops a
  # bundler walking into a React surface — only node-conditioned `#capabilities`/`#operations` do.
  check-module-structure:
    command: >-
      pnpm exec dx-trace-imports
      --export ./plugin
      --to "{react,react-dom}"
      --conditions workerd,worker,node
      --fail-on present
    deps:
      - dx-trace-imports:build
      - build
    inputs:
      - tsconfig.json
      - '@group(production)'
      - /pnpm-lock.yaml
    options:
      timeout: 60
  e2e:
    # The suite serves stories from `storybook dev`, which resolves packages from source but still
    # needs generated artifacts: vendor bundles (their dist is absent under the `vendor` tag, and
    # without it Vite's dep-scan aborts and the web server exits) and each `storybook:prebuild`.
    deps:
      - '#vendor:build'
      - '#storybook:prebuild'
    inputs:
      - .storybook/*
      - /tools/storybook-react/.storybook/main.ts
