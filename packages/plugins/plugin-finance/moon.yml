layer: library
language: typescript
tags:
  - composer-plugin
  - ts-vite-build
  - ts-test
tasks:
  # Ingest every keyless source (news, press wires, central banks, Reddit, SEC EDGAR, prices, FINRA short volume,
  # House disclosures) into ECHO feeds under FINANCE_DIR (default ~/.local/share/dxos/finance/echo), deduped on each
  # item's foreign key, then extract facts from the feeds into FINANCE_DIR/facts.db: text items through the LLM,
  # structured rows deterministically. Metered into trace.jsonl, logged to run.log. Reruns resume. Needs
  # DX_ANTHROPIC_API_KEY for text extraction. FINANCE_STEPS=ingest|extract narrows the run.
  # Explore with `DISCORD_FACTS_DB=$HOME/.local/share/dxos/finance/facts.db moon run plugin-discord:fact-server`.
  run:
    command: 'pnpm exec vitest run --project node src/testing/finance-run.test.ts -t "runs the finance pipeline"'
    env:
      FINANCE_PIPELINE: '1'
    options:
      runInCI: false
      cache: false

  # Compare text-extraction configurations over a sample of the ingested news (FINANCE_SAMPLE, default 100), each into
  # a fresh store under FINANCE_DIR/experiments/. Needs DX_ANTHROPIC_API_KEY.
  experiment:
    command: 'pnpm exec vitest run --project node src/testing/finance-run.test.ts -t "compares pipeline configurations"'
    env:
      FINANCE_EXPERIMENT: '1'
    options:
      runInCI: false
      cache: false

  # A cross-source query over FINANCE_DIR/facts.db: one ticker's news sentiment next to its prices, short volume and
  # insider trades (FINANCE_TICKER, default NVDA). No model calls.
  query:
    command: 'pnpm exec vitest run --project node src/testing/finance-run.test.ts -t "joins sources on one ticker"'
    env:
      FINANCE_QUERY: '1'
    options:
      runInCI: false
      cache: false
