layer: library
language: typescript
tags:
  - composer-plugin
  - ts-vite-build
  - ts-test
  - pack
tasks:
  # Fail when the ./plugin export pulls in React. The node/workerd plugin variant must stay
  # loadable outside a DOM, and neither `Capability.lazy` nor `OperationHandlerSet.lazy` stops a
  # bundler walking into a React surface — only node-conditioned `#capabilities`/`#operations` do.
  check-module-structure:
    command: >-
      bun $workspaceRoot/tools/dx-trace-imports/cli.js
      --export ./ChessComPlugin
      --to "{react,react-dom}"
      --conditions workerd,worker
      --conditions node
      --fail-on present
    deps:
      - dx-trace-imports:build
      - build
    inputs:
      - tsconfig.json
      - '@group(production)'
      - /pnpm-lock.yaml
    options:
      timeout: 60
