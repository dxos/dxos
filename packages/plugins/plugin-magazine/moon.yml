layer: library
language: typescript
tags:
  - composer-plugin
  - edge-release
  - ts-vite-build
  - ts-test
  - ts-test-workerd
  - ts-test-storybook
  - pack
  - storybook
tasks:
  # Fetch a month of finance headlines from public RSS feeds (Google News by week and by ticker, Yahoo Finance, CNBC,
  # MarketWatch, Nasdaq, Seeking Alpha) into FINANCE_DIR/items.jsonl (default
  # ~/.local/share/dxos/magazine-pipeline/finance). Reruns resume and dedupe. No model calls.
  # See src/testing/finance/finance-fetch.test.ts.
  finance-fetch:
    command: 'pnpm exec vitest run --project node src/testing/finance/finance-fetch.test.ts'
    env:
      FINANCE_PIPELINE: '1'
    options:
      runInCI: false
      cache: false

  # Run the finance pipeline (fact extraction, ticker mentions, sentiment, events) over the fetched items into
  # FINANCE_DIR/facts.db, metered into trace.jsonl and logged to run.log. Needs DX_ANTHROPIC_API_KEY. Reruns resume.
  # Explore the result with `DISCORD_FACTS_DB=<FINANCE_DIR>/facts.db moon run plugin-discord:fact-server`.
  finance-crawl:
    command: 'pnpm exec vitest run --project node src/testing/finance/finance-crawl.test.ts -t "runs the finance pipeline"'
    env:
      FINANCE_PIPELINE: '1'
    options:
      runInCI: false
      cache: false

  # Compare pipeline configurations over a sample (FINANCE_SAMPLE, default 100), each into a fresh store under
  # FINANCE_DIR/experiments/. Needs DX_ANTHROPIC_API_KEY.
  finance-experiment:
    command: 'pnpm exec vitest run --project node src/testing/finance/finance-crawl.test.ts -t "compares pipeline configurations"'
    env:
      FINANCE_EXPERIMENT: '1'
    options:
      runInCI: false
      cache: false
