layer: library
language: typescript
tags:
  - vite-plugin
  - ts-vite-build
  - ts-test
  - ts-test-storybook
  - pack
  - storybook
tasks:
  build:
    deps:
      - compile-node
  compile-node:
    command: bash -c 'pnpm exec vite build --logLevel silent -c vite.plugin.config.ts && pnpm exec vite build --logLevel silent -c vite.plugin.config.ts --mode cjs'
    deps:
      - ^:build
    inputs:
      - vite.plugin.config.ts
      - '@group(production)'
    outputs:
      - dist/plugin/
  test:
    deps:
      - compile-node
  test-storybook:
    deps:
      - compile-node
