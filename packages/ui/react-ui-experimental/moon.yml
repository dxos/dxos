layer: library
language: typescript
tags:
  - ts-vite-build
  - ts-test
  - ts-test-storybook
  - pack
  - storybook
tasks:
  build:
    deps:
      - ~:#prebuild
  # Tagged `prebuild` so storybook's `#storybook:#prebuild` reaches it; the gen dir does not exist until it runs.
  prebuild:
    command: pnpm run --silent glsl
    inputs:
      - src/shaders/glsl/*.*
    outputs:
      - src/shaders/glsl/gen
    tags:
      - prebuild
