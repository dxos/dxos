layer: library
language: typescript
tags:
  - ts-vite-build
  - ts-test
  - ts-test-storybook
  - pack
  - storybook
tasks:
  build:
    deps:
      - ~:#prebuild
  # Tagged `prebuild` so storybook's `#storybook:#prebuild` reaches it; the gen dir does not exist until it runs.
  prebuild:
    command: pnpm run --silent glsl
    inputs:
      - src/shaders/glsl/*.*
    # Each file by name: a directory output is satisfied by an empty directory, which then caches as a success.
    outputs:
      - src/shaders/glsl/gen/dof.frag
      - src/shaders/glsl/gen/dof.vert
      - src/shaders/glsl/gen/sim.frag
      - src/shaders/glsl/gen/sim.vert
    tags:
      - prebuild
