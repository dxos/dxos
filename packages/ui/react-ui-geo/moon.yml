layer: library
language: typescript
tags:
  - ts-vite-build
  - ts-test
  - ts-test-storybook
  - pack
  - storybook

tasks:
  # `src/` bundles `data/*.ts` and fetches the 50m and 10m topologies from `data/raw/` by package specifier,
  # so an edit under `data/` must re-hash the build and everything bundled from it.
  build:
    inputs:
      - data/**/*
