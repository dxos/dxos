layer: library
language: typescript
tags:
  - dist-runtime
  - e2e
  - ts-compile
  - pack
tasks:
  e2e:
    # `storybook dev` resolves packages from source, but Vite's dep-scan aborts without vendor dist,
    # taking the web server down with it.
    deps:
      - target: storybook-react:e2e-deps
        cacheStrategy: hash
      # The Storybook config (`tools/storybook-lit/.storybook/main.ts`) imports the theme plugin from its built
      # output, so a server started before it exits at once.
      - ui-theme:compile-node
    inputs:
      - .storybook/*
      - /tools/storybook-lit/.storybook/main.ts
