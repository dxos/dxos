layer: library
language: typescript
tags:
  - ts-vite-build
  - ts-test
  - ts-test-storybook
  - pack
  - storybook
tasks:
  build:
    deps:
      - prebuild
  # Importing this package from source is not enough on its own: `src/gen` is generated and
  # gitignored, so a consumer that never builds it still needs the codegen to have run.
  source-deps:
    deps:
      - ~:prebuild
  # Named `prebuild` so storybook's `#storybook:prebuild` reaches it; `src/gen` does not exist until it runs.
  prebuild:
    command: pnpm run --silent gen:pieces
    inputs:
      - assets/*.*
    outputs:
      - src/gen
