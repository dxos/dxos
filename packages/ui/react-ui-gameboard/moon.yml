layer: library
language: typescript
tags:
  - ts-vite-build
  - ts-test
  - ts-test-storybook
  - pack
  - storybook
tasks:
  build:
    deps:
      - prebuild
  # Named `prebuild` so storybook's `#storybook:prebuild` reaches it; `src/gen` does not exist until it runs.
  prebuild:
    command: pnpm run --silent gen:pieces
    inputs:
      - assets/*.*
    outputs:
      - src/gen
