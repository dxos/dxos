# The only config file for `edgeStress`. Every field below is optional and every default lives in
# `src/spec/edge-stress/plan.ts` (`defaultsFor`), so this file — and `--spec` — carry only what a
# run changes. Uncomment what you need; a run with nothing uncommented is the local default.
#
#   redis-server --port 6379 &
#   moon run edge:dev &                       # local EDGE on :8787; skip for `edge: dev`
#   GRAVITY_OUT_BASE=$PWD node --import tsx src/main.ts edgeStress --no-browser \
#     -s configs/edge-stress-default.yml --seed <seed>
#
# `--spec '<json>'` overrides this file for a one-off run, which is what the deleted
# edge-stress-{dev,dev-probe,finding-6,no-cleanup,no-partitions}.yml files used to do:
#
#   --spec '{"edge":"dev"}'                                    # against the deployed dev EDGE
#   --spec '{"cleanup":false}'                                 # leave state for the sweeper
#   --spec '{"partitions":true}'                               # include GoOffline/GoOnline/Restart
#   --spec '{"plan":"out/<run>/command-trace.jsonl"}'           # replay a failed run's plan
#
# Cleanup deletes every space and identity the run created, in `run`'s `finally`, so it happens on
# a failed assertion too; deletion is enqueued server-side, not synchronous. A run against `dev`
# wants `DX_HUB_API_KEY` exported for the admin-key fallback — see RESULTS.md §4.

# Which EDGE to run against: `local` (http://localhost:8787) or `dev` (https://dev.dxos.network).
# It also picks the default timeouts, since dev crosses the public internet.
edge: local

# Where replicants run.
# platform: nodejs

# Devices per identity: the length is the identity count, the sum the client count.
# devicesPerIdentity: [2, 1]

# Create an EDGE agent per identity — an always-online member that can admit late joiners.
# agents: false

# Slot counts the generator draws within; the model refuses a command that exceeds them.
# maxSpaces: 2
# maxDocumentsPerSpace: 4

# Executable commands per run, and how many pools to draw before keeping the one that replicates
# the most. Most uniformly drawn commands are unreachable where they land, hence both knobs.
# maxCommands: 25
# sampleDraws: 12

# Wall-clock budget; exhausting it stops issuing commands and proceeds to the final assertion.
# maxRuntimeMs: 600000
# quiescenceTimeoutMs: 60000

# Mid-run quiesce-and-assert over the online members.
# checkpoints: true

# Draw GoOffline/GoOnline/Restart. Off by default until finding 5 (a cut link crashes the peer)
# is fixed; off also isolates convergence from partition tolerance.
# partitions: false

# Run this plan instead of drawing one: the commands inline, or the path of a `command-trace.jsonl`
# whose last `plan` entry is replayed. This is how a counterexample becomes a fixture — the finding
# 6 repro (two devices of one identity editing one document concurrently) is:
# plan:
#   - { _tag: CreateSpace, client: 2 }
#   - { _tag: CreateDocument, client: 2, space: 0 }
#   - { _tag: EditText, client: 0, space: 0, document: 0, position: 0.5 }
#   - { _tag: EditText, client: 1, space: 0, document: 0, position: 0.5 }
#   - { _tag: EditCounter, client: 0, space: 0, document: 0 }

# Delete the spaces and identities the run created, through the self-serve routes first.
# cleanup: true
