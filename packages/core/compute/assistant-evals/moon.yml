layer: automation
language: typescript
tags:
  - evalite
  - typecheck
tasks:
  # Spelled out rather than inherited from the `ts-test` tag: that task filters with
  # `--project=node`, and this package's vitest config has to stay flat for evalite's file discovery
  # to find the scenarios at all, so it defines no projects and the filter matches nothing.
  test:
    command: pnpm exec dx-killorphans vitest run --passWithNoTests
    deps:
      - esbuild-plugins:build
      - node-std:build
      - vite-plugin-import-source:build
      - ^:build
      - '^:#prebuild'
    inputs:
      - '@group(sources)'
      - /vite.base.config.ts
      - /vitest.base.config.ts
      - /pnpm-lock.yaml
      - vitest.config.ts
      - $NODE_VERSION # Ensure cache isn't shared between node versions in CI.
    options:
      timeout: 600
  # Long-running, the way a dev server is: a scenario can hold a session for an hour, so the task
  # streams and is never timed out, cached, or run in CI.
  evals:
    command: evalite
    args:
      - src/evals
    preset: server
  # One scenario at a time: `evals` hardcodes the directory, so appending a file to it gives evalite
  # two positionals and it exits on "Too many arguments".
  eval:
    command: evalite run
    preset: server
