layer: library
language: typescript
tags:
  - dist-runtime
  - ts-compile
  - ts-test
tasks:
  build:
    deps:
      - ~:#prebuild
  gen-buf:
    command: buf generate
    # `buf.gen.yaml` reads the whole `src/proto` tree, so the declared inputs and outputs cover
    # `example/` too -- narrowing them to `dxos/` left the example modules out of the cached output
    # and `buf/registry.ts` failed to resolve them on a clean checkout.
    inputs:
      - src/proto/**/*.proto
    outputs:
      - src/buf/proto/gen
  prebuild:
    command: build-protobuf
    args:
      - '--baseDir="./src/proto"'
      - '--src="./src/proto/**/*.proto"'
      - '--outDir="./src/proto/gen"'
      - '--substitutions="./src/proto/substitutions.ts"'
    deps:
      - ^:build
      - protobuf-compiler:build
      - gen-buf
    outputs:
      - src/proto/gen
    tags:
      - prebuild
  test:
    deps:
      - ~:#prebuild
