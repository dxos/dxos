layer: library
language: typescript
tags:
  - dist-runtime
  - ts-compile
  - ts-test
tasks:
  build:
    deps:
      - ~:gen-buf
  gen-buf:
    command: buf generate
    # `buf.gen.yaml` reads the whole `src/proto` tree, so the declared inputs and outputs cover
    # `example/` too -- narrowing them to `dxos/` left the example modules out of the cached output
    # and `buf/registry.ts` failed to resolve them on a clean checkout.
    inputs:
      - src/proto/**/*.proto
    outputs:
      - src/buf/proto/gen
    # Dependents resolve `^:#prebuild`, which is how they get the generated modules before their
    # own sources are type-checked.
    tags:
      - prebuild
  test:
    deps:
      - ~:gen-buf
