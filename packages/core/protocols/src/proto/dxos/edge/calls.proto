syntax = "proto3";

import "google/protobuf/struct.proto";

import "dxos/keys.proto";

package dxos.edge.calls;

/**
 * Which media a participant publishes. The tracks themselves come from the media transport, found by the
 * participant's id (its device key) and kind.
 */
message Tracks {
  reserved 1, 3, 5;
  optional bool audio_enabled = 2;
  optional bool video_enabled = 4;
  optional bool screenshare_enabled = 6;
}

message UserState {
  reserved 3;
  string id = 1;
  string name = 2;
  bool raised_hand = 4;
  bool speaking = 5;
  bool joined = 6;
  Tracks tracks = 7;
  map<string, Activity> activities = 8;
}

/**
 * Activity state.
 * It will be merged across all users in the room based on the Lamport timestamp (last one wins).
 */
message Activity {
  LamportTimestamp lamport_timestamp = 1;

  google.protobuf.Struct payload = 10;
}

/**
 * The meeting a call is for: the payload of the meeting plugin's call activity.
 */
message MeetingPayload {
  reserved 2, 3;
  string meeting_id = 1;
}

/**
 * Whether the call's transcript is being kept: the payload of the meeting plugin's transcription activity, separate
 * from `MeetingPayload` so either can be written without reading the other.
 */
message TranscriptionPayload {
  bool enabled = 1;
}

/**
 * Lamport Timestamp.
 * @see https://en.wikipedia.org/wiki/Lamport_timestamp
 */
message LamportTimestamp {
  int32 version = 1;
  string id = 2;
}
