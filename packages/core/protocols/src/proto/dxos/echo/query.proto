syntax = "proto3";

import "google/protobuf/empty.proto";

import "dxos/keys.proto";
import "dxos/echo/object.proto";
import "dxos/echo/indexing.proto";

package dxos.echo.query;

message QueryRequest {
  optional string queryId = 1;
  QueryReactivity reactivity = 3;

  /// JSON-encoded `QueryAST.Query`.
  string query = 5;
}

/**
 * Automerge heads.
 * Used for encoding in Index metadata store.
 * @see https://automerge.org/automerge-repo/types/_automerge_automerge_repo.Heads.html
 */
message Heads {
  repeated string hashes = 1;
}

message QueryResult {
  string id = 1;
  string spaceId = 4;
  optional string documentId = 5;
  optional string queueId = 6;
  optional string queueNamespace = 7;
  float rank = 3;

  /**
   * The object as `objectStructureToJson` (`@dxos/echo/internal`) writes it, which
   * `objectStructureFromJson` reads back: data fields at the top level with `Uint8Array` values
   * in the DAG-JSON form `{"/":{"bytes":…}}`, plus `id`, `@type`, `@meta` (omitted when empty), `@deleted`,
   * `@parent`, `@relationSource` and `@relationTarget`.
   */
  optional string document_json = 10;
  optional bytes document_automerge = 11;

  /// Heads of the document the index read `document_json` at; sent only for a document that holds just this object.
  repeated string heads = 14;

  /// The document's Automerge bytes, which may be ahead of `heads`; sent with `heads` so the client can show the row unloaded and load it on the first write.
  optional bytes bytes = 15;

  /// Unix ms of the object's creation, sent with `bytes`.
  optional double created_at = 16;

  /// Unix ms of the object's last change, sent with `bytes`.
  optional double updated_at = 17;

  /// `document_json` as SQLite JSONB, which is how the index stores it; a server sends one of the two.
  optional bytes document_jsonb = 18;

  /// JSON-encoded group key (an object keyed by the aggregate's group-field names). Present iff the query has an aggregate clause.
  optional string groupKey = 12;

  /// Number of records in this record's group within the result set. Present iff the query has an aggregate clause.
  optional int32 groupCount = 13;

  /// @deprecated Use spaceId.
  optional dxos.keys.PublicKey spaceKey = 2;
}

enum QueryReactivity {
  /// Returns a signle result.
  ONE_SHOT = 0;

  /// Returns the initial result and then incremental reactive updates when the data source changes.
  REACTIVE = 1;
}

message QueryResponse {
  optional string queryId = 1;
  repeated QueryResult results = 2;
  repeated dxos.echo.object.EchoObject objects = 3;
}
