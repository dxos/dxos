[package]
name = "echo_native"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
turso_core = { version = "=0.8.3", default-features = false, features = ["json", "fs", "uuid", "time"] }
automerge = "0.7"
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false
