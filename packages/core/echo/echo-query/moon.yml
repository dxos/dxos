layer: library
language: typescript
tags:
  - ts-vite-build
  - ts-test
  - pack
tasks:
  build:
    deps:
      - prebuild
  # `#query-lite` and `@dxos/echo-query/api.d.ts?raw` (plugin-script's in-editor type hints) map at
  # `dist/query-lite/`, with no `source` alternative — but `prebuild` alone produces them, so a
  # source-importing consumer needs that rather than the whole `dist-runtime` build.
  source-deps:
    deps:
      - ~:prebuild
  prebuild:
    deps:
      - echo-query:prebuild-lezer
      - echo-query:prebuild-query-lite
  prebuild-lezer:
    command: pnpm exec lezer-generator --typeScript ./src/parser/query.grammar -o ./src/parser/gen/query.ts
    inputs:
      - src/parser/query.grammar
    outputs:
      - src/parser/gen/query.terms.ts
      - src/parser/gen/query.ts
  prebuild-query-lite:
    command: pnpm exec tsdown --logLevel error
    deps:
      - ^:build
    inputs:
      - src/query-lite/*
      - tsdown.config.ts
    outputs:
      - dist/query-lite/*
  test:
    deps:
      - prebuild
