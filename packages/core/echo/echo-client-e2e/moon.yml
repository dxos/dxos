layer: automation
language: typescript
tags:
  - ts-test
  - typecheck

tasks:
  # The `manual`-tagged benches, as the perf nightly runs them, with the JSON the scorer reads. Never
  # a PR gate and never cached: a measurement is not a pass/fail, and a cached one measured nothing.
  bench:
    command: pnpm exec vitest bench --run --outputJson ../../../../test-results/echo-bench/results.json
    env:
      DX_RUN_MANUAL_TESTS: '1'
    deps:
      - ^:build
    options:
      cache: false
  # Scores the last `bench` run against `src/bench-score/budgets.json`; `--publish` sends it to PostHog.
  bench-score:
    command: node src/bench-score/cli.ts score --results ../../../../test-results/echo-bench/results.json
    options:
      cache: false
  # The retention suites (the `memory` tag), which `test` skips. DX_DEBUG_LEAKS un-skips the tag and runs
  # them with `--expose-gc` in one non-isolated fork, so the script starts a vitest process per suite or
  # test: a shared process would leave a later test measuring an earlier one's WASM, which is never
  # returned to the OS. Both suites gate a fix: the feed one the change that made feed objects
  # collectable, the automerge one the change that made ECHO objects and their documents collectable.
  # Do NOT silence a failure with `test.fails`, which would also swallow an unrelated crash (the WASM
  # allocator abort these suites can provoke looks identical to an assertion failure from outside).
  test-memory:
    extends: test
    command: bash scripts/test-memory.sh
    env:
      DX_DEBUG_LEAKS: '1'
    inputs:
      - scripts/test-memory.sh
    options:
      mergeArgs: replace
