layer: library
language: typescript
tags:
  - ts-vite-build
  - ts-test
  - typetest
  - pack
  - storybook
tasks:
  # The devtools app dev server, distinct from the library build that `ts-vite-build`
  # drives out of `vite.config.ts`.
  serve:
    command: pnpm exec vite dev -c vite.app.config.ts
    deps:
      - build
    preset: server
  test:
    inputs:
      - .storybook/*
      - /tools/storybook-react/.storybook/main.ts
      - vite.config.ts
