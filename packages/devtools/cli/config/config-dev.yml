version: 1

runtime:
  client:
    edgeFeatures:
      subductionReplicator: true
      feedReplicator: true
      signaling: true
      agents: true
    storage:
      persistent: true
      dataRoot: /tmp/dx/run

  services:
    # Only the passkey origin: hub-service itself is reached through `edge` below, at `<edge>/hub`.
    hub:
      authUrl: https://account.dev.composer.space
    edge:
      url: https://dev.dxos.network/
    iceProviders:
      - urls: https://dxos.network/ice
    ipfs:
      server: https://api.ipfs.dxos.network/api/v0
      gateway: https://gateway.ipfs.dxos.network/ipfs
