version: 1

runtime:
  client:
    edgeFeatures:
      subductionReplicator: true
      feedReplicator: true
      signaling: true
      agents: true
    storage:
      persistent: true
      dataRoot: /tmp/dx/run

  app:
    env:
      # Passkey origin for these profiles: the dev account host, which the WebAuthn relying party
      # the credential was registered against covers. Read by `Account.getAuthUrl`.
      DX_AUTH_URL: https://account.dev.composer.space

  services:
    edge:
      url: https://dev.dxos.network/
    iceProviders:
      - urls: https://dxos.network/ice
    ipfs:
      server: https://api.ipfs.dxos.network/api/v0
      gateway: https://gateway.ipfs.dxos.network/ipfs
