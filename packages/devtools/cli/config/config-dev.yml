version: 1

runtime:
  client:
    edgeFeatures:
      subductionReplicator: true
      feedReplicator: true
      signaling: true
      agents: true
    storage:
      persistent: true
      dataRoot: /tmp/dx/run

  services:
    # Same EDGE host as `edge` below, so this is the hub that EDGE's `HUB_SERVICE` binding resolves
    # to -- a hub from another environment mints magic links no redemption can resolve.
    hub:
      url: https://dev.dxos.network/hub/
      authUrl: https://account.dev.composer.space
    edge:
      url: https://dev.dxos.network/
    iceProviders:
      - urls: https://dxos.network/ice
    ipfs:
      server: https://api.ipfs.dxos.network/api/v0
      gateway: https://gateway.ipfs.dxos.network/ipfs
