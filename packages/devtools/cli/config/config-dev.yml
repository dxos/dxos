version: 1

runtime:
  client:
    edgeFeatures:
      subductionReplicator: true
      feedReplicator: true
      signaling: true
      agents: true
    storage:
      persistent: true
      dataRoot: /tmp/dx/run

  services:
    # The account commands resolve the hub from here on node, where nothing sets `DX_HUB_URL`.
    hub:
      url: https://hub-staging.dxos.workers.dev/
    edge:
      url: https://edge.dxos.workers.dev/
    iceProviders:
      - urls: https://dxos.network/ice
    ipfs:
      server: https://api.ipfs.dxos.network/api/v0
      gateway: https://gateway.ipfs.dxos.network/ipfs
