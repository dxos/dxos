version: 1

runtime:
  client:
    edgeFeatures:
      subductionReplicator: true
      feedReplicator: true
      signaling: true
      agents: true
    storage:
      persistent: true
      dataRoot: /tmp/dx/run

  services:
    # The account commands resolve the hub from here on node, where nothing sets `DX_HUB_URL`.
    # Reached through the same EDGE host as `edge` below, so it is by construction the hub that
    # EDGE's `HUB_SERVICE` binding resolves to — a hub from another environment mints magic links
    # no redemption can resolve.
    hub:
      url: https://dev.dxos.network/hub/
    edge:
      url: https://dev.dxos.network/
    iceProviders:
      - urls: https://dev.dxos.network/ice
    ipfs:
      server: https://api.ipfs.dxos.network/api/v0
      gateway: https://gateway.ipfs.dxos.network/ipfs
