version: 1

runtime:
  # Read as `runtime.app.env` on node too, so the account commands resolve a hub without a bundler.
  app:
    env:
      DX_HUB_URL: https://hub-staging.dxos.workers.dev/

  client:
    edgeFeatures:
      subductionReplicator: true
      feedReplicator: true
      signaling: true
      agents: true
    storage:
      persistent: true
      dataRoot: /tmp/dx/run

  services:
    edge:
      url: wss://edge.dxos.workers.dev/
    iceProviders:
      - urls: https://dxos.network/ice
    ipfs:
      server: https://api.ipfs.dxos.network/api/v0
      gateway: https://gateway.ipfs.dxos.network/ipfs
