version: 1

runtime:
  client:
    edgeFeatures:
      subductionReplicator: true
      feedReplicator: true
      signaling: true
      agents: true
    storage:
      persistent: true
      dataRoot: /tmp/dx/run

  services:
    # Deployed rather than localhost: hub-service is a separate worker that is not part of the
    # local edge dev setup, so account flows against a local edge still talk to a deployed hub.
    hub:
      url: https://dev.edge.network/hub/
    edge:
      url: http://localhost:8787/
    iceProviders:
      - urls: https://dev.edge.network/ice
    sandbox:
      url: http://localhost:8792
    ipfs:
      server: https://api.ipfs.dxos.network/api/v0
      gateway: https://gateway.ipfs.dxos.network/ipfs
