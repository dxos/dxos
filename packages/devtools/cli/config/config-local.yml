version: 1

runtime:
  # Staging rather than localhost: hub-service is a separate worker that is not part of the local
  # edge dev setup, so account flows against a local edge still talk to the deployed hub.
  app:
    env:
      DX_HUB_URL: https://hub-staging.dxos.workers.dev/

  client:
    edgeFeatures:
      subductionReplicator: true
      feedReplicator: true
      signaling: true
      agents: true
    storage:
      persistent: true
      dataRoot: /tmp/dx/run

  services:
    edge:
      url: ws://localhost:8787/
    iceProviders:
      - urls: https://dxos.network/ice
    sandbox:
      url: http://localhost:8792
    ipfs:
      server: https://api.ipfs.dxos.network/api/v0
      gateway: https://gateway.ipfs.dxos.network/ipfs
