version: 1

runtime:
  client:
    edgeFeatures:
      subductionReplicator: true
      feedReplicator: true
      signaling: true
      agents: true
    storage:
      persistent: true
      dataRoot: /tmp/dx/run

  services:
    # Only the passkey origin. Account calls go to `<edge>/hub`, so a local edge needs its
    # `HUB_SERVICE` binding to answer them.
    hub:
      authUrl: https://account.dev.composer.space
    edge:
      url: http://localhost:8787/
    # Production even though `edge` is localhost: a local edge has no TURN token to mint with.
    iceProviders:
      - urls: https://dxos.network/ice
    sandbox:
      url: http://localhost:8792
    ipfs:
      server: https://api.ipfs.dxos.network/api/v0
      gateway: https://gateway.ipfs.dxos.network/ipfs
