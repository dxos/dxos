version: 1

runtime:
  client:
    edgeFeatures:
      subductionReplicator: true
      feedReplicator: true
      signaling: true
      agents: true
    storage:
      persistent: true
      dataRoot: /tmp/dx/run

  services:
    # Deployed: hub-service is not part of the local edge dev setup.
    hub:
      url: https://dev.dxos.network/hub/
      authUrl: https://account.dev.composer.space
    edge:
      url: http://localhost:8787/
    # Production even though `edge` is localhost: a local edge has no TURN token to mint with.
    iceProviders:
      - urls: https://dxos.network/ice
    sandbox:
      url: http://localhost:8792
    ipfs:
      server: https://api.ipfs.dxos.network/api/v0
      gateway: https://gateway.ipfs.dxos.network/ipfs
