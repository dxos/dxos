layer: library
language: typescript
tags:
  - typetest
  - vite-plugin
  - pack
  - ts-vite-build
  - ts-test
  - ts-test-storybook
  - typedoc
  - storybook
tasks:
  check-module-structure:
    # Fail when any export pulls in `@dxos/react-ui`: the framework renders no UI of its own, so
    # components built on react-ui belong in `@dxos/app-toolkit`.
    command: >-
      bun $workspaceRoot/tools/dx-trace-imports/cli.js
      --all-exports
      --to "@dxos/react-ui"
      --conditions browser
      --conditions node
      --fail-on present
    deps:
      - dx-trace-imports:build
      - build
    inputs:
      - package.json
      - tsconfig.json
      - '@group(production)'
      - '^@group(production)'
      - /pnpm-lock.yaml
    options:
      timeout: 60
