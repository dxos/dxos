layer: library
language: typescript
tags:
  - typetest
  - vite-plugin
  - pack
  - ts-vite-build
  - ts-test
  - ts-test-storybook
  - typedoc
  - storybook
tasks:
  check-module-structure:
    # Verify headless entrypoints resolve under workerd conditions (post-build artifacts
    # must exist — catches stale `./workerd` export paths like the removed browser bundle).
    # Then fail when the root export pulls in React; React lives only behind `./ui`.
    script: |
      bun $workspaceRoot/tools/dx-trace-imports/cli.js \
        --export . \
        --to "{react,react-dom}" \
        --conditions workerd,worker \
        --fail-on present
    deps:
      - dx-trace-imports:build
      - build
    inputs:
      - tsconfig.json
      - package.json
      - '@group(production)'
      - '^@group(production)'
      - /pnpm-lock.yaml
    options:
      timeout: 60
