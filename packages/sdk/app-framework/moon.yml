layer: library
language: typescript
tags:
  - vite-plugin
  - pack
  - ts-vite-build
  - ts-test
  - ts-test-storybook
  - typedoc
  - storybook
tasks:
  build:
    deps:
      - compile-plugin
      - compile-gen-barrels
  compile-plugin:
    command: dx-compile
    args:
      - '--entryPoint=src/vite-plugin/index.ts'
      - '--outputPath=dist/plugin'
      - '--platform=node'
    deps:
      - ^:build
      - dx-compile:build
    outputs:
      - dist/plugin
  # The `dx-gen-barrels` bin — ships with the package so out-of-repo plugin authors run the same
  # headless-barrel generation; in-repo, plugin `prebuild` tasks depend on this.
  compile-gen-barrels:
    command: dx-compile
    args:
      - '--entryPoint=src/gen-barrels/main.ts'
      - '--outputPath=dist/gen-barrels'
      - '--platform=node'
    deps:
      - dx-compile:build
    inputs:
      - src/gen-barrels/**/*
    outputs:
      - dist/gen-barrels
  check-module-structure:
    # Verify headless entrypoints resolve under workerd conditions (post-build artifacts
    # must exist — catches stale `./workerd` export paths like the removed browser bundle).
    # Then fail when the root export pulls in React; React lives only behind `./ui`.
    script: |
      pnpm exec dx-trace-imports \
        --export . \
        --to "{react,react-dom}" \
        --conditions workerd,worker \
        --fail-on present
    deps:
      - dx-trace-imports:build
      - build
    inputs:
      - tsconfig.json
      - package.json
      - '@group(production)'
      - '^@group(production)'
      - /pnpm-lock.yaml
    options:
      timeout: 60
