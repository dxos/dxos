layer: library
language: typescript
tags:
  - ts-vite-build
  - ts-test
  - pack
tasks:
  prebuild-dialects:
    command: node ./scripts/gen-dialects.mjs
    inputs:
      - lang/*.mdl
      - scripts/gen-dialects.mjs
    outputs:
      - src/schema/gen/dialects.ts
    tags:
      - prebuild
  build:
    deps:
      - ~:#prebuild
  prebuild-lezer:
    command: pnpm exec lezer-generator --typeScript ./src/extension/mdl.grammar -o ./src/extension/gen/mdl.ts
    inputs:
      - src/extension/mdl.grammar
    outputs:
      - src/extension/gen/mdl.terms.ts
      - src/extension/gen/mdl.ts
    tags:
      - prebuild
