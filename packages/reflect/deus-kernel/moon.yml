# A Rust crate with no package.json; CI's setup action installs the toolchain `rust-toolchain.toml` pins.
layer: library
language: rust

tasks:
  cargo-build:
    command: cargo build --release
    inputs:
      - src/**/*.rs
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
    outputs:
      - target/release/deus-kernel
  cargo-test:
    command: cargo test
    inputs:
      - src/**/*.rs
      - tests/**/*.rs
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - /packages/reflect/deus-lang/deus/**/*.deus
      - /packages/reflect/deus-lang/seed/deus.image
  wasm-test:
    command: bash scripts/wasm-seed.sh
    inputs:
      - src/**/*.rs
      - wasi/*.mjs
      - scripts/wasm-seed.sh
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .cargo/config.toml
      - /packages/reflect/deus-lang/deus/**/*.deus
      - /packages/reflect/deus-lang/seed/deus.image
  embed-test:
    command: bash -c 'cargo build --release --target wasm32-unknown-unknown --lib --quiet && node --test embed/kernel.test.mjs'
    inputs:
      - src/**/*.rs
      - embed/*.mjs
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .cargo/config.toml
      - /packages/reflect/deus-lang/deus/**/*.deus
  # What CI's `:test` sweep selects; the crate's tests are `cargo-test`, `wasm-test` and `embed-test`.
  test:
    command: noop
    deps:
      - cargo-test
      - wasm-test
      - embed-test
