[package]
name = "deus-kernel"
version = "0.1.0"
edition = "2021"
publish = false
description = "The DEUS kernel in Rust: a CEK machine for Core images, natively and on wasm32-wasip1."
license = "FSL-1.1-Apache-2.0"

[[bin]]
name = "deus-kernel"
path = "src/main.rs"

[dependencies]
sha2 = { version = "0.10", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# The seed test runs the whole compiler on the kernel; unoptimized, that takes minutes.
[profile.dev]
opt-level = 2
