layer: library
language: typescript
tags:
  - ts-vite-build
  - ts-test
  - pack

tasks:
  build:
    deps:
      - ~:#prebuild
  prebuild-lezer:
    command: pnpm exec lezer-generator --typeScript ./src/dsl/diagram.grammar -o ./src/dsl/gen/diagram.ts
    inputs:
      - src/dsl/diagram.grammar
    outputs:
      - src/dsl/gen/diagram.terms.ts
      - src/dsl/gen/diagram.ts
    tags:
      - prebuild
  # Diagram source in, DSL text out: `moon run diagram:convert -- path/to/diagram.mmd`.
  convert:
    command: pnpm exec tsx ./src/dsl/cli.ts
    options:
      cache: false
      runInCI: false
  test:
    # The mermaid/UML layout suites run ~180s locally but exceed the 600s preset default under CI
    # contention, so the task was killed with every test passing. Raised until the CI-side slowdown
    # is understood; see https://github.com/dxos/dxos/pull/12985 for the measurements.
    options:
      timeout: 1800
