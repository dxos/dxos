layer: application
language: typescript
tags:
  - typecheck
tasks:
  build:
    deps:
      - ~:#prebuild
    options:
      mergeOutputs: replace
    outputs: []
  bundle:
    command: pnpm exec astro build
    deps:
      - ^:build
      - build
      - typedoc
    inputs:
      - astro.config.ts
      - SPEC.mdl
      - '@group(sources)'
    outputs:
      - .astro
      - dist
  prebuild:
    command: pnpm exec astro sync
    # `astro sync` loads astro.config.ts, whose Vite plugins resolve to these packages' dist.
    deps:
      - app-framework:build
      - ui-theme:build
      - vite-plugin-icons:build
      - vite-plugin-import-source:build
      - vite-plugin-log:build
      - vite-plugin-module-url:build
    inputs:
      - astro.config.ts
      - SPEC.mdl
      - '@group(sources)'
    outputs:
      - .astro
    tags:
      - prebuild
  serve:
    command: pnpm exec astro dev
    deps:
      - ^:build
      - typedoc
    preset: server
  typedoc:
    command: pnpm run --silent typedoc
    # collect-typedoc.sh also copies packages docs does not depend on.
    deps:
      - ^:typedoc
      - echo-solid:typedoc
      - halo:typedoc
      - halo-react:typedoc
    inputs:
      - scripts/collect-typedoc.sh
    outputs:
      - public/typedoc
