name: Affected
description: Resolve this run's moon affected scope from the CI trigger

inputs:
  all:
    description: >
      Set "true" to force a full run whatever the trigger — a dispatch that asks for the whole suite,
      or a job whose target set is not meaningfully scopeable. Anything else defers to the trigger.
    default: 'false'

runs:
  using: 'composite'
  steps:
    # Exports MOON_AFFECTED/MOON_BASE, or nothing at all for a full run, so every moon invocation in the
    # job is one unconditional command line instead of an Affected/All pair keyed on the branch name.
    # `moon exec` and `moon run` both read those two variables (2.5.2), including through the Trunk
    # uploader's `run:` input. Must follow the setup action: it needs node on PATH.
    - name: Resolve affected scope
      shell: bash
      env:
        CI_AFFECTED_ALL: ${{ inputs.all }}
      run: node ./.depot/actions/affected/resolve-affected.mjs
