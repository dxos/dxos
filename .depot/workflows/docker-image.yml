# Depot CI Migration
# Source: .github/workflows/docker-image.yml
#
# Changes made:
# - Rewrote .github/ path references to .depot/ (Dockerfile itself stays at .github/Dockerfile)
# - Changed GitHub runs-on labels to their Depot equivalents
# - Swapped docker/build-push-action for depot/build-push-action (Depot's own container-build
#   product - up to 40x faster, native multi-platform, per wittjosiah's request), needing a new
#   DEPOT_TOKEN secret (project token for project mld2ddpgxv, created via the Depot dashboard -
#   there's no CLI path to create one)
# - Swapped the GHCR login password from secrets.GITHUB_TOKEN to secrets.GHCR_PAT: GHCR only
#   accepts PATs, not the GitHub App tokens Depot CI's jobs get (flagged by CodeRabbit on #12779,
#   same root cause that kept publish-all.yml on GitHub Actions). Needs a classic PAT with
#   write:packages, stored as a Depot secret.

name: Build and Push Docker Image
permissions:
  contents: read
  packages: write
on:
  push:
    branches:
      - main
      - gh-docker
    paths:
      - .github/Dockerfile
      - .depot/workflows/docker-image.yml
  workflow_dispatch:
env:
  IMAGE_NAME: ghcr.io/dxos/gh-actions
  DEFAULT_NODE_VERSION: 20.19.5
  IMAGE_TAG_SUFFIX: ''
jobs:
  build-and-push:
    strategy:
      matrix:
        node_version: ['20.19.5', '24.11.1']
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Depot CLI
        uses: depot/setup-action@v1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # TODO(wittjosiah): needs a classic PAT with write:packages, stored as the GHCR_PAT Depot
          # secret - GHCR doesn't authenticate GitHub App tokens like the one Depot CI's jobs get,
          # so secrets.GITHUB_TOKEN (which worked on GitHub Actions) can't be swapped in as-is.
          password: ${{ secrets.GHCR_PAT }}
      - name: Set suffix if on branch
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            BRANCH=${GITHUB_REF#refs/heads/}
            echo "IMAGE_TAG_SUFFIX=-${BRANCH//\//-}" >> $GITHUB_ENV
          fi
      - name: Build and push Docker image
        uses: depot/build-push-action@v1
        with:
          project: mld2ddpgxv
          token: ${{ secrets.DEPOT_TOKEN }}
          context: .github
          file: .github/Dockerfile
          push: true
          build-args: |
            NODE_VERSION=${{ matrix.node_version }}
          # TODO(wittjosiah): Tag latest for the default node version.
          tags: |
            ${{ env.IMAGE_NAME }}:${{ matrix.node_version }}${{ env.IMAGE_TAG_SUFFIX }}
