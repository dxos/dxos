name: Model Fixture

# Replays the committed model fixtures (recorded LLM turns) on PRs so a deterministic change that
# shifts a prompt is caught before it silently rots the cache. Deliberately a SEPARATE, non-required
# workflow (not a job in check.yml): it reports on the PR but is not in the required-checks set, so a
# fixture drift never blocks merge. Fixtures are committed, so replay needs no API key or build step.
on:
  pull_request:

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  # Bound once here rather than at the setup call site: a composite action cannot read the
  # `secrets` context, but it does inherit the process environment.
  MOON_CACHE_CA_PEM: ${{ secrets.MOON_CACHE_CA_PEM }}
  MOON_CACHE_CLIENT_PEM: ${{ secrets.MOON_CACHE_CLIENT_PEM }}
  MOON_CACHE_CLIENT_KEY: ${{ secrets.MOON_CACHE_CLIENT_KEY }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  model-fixture:
    runs-on: depot-ubuntu-24.04-8
    container:
      image: ghcr.io/dxos/gh-actions:24.11.1
      credentials:
        username: dxos-bot
        password: ${{ github.token }}
    timeout-minutes: 20
    env:
      NODE_VERSION: '24.11.1'
      # Select ONLY the model-fixture-tagged suites (vitest) and un-skip them (the tag is skipped by
      # default via `vitest.tags.ts`). Replay-only — DX_UPDATE_MODEL_FIXTURES is left unset so a miss
      # errors instead of hitting the live model.
      VITEST_TAGS_FILTER: 'model-fixture'
      DX_RUN_MODEL_FIXTURE_TESTS: '1'
      VITEST_ENV: 'node'
      VITEST_XML_REPORT: 'true'
      MOON_CONCURRENCY: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Setup
        uses: ./.depot/actions/setup

      - name: Clean stale test results
        run: rm -rf test-results

      # `#model-fixture:test` selects every project carrying the `model-fixture` moon tag; the vitest
      # tag filter above then narrows each run to the tagged suites within those projects.
      - name: Replay model fixtures
        run: moon run '#model-fixture:test' -- --no-file-parallelism

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: model-fixture-report
          path: test-results
          retention-days: 7
