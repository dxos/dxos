name: Check

# Draft PRs run nothing unless labeled `ci`; marking one ready starts the run, and on a labeled draft
# the next push does. A PR opened ready runs nothing either: `draft-on-open.yml` converts it to a
# draft when its branch is an agent's (`claude/`, `dm/`). Every PR-triggered job repeats the same gate in its
# `if:` or inherits it from `plan`. No `labeled` trigger: its run would post skipped check runs over
# the PR's real results, and branch protection reads skipped as passing.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

  push:
    branches:
      - main
      - ci/*

  schedule:
    - cron: '0 4 * * 1-5'

  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)'
        required: false
        default: false

      only:
        type: choice
        description: 'Run only this group of jobs'
        required: false
        default: all
        options:
          - all
          - check
          - test
          - e2e

permissions:
  contents: read
  packages: read

env:
  # Bound once here rather than at every setup call site: a composite action cannot read the
  # `secrets` context, but it does inherit the process environment.
  MOON_CACHE_CA_PEM: ${{ secrets.MOON_CACHE_CA_PEM }}
  MOON_CACHE_CLIENT_PEM: ${{ secrets.MOON_CACHE_CLIENT_PEM }}
  MOON_CACHE_CLIENT_KEY: ${{ secrets.MOON_CACHE_CLIENT_KEY }}
  DISCORD_TEST_REPORT_WEBHOOK: ${{ secrets.DISCORD_TEST_REPORT_WEBHOOK }}
  TRUNK_TOKEN: ${{ secrets.TRUNK_TOKEN }}

# https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/control-the-concurrency-of-workflows-and-jobs
# The event is part of the key because on a schedule `github.ref` is `refs/heads/main`: without it the
# nightly shares a group with pushes to main and the next push cancels it mid-e2e.
#
# A manual dispatch also keys on its run id, so repeated dispatches of one ref run in parallel:
# measuring flakiness needs N independent samples of the same commit. Every other event keeps
# one-run-per-ref, where superseding an in-flight run is what you want.
#
# A merge group never cancels: its ref is unique, so only a duplicate run for the same commit shares
# the group, and cancelling one posts `cancelled` on required checks, which dequeues the PR.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref
    }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || '' }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

# https://moonrepo.dev/docs/guides/ci
jobs:
  check:
    # `inputs.only` is empty outside a dispatch, so every job-group condition passes there.
    if: >-
      ${{ inputs.only != 'test' && inputs.only != 'e2e' && (
      github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci') ||
      (!github.event.pull_request.draft && (github.event.action != 'opened' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      !(startsWith(github.head_ref, 'claude/') || startsWith(github.head_ref, 'dm/'))))) }}
    permissions:
      contents: read
      packages: read
    # 4 vCPU: the compile gate is mostly remote-cache hits and peaks at 12 GB of the 16.
    runs-on: depot-ubuntu-24.04-4
    container:
      image: ghcr.io/dxos/gh-actions:24.11.1
      credentials:
        username: dxos-bot
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 30
    steps:
      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
        with:
          detached: true

      # Full depth keeps the commit graph the affected resolver and moon's own merge-base resolve against,
      # while `filter: blob:none` stops the transfer of every historical file version — the previous
      # full fetch ranged 32s–15m on the same commit. No `lfs: true`: nothing in the tree is
      # LFS-tracked. `fetch-tags: false` is not used because checkout ignores it at depth 0; at
      # ~150 tags the residual refspec cost is noise.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup
        uses: ./.depot/actions/setup

      - name: Resolve affected scope
        uses: ./.depot/actions/affected

      # ─── Stage 1: gates that need no build ──────────────────────────────────────────────────────
      # Independent node scripts, seconds each. `fail-fast: false` so one run reports every failure.
      - fail-fast: false
        parallel:
          - name: Check formatting
            run: pnpm run format-check

          - name: Check for import cycles
            run: pnpm run check-cycles

          - name: Check publish config
            run: pnpm run check-publish-config

          - name: Check changesets
            env:
              CHANGESET_BASE_REF: ${{ github.event.pull_request.base.sha }}
            run: pnpm run check-changesets

          - name: Check version files in sync
            run: node scripts/sync-versions.mjs --check

          - name: Check remote cache wiring
            run: node scripts/check-cache-wiring.mjs

          - name: Check package.json paths
            run: pnpm run pkg-lint

          - name: Check public packages don't depend on private packages
            run: pnpm run check-public-dependencies

          - name: Check public packages are published
            run: pnpm run check-packages-published

          # Both sides of the spec <-> `.mdl` QA binding. In stage 1 because it needs no build and
          # because the failure it catches — a renamed test leaving a flow claiming coverage it no
          # longer has — is cheapest to report before anything compiles.
          - name: Check e2e tests are bound to QA flows
            run: node packages/e2e/composer-e2e/scripts/check-qa-coverage.mjs

      # Neither of the next two can join the block above: each rewrites a file that `.moon/tasks/all.yml`
      # declares an implicit input to every task, and neither restores it on a hard cancellation.
      #
      # `.npmrc` sets `strict-peer-dependencies` with `auto-install-peers=false`, so re-resolving is what
      # surfaces an unsatisfiable peer. `--no-frozen-lockfile` can rewrite `pnpm-lock.yaml`.
      - name: Check for peer dependency issues
        run: |
          trap 'git checkout -- pnpm-lock.yaml' EXIT
          pnpm install --resolution-only --no-frozen-lockfile

      # `pkg-lint` rejects a malformed `exports`/`imports` entry; this rejects a stale one. The toolbox is
      # the only writer of those maps, so anything it would change is drift a contributor fixes by running
      # the same command. `--lint-package-exports` writes `package.json` through `updatePackages()`, which
      # four of the gates above read, so it stays out of the block for that reason too.
      - name: Check package exports in sync
        run: |
          pnpm toolbox --lint-package-exports
          git diff --exit-code -- '**/package.json'

      # ─── Stage 2: the compile gate ──────────────────────────────────────────────────────────────
      # ~15 s warm, minutes cold, and the floor under everything below it.
      - name: Check
        run: moon run :lint :build :test-types

      # `check-module-structure` traces the built artifacts (`deps: [build]`), so it cannot move ahead
      # of the gate however cheap it looks — its 5 s is a post-build number.
      - name: Check module structure
        run: moon run :check-module-structure

      # ─── Stage 3: the slow checks ───────────────────────────────────────────────────────────────
      # ~2m30s against ~1m and ~1m, so they run last, and concurrently. `fail-fast: false` reports both.
      #
      # One moon invocation, not a lane each: two concurrent moon processes in one workspace contend for
      # the same task locks. Only `moon exec` has `--on-failure`. `env -u` because both checks catch a
      # property of an import edge, whose offending commit lands in a package neither project's inputs
      # name, so scoped they no-op on the PRs they exist to catch. Unset them, do not set
      # `MOON_AFFECTED=''`. Empty is not "off", moon reads it as an empty base and still filters.
      - fail-fast: false
        parallel:
          - name: Check dependencies
            run: pnpm run knip

          # `docs:bundle` IS the docs link check: `starlight-links-validator` runs as the last phase of
          # `astro build`.
          - name: Check production plugin set and docs links
            run: >-
              env -u MOON_AFFECTED -u MOON_BASE -u MOON_HEAD
              moon exec composer-app:check-plugin-set docs:bundle --on-failure continue

  # Static boot-graph budget over the production bundle, on its own runner. The class it catches is a
  # property of an IMPORT EDGE — a boot-reachable module reaching a barrel instead of a subpath — so a
  # refactor that relocates the edge silently drops the fix and neither the build nor the tests notice;
  # three separate fixes were undone that way. Not affected-scoped, because the offending edit lands in
  # some other package. Here rather than on an `e2e` cell so that it gates the PR that introduces the
  # regression: `e2e` runs on main/changeset-release or an explicit dispatch, so there it never gated one.
  # Split out of `check`, where its ~41s of bundling (nothing else in the workflow builds `bundle`) sat
  # behind that job's whole stage 1+2 sequence; the library builds it needs come from the remote cache
  # instead.
  boot-budget:
    if: >-
      ${{ inputs.only != 'test' && inputs.only != 'e2e' && (
      github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci') ||
      (!github.event.pull_request.draft && (github.event.action != 'opened' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      !(startsWith(github.head_ref, 'claude/') || startsWith(github.head_ref, 'dm/'))))) }}
    permissions:
      contents: read
      packages: read
    # 4 vCPU: averages 14% of 8 vCPU and peaks at 12 GB.
    runs-on: depot-ubuntu-24.04-4
    container:
      image: ghcr.io/dxos/gh-actions:24.11.1
      credentials:
        username: dxos-bot
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 30
    env:
      COMPARE: >-
        ${{ github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository }}
    outputs:
      status: ${{ steps.compare.outputs.status || 'skipped' }}
      body: ${{ steps.compare.outputs.body }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup
        uses: ./.depot/actions/setup

      - name: Check boot budget
        id: budget
        continue-on-error: true
        run: moon run composer-app:check-boot-budget

      - name: Trend the boot graph
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          DX_POSTHOG_API_KEY: ${{ secrets.COMPOSER_APP_PROD_POSTHOG_API_KEY }}
        run: |
          node scripts/ci-event.mjs \
            --event ci.boot-budget \
            --properties packages/apps/composer-app/out/boot-budget.json \
            --property app=composer

      - name: Record this PR's measurement
        id: head
        if: env.COMPARE == 'true'
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          cp packages/apps/composer-app/out/boot-budget.json "$RUNNER_TEMP/boot-budget.head.json"
          cp packages/apps/composer-app/scripts/compare-boot-budget.mjs "$RUNNER_TEMP/compare.mjs"
          if git diff --quiet "$BASE_SHA" HEAD -- packages/apps/composer-app/scripts/check-boot-budget.mjs; then
            echo 'comparable=true' >> "$GITHUB_OUTPUT"
          else
            echo 'comparable=false' >> "$GITHUB_OUTPUT"
            echo '::notice::boot budget measurement changed in this PR — skipping the base comparison.'
          fi

      - name: Measure the base commit's boot graph
        id: base
        if: env.COMPARE == 'true' && steps.head.outputs.comparable == 'true'
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          trap 'git checkout --detach "$HEAD_SHA" >/dev/null 2>&1 || true' EXIT
          git checkout --detach "$BASE_SHA"
          pnpm install --prefer-offline
          # moon owns this path, so head and base measurements land on the same file: deleting first
          # is what makes the copy below fail loudly instead of measuring the head's leftover report.
          rm -f packages/apps/composer-app/out/boot-budget.json
          moon run composer-app:check-boot-budget || true
          cp packages/apps/composer-app/out/boot-budget.json "$RUNNER_TEMP/boot-budget.base.json"

      - name: Compare with the base
        id: compare
        if: steps.base.outcome == 'success'
        continue-on-error: true
        run: |
          node "$RUNNER_TEMP/compare.mjs" \
            --base "$RUNNER_TEMP/boot-budget.base.json" \
            --head "$RUNNER_TEMP/boot-budget.head.json"

      - name: Report boot budget failure
        if: ${{ !cancelled() && steps.budget.outcome == 'failure' }}
        run: |
          echo '::error::boot budget exceeded — see the "Check boot budget" step.'
          exit 1

  # A separate job because `permissions` is job-scoped: holding `pull-requests: write` in
  # `boot-budget` would put the token in reach of the branch code that job checks out and builds.
  boot-budget-comment:
    needs: boot-budget
    if: >-
      ${{ !cancelled() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.boot-budget.result != 'skipped' && needs.boot-budget.outputs.status != 'skipped' }}
    runs-on: depot-ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Post or remove boot graph comment
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          STATUS: ${{ needs.boot-budget.outputs.status }}
          BODY: ${{ needs.boot-budget.outputs.body }}
        with:
          script: |
            const marker = '<!-- boot-budget -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(
              (comment) => comment.user?.type === 'Bot' && comment.body && comment.body.includes(marker),
            );
            if (process.env.STATUS === 'grew') {
              const body = `${marker}\n${process.env.BODY}`;
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
              }
            } else if (existing) {
              await github.rest.issues.deleteComment({ owner, repo, comment_id: existing.id });
            }

  # Retention suites (the `memory` tag), which the normal `test` job skips: they need `--expose-gc`
  # and force a single non-isolated fork, neither of which the sharded matrix can provide. Gated on
  # DX_DEBUG_LEAKS, the one variable that both un-skips the tag and supplies the flag.
  #
  # Both suites gate: the feed one guards the fix that made feed objects collectable, the automerge
  # one the fix that made ECHO objects and their documents collectable. Do NOT silence a failure here
  # with `test.fails`, which would also swallow an unrelated crash (the WASM allocator abort these
  # suites can provoke looks identical to an assertion failure from the outside).
  memory:
    needs: plan
    if: >-
      ${{ !cancelled() && inputs.only != 'e2e' &&
      (needs.plan.result == 'failure' || (needs.plan.result == 'success' && needs.plan.outputs.memory == 'true')) }}
    permissions:
      contents: read
      packages: read
    # 2 vCPU: averages 13% of 8 vCPU and peaks at 5 GB.
    runs-on: depot-ubuntu-24.04
    container:
      image: ghcr.io/dxos/gh-actions:24.11.1
      credentials:
        username: dxos-bot
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 20
    env:
      DX_DEBUG_LEAKS: '1'
      VITEST_ENV: 'node'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup
        uses: ./.depot/actions/setup

      # `DX_DEBUG_LEAKS_DIR` keeps the heap snapshots the probe writes out of the workspace. It is
      # set per step, not on the job: `runner` is not among the contexts available to job-level `env`
      # (only github/needs/strategy/matrix/vars/inputs), and referencing it there fails the whole
      # workflow to parse — no jobs run at all.
      - name: Feed retention
        env:
          DX_DEBUG_LEAKS_DIR: ${{ runner.temp }}/profiles
        run: moon run echo-client-e2e:test -- src/feed-retention.test.ts

      # One invocation per test, because vitest isolation is per FILE and both tests live in one:
      # a single run leaves the second test measuring the first test's WASM, which is never returned
      # to the OS. A fresh process per test is the only clean floor.
      - name: Automerge retention (collection)
        env:
          DX_DEBUG_LEAKS_DIR: ${{ runner.temp }}/profiles
        run: moon run echo-client-e2e:test -- src/automerge-retention.test.ts -t 'collecting removed objects releases them'

      - name: Automerge retention (caller reference)
        env:
          DX_DEBUG_LEAKS_DIR: ${{ runner.temp }}/profiles
        run: moon run echo-client-e2e:test -- src/automerge-retention.test.ts -t 'dropping the caller reference releases objects'

  # Starts only the test and e2e cells whose targets the change affects (`.depot/actions/plan/plan.mjs`),
  # and picks the e2e browsers: Chromium on PRs and the merge queue, Firefox and WebKit on a push to
  # main (the queue already ran Chromium on that tree), all three otherwise. Decided in a step: an
  # expression inside `strategy.matrix` does not see the event on Depot.
  plan:
    if: >-
      ${{ inputs.only != 'check' && (
      github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci') ||
      (!github.event.pull_request.draft && (github.event.action != 'opened' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      !(startsWith(github.head_ref, 'claude/') || startsWith(github.head_ref, 'dm/'))))) }}
    runs-on: depot-ubuntu-latest
    timeout-minutes: 5
    outputs:
      node: ${{ steps.plan.outputs.node }}
      browser: ${{ steps.plan.outputs.browser }}
      memory: ${{ steps.plan.outputs.memory }}
      composer-browsers: ${{ steps.plan.outputs.composer-browsers }}
      rest-browsers: ${{ steps.plan.outputs.rest-browsers }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: moonrepo/setup-toolchain@v0
        with:
          # IMPORTANT: Keep in-sync with .prototools
          moon-version: '2.5.2'
          proto-version: '0.60.2'

      - name: Resolve affected scope
        uses: ./.depot/actions/affected
        with:
          all: ${{ github.event_name == 'workflow_dispatch' }}

      - id: plan
        run: node .depot/actions/plan/plan.mjs

  # Vitest, split by runtime because the two halves need different machines. `node` (`:test`,
  # `:test-workerd`) peaks under 10 GB with no browser, so it runs on 4 vCPU; `browser`
  # (`:test-browser`, `:test-storybook`) runs four Chromiums at once and peaks near 20 GB, so it keeps
  # 8 vCPU. Within each suite `moon exec --job N --job-total` partitions the targets by work. File
  # parallelism stays disabled — overloaded runners flake — so the win is concurrency across machines,
  # not within one. A suite the change does not affect is skipped, which branch protection reads as
  # passing, so a failed `plan` starts every cell rather than skipping them.
  #
  # Skipped on pushes to main: the merge queue already ran these targets on the same tree.
  test-node:
    name: test (node, shard=${{ matrix.shard }})
    needs: plan
    if: >-
      ${{ !cancelled() && inputs.only != 'e2e' && !(github.event_name == 'push' && github.ref == 'refs/heads/main') &&
      (needs.plan.result == 'failure' || (needs.plan.result == 'success' && needs.plan.outputs.node == 'true')) }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    runs-on: depot-ubuntu-24.04-4
    container:
      image: ghcr.io/dxos/gh-actions:24.11.1
      credentials:
        username: dxos-bot
        password: ${{ github.token }}
    timeout-minutes: 30
    env:
      NODE_VERSION: '24.11.1'
      # Opt the test job in to flaky-tagged suites (Trunk pass-on-rerun keeps signal),
      # while still excluding the heavier opt-in tag families.
      VITEST_TAGS_FILTER: '!sync && !sync-e2e && !functions-e2e && !manual'
      VITEST_ENV: 'node'
      # Coverage is unsupported for the workers pool (v8 coverage imports `node:inspector/promises`,
      # absent in workerd), so `vite.base.config.ts` drops it for the `workerd` project type — which is
      # what lets a cell mix workerd targets with the rest under one flag.
      VITEST_COVERAGE: ${{ secrets.CODECOV_TOKEN != '' && 'true' || 'false' }}
      VITEST_XML_REPORT: 'true'
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      # One target per core.
      MOON_CONCURRENCY: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Setup
        uses: ./.depot/actions/setup

      - name: Resolve affected scope
        uses: ./.depot/actions/affected

      - parallel:
          - name: Clean stale test results
            run: rm -rf test-results

          # plugin-sandbox's local-backend tests skip without these. A no-op once the image built
          # from `.github/Dockerfile` carries them; that image only rebuilds after the Dockerfile lands.
          - name: Install sandbox tools
            run: >-
              command -v bwrap >/dev/null ||
              (sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap socat ripgrep)

      - name: Test
        uses: ./.depot/actions/vitest
        with:
          suite: node
          targets: ':test :test-workerd'
          shard: ${{ matrix.shard }}
          of: ${{ strategy.job-total }}

  test-browser:
    name: test (browser, shard=${{ matrix.shard }})
    needs: plan
    if: >-
      ${{ !cancelled() && inputs.only != 'e2e' && !(github.event_name == 'push' && github.ref == 'refs/heads/main') &&
      (needs.plan.result == 'failure' || (needs.plan.result == 'success' && needs.plan.outputs.browser == 'true')) }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    runs-on: depot-ubuntu-24.04-8
    container:
      image: ghcr.io/dxos/gh-actions:24.11.1
      credentials:
        username: dxos-bot
        password: ${{ github.token }}
    timeout-minutes: 30
    env:
      NODE_VERSION: '24.11.1'
      # Opt the test job in to flaky-tagged suites (Trunk pass-on-rerun keeps signal),
      # while still excluding the heavier opt-in tag families.
      VITEST_TAGS_FILTER: '!sync && !sync-e2e && !functions-e2e && !manual'
      VITEST_ENV: 'node'
      VITEST_COVERAGE: ${{ secrets.CODECOV_TOKEN != '' && 'true' || 'false' }}
      VITEST_XML_REPORT: 'true'
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      # Half the cores, leaving headroom for each target's Chromium.
      MOON_CONCURRENCY: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Setup
        uses: ./.depot/actions/setup

      - name: Resolve affected scope
        uses: ./.depot/actions/affected

      - parallel:
          - name: Install Playwright
            run: pnpm run install-playwright

          - name: Clean stale test results
            run: rm -rf test-results

      - name: Test
        uses: ./.depot/actions/vitest
        with:
          suite: browser
          targets: ':test-browser :test-storybook'
          shard: ${{ matrix.shard }}
          of: ${{ strategy.job-total }}

  # One cell per browser in each of two jobs: `e2e` runs composer, which dwarfs every other suite and is
  # CPU-bound on 8 vCPU; `e2e-rest` runs the rest of the pool on 4 vCPU. A cell costs ~160s of fixed
  # setup against ~450-590s of test work, so more cells buy less than they cost. The jobs repeat their
  # steps because a composite action cannot carry the `Test` step's own timeout. `--on-failure
  # continue` because moon's default bail drops a failing cell's remaining targets, hiding what they
  # cost. The shape, and the alternatives measured against it, are in `.agents/projects/ci/DESIGN.md`.
  e2e:
    name: e2e (composer, ${{ matrix.browser }})
    needs: plan
    if: ${{ needs.plan.outputs.composer-browsers != '[]' && inputs.only != 'test' }}
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(needs.plan.outputs.composer-browsers) }}
    runs-on: depot-ubuntu-24.04-8
    container:
      image: ghcr.io/dxos/gh-actions:24.11.1
      credentials:
        username: dxos-bot
        password: ${{ secrets.GITHUB_TOKEN }}
    # Headroom over the step's own cap, which fails cleanly with traces attached; hitting this one
    # cancels the job and proves nothing.
    timeout-minutes: 30
    env:
      # Scoped per job because at workflow level it would also move the hashes of `test`, `storybook`,
      # `workerd` and `cli`.
      DX_ENVIRONMENT: ci
      # Selects this cell's Playwright project; also a moon task hash input, so each browser gets its
      # own remote-cache entry.
      PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
    steps:
      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
        with:
          detached: true

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Setup
        uses: ./.depot/actions/setup

      - name: Resolve affected scope
        uses: ./.depot/actions/affected
        with:
          all: ${{ github.event_name == 'workflow_dispatch' }}

      - parallel:
          # Only this cell's browser — the other two engines' downloads are dead weight here.
          - name: Install Playwright
            run: pnpm run install-playwright ${{ matrix.browser }}

          # Clear Storybook Vite cache in every package so Storybook dev server does a fresh optimizeDeps
          # run. Avoids 504 Outdated Optimize Dep when graph differs from bundle step. Storybook puts
          # cache under node_modules/.cache/storybook/<hash>/sb-vite per package.
          - name: Clear Storybook Vite cache
            run: find . -type d -path '*/node_modules/.cache/storybook' -prune -print0 | xargs -0 rm -rf

          - name: Clean stale test results
            run: rm -rf test-results

      - name: Test
        timeout-minutes: 25
        uses: trunk-io/analytics-uploader@v1
        env:
          # Forces the e2e tasks to actually run: re-running one commit otherwise replays a cache hit
          # and reports green without executing a test.
          DX_E2E_RUN_ID: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && format('{0}-{1}', github.run_id, github.run_attempt) || '' }}
        with:
          junit-paths: 'test-results/playwright/report/*.xml'
          org-slug: dxos
          token: ${{ secrets.TRUNK_TOKEN }}
          quarantine: true
          run: >-
            moon exec --on-failure continue composer-e2e:e2e

      # Trends every test's outcome in PostHog; the event contract and the gate are documented in
      # `packages/e2e/composer-e2e/DASHBOARD.md`. `always()` because a RED run is the report worth
      # having.
      - name: Publish results
        if: >-
          ${{ always() && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') }}
        env:
          DX_POSTHOG_API_KEY: ${{ secrets.COMPOSER_APP_PROD_POSTHOG_API_KEY }}
        run: node packages/e2e/composer-e2e/scripts/publish-results.mjs

      - name: Upload Traces
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}-composer
          path: test-results/playwright
          retention-days: 7

  e2e-rest:
    name: e2e (rest, ${{ matrix.browser }})
    needs: plan
    if: ${{ needs.plan.outputs.rest-browsers != '[]' && inputs.only != 'test' }}
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(needs.plan.outputs.rest-browsers) }}
    # 4 vCPU: averages 11% of 8 vCPU and peaks at 12 GB.
    runs-on: depot-ubuntu-24.04-4
    container:
      image: ghcr.io/dxos/gh-actions:24.11.1
      credentials:
        username: dxos-bot
        password: ${{ secrets.GITHUB_TOKEN }}
    # Headroom over the step's own cap, which fails cleanly with traces attached; hitting this one
    # cancels the job and proves nothing.
    timeout-minutes: 30
    env:
      # Scoped per job because at workflow level it would also move the hashes of `test`, `storybook`,
      # `workerd` and `cli`.
      DX_ENVIRONMENT: ci
      # Selects this cell's Playwright project; also a moon task hash input, so each browser gets its
      # own remote-cache entry.
      PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
    steps:
      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
        with:
          detached: true

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Setup
        uses: ./.depot/actions/setup

      - name: Resolve affected scope
        uses: ./.depot/actions/affected
        with:
          all: ${{ github.event_name == 'workflow_dispatch' }}

      # Depot merges each parallel unit's env and step outputs back on join, so `steps.shard` survives.
      - parallel:
          # Only this cell's browser — the other two engines' downloads are dead weight here.
          - name: Install Playwright
            run: pnpm run install-playwright ${{ matrix.browser }}

          # Clear Storybook Vite cache in every package so Storybook dev server does a fresh optimizeDeps
          # run. Avoids 504 Outdated Optimize Dep when graph differs from bundle step. Storybook puts
          # cache under node_modules/.cache/storybook/<hash>/sb-vite per package.
          - name: Clear Storybook Vite cache
            run: find . -type d -path '*/node_modules/.cache/storybook' -prune -print0 | xargs -0 rm -rf

          - name: Clean stale test results
            run: rm -rf test-results

          # moon ignores MQL negation in `moon query tasks` and `moon exec --query`, so composer-e2e is
          # filtered in node.
          - name: Select targets
            id: shard
            run: |
              targets=$(moon query tasks "task=e2e" |
                node -e "let s='';process.stdin.on('data',(d)=>(s+=d)).on('end',()=>console.log(Object.keys(JSON.parse(s).tasks).filter((project)=>project!=='composer-e2e').sort().map((project)=>project+':e2e').join(' ')))")
              [ -n "$targets" ] || { echo 'no e2e targets resolved'; exit 1; }
              echo "targets=$targets" >> "$GITHUB_OUTPUT"

      - name: Test
        timeout-minutes: 25
        uses: trunk-io/analytics-uploader@v1
        env:
          # Forces the e2e tasks to actually run: re-running one commit otherwise replays a cache hit
          # and reports green without executing a test.
          DX_E2E_RUN_ID: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && format('{0}-{1}', github.run_id, github.run_attempt) || '' }}
        with:
          junit-paths: 'test-results/playwright/report/*.xml'
          org-slug: dxos
          token: ${{ secrets.TRUNK_TOKEN }}
          quarantine: true
          run: >-
            moon exec --on-failure continue ${{ steps.shard.outputs.targets }}

      - name: Upload Traces
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}-rest
          path: test-results/playwright
          retention-days: 7

  # Builds, packs and smoke-tests the CLI on its own runner, in parallel with `e2e`. It used to ride along
  # in that job, which meant the foreign-machine check waited on the Playwright suite for an artifact that
  # was ready in minutes — and a browser test consuming the 45 minute step budget withheld it entirely.
  cli:
    # The Changesets PR's `github.ref` is refs/pull/N/merge, so only `github.head_ref` matches it.
    if: >-
      (startsWith(github.ref, 'refs/heads/main') ||
      startsWith(github.ref, 'refs/heads/changeset-release/') ||
      startsWith(github.head_ref, 'changeset-release/') ||
      inputs.only == 'all') && (
      github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci') ||
      (!github.event.pull_request.draft && (github.event.action != 'opened' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      !(startsWith(github.head_ref, 'claude/') || startsWith(github.head_ref, 'dm/')))))
    # 4 vCPU: averages 17% of 8 vCPU and peaks at 9 GB.
    runs-on: depot-ubuntu-24.04-4
    container:
      image: ghcr.io/dxos/gh-actions:24.11.1
      credentials:
        username: dxos-bot
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup
        uses: ./.depot/actions/setup

      # `@dxos/cli` ships as prebuilt platform binaries, so its failure modes live in the packed tarball
      # rather than the source tree. Depends on `bundle`, so this compiles the binaries too.
      - name: Smoke test packed CLI
        run: moon run cli:smoke

      - name: Pack the CLI for the foreign-machine job
        run: |
          mkdir -p cli-verify
          npm pack --silent --pack-destination cli-verify ./packages/devtools/cli/dist/cli
          npm pack --silent --pack-destination cli-verify ./packages/devtools/cli/dist/cli-linux-x64
          cp packages/devtools/cli/scripts/verify-installed.mjs cli-verify/

      # The verifier travels with the tarballs because the job that runs them has no checkout.
      - name: Upload packed CLI
        uses: actions/upload-artifact@v4
        with:
          name: cli-verify
          path: cli-verify/
          retention-days: 1

  # Runs the packed CLI where the tree that built it does not exist. Deliberately no checkout, no container
  # and a different runner: a `--compile`d binary is meant to carry everything, and when a dependency
  # resolves a path at bundle time instead — `@automerge/automerge`'s WASM, `better-sqlite3`'s native addon —
  # it works in the job that built it and nowhere else, which is how @dxos/cli@0.10.0 shipped unrunnable.
  # `cli:smoke` cannot cover this in CI because the build container forbids mount namespaces.
  cli-foreign:
    needs: cli
    if: ${{ !cancelled() && needs.cli.result == 'success' }}
    runs-on: depot-ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download packed CLI
        uses: actions/download-artifact@v4
        with:
          name: cli-verify
          path: cli-verify

      # `--omit=optional` so the launcher's optionalDependencies are not fetched from npm — those versions
      # are published, so without it the released (and possibly broken) platform package could satisfy the
      # dependency instead of the tarball built here.
      # The `./` is load-bearing: npm reads a bare `dir/file.tgz` as the GitHub shorthand `owner/repo` and
      # tries to clone it.
      - name: Install from the tarballs
        run: |
          npm init -y > /dev/null
          npm install --no-audit --no-fund --omit=optional ./cli-verify/*.tgz

      # The same verifier `cli:smoke` runs, so the two cannot check different things.
      - name: Verify the install
        run: node cli-verify/verify-installed.mjs .

  # Reports every nightly job from one place. e2e is in `needs` so a cancelled e2e is still reported (its
  # former in-job step used `success() || failure()`, which skips on cancellation) and so the test report
  # can no longer go out green while e2e is still running. Each report takes the worst result across its
  # jobs: one red cell makes the whole report red.
  report:
    needs: [test-node, test-browser, e2e, e2e-rest]
    if: always() && github.event_name == 'schedule'
    runs-on: depot-ubuntu-latest
    container:
      image: ghcr.io/dxos/gh-actions:24.11.1
      credentials:
        username: dxos-bot
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 5
    steps:
      # This job only runs a repository-local action, so it never needs git auth; leaving the token in
      # `.git/config` would expose it to anything in the checked-out tree.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # Each report is `always()` so an undelivered one cannot suppress the rest — without it a failing
      # first report skips the e2e report, silencing the very signal this job exists to send. A failed
      # step still fails the job.
      - name: Send test report
        if: always()
        uses: ./.depot/actions/test-report
        with:
          name: test-24.11.1
          result: >-
            ${{ (needs.test-node.result == 'failure' || needs.test-browser.result == 'failure') && 'failure' ||
            (needs.test-node.result == 'cancelled' || needs.test-browser.result == 'cancelled') && 'cancelled' ||
            needs.test-node.result }}
      - name: Send e2e report
        if: always()
        uses: ./.depot/actions/test-report
        with:
          name: e2e
          result: >-
            ${{ (needs.e2e.result == 'failure' || needs.e2e-rest.result == 'failure') && 'failure' ||
            (needs.e2e.result == 'cancelled' || needs.e2e-rest.result == 'cancelled') && 'cancelled' ||
            needs.e2e.result }}

  # Advisory changeset reminder (NOT a gate): when a PR changes publishable source but has no
  # `.changeset/*.md`, post/update a single sticky comment; remove it once a changeset is added.
  # A change that needs no release just omits the changeset — no empty changeset required.
  # Same-repo PRs only — fork PRs get a read-only token and cannot be commented on.
  changeset-reminder:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository && (
      contains(github.event.pull_request.labels.*.name, 'ci') ||
      (!github.event.pull_request.draft && (github.event.action != 'opened' ||
      !(startsWith(github.head_ref, 'claude/') || startsWith(github.head_ref, 'dm/')))))
    runs-on: depot-ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Detect missing changeset
        id: detect
        env:
          CHANGESET_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-changeset.mjs

      - name: Post or remove reminder comment
        uses: actions/github-script@v7
        env:
          MISSING: ${{ steps.detect.outputs.missing }}
          PACKAGES: ${{ steps.detect.outputs.packages }}
        with:
          script: |
            const marker = '<!-- changeset-reminder -->';
            const missing = process.env.MISSING === 'true';
            const packages = process.env.PACKAGES || '';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (missing) {
              const body = [
                marker,
                '### 🦋 No changeset found',
                '',
                'This PR changes publishable source but has no `.changeset/*.md`.',
                packages ? `Affected: ${packages}` : '',
                '',
                '- If the change is consumer-relevant (worth a changelog entry), run `pnpm changeset` and commit the file.',
                "- If it isn't changelog-relevant (chore / refactor / internal), you can ignore this — the code still ships with the next release.",
              ].filter(Boolean).join('\n');
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
              }
            } else if (existing) {
              await github.rest.issues.deleteComment({ owner, repo, comment_id: existing.id });
            }
