name: Agentic Review

# Advisory: checks that the PR carries a finalized agentic review (`.agents/reviews/<sha>/`) with
# every issue resolved or ignored, and that no more than 20% of the PR changed since. The review
# itself is run by an author or agent (`bun .agents/skills/agentic-review/scripts/fast.ts`, System
# One only — a review this check prompts never runs the subagent workflow); this job only reads
# committed files. A separate workflow so it is never a required `Check` job — keep
# it out of branch protection, since it is meant to prompt a review, not block a merge.

# Runs only on PRs authored by dmaretskyi, or with dmaretskyi among the requested reviewers, while
# the review flow is reworked; everyone else is skipped. `review_requested` starts a run when dmaretskyi is
# added as a reviewer, since no push follows to trigger one.
# Draft PRs skip this, and converting a PR to a draft cancels the run in flight: the same gate as
# `Check`.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, review_requested]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review-present:
    if: >-
      github.event_name != 'pull_request' || (!github.event.pull_request.draft &&
      (github.event.pull_request.user.login == 'dmaretskyi' ||
      contains(github.event.pull_request.requested_reviewers.*.login, 'dmaretskyi')))
    # The `ci-image.yml` snapshot: toolchains and browsers already in place.
    runs-on:
      size: 2x8
      image: &ci-image t8fblrl00n.registry.depot.dev/dxos-ci:latest
    timeout-minutes: 5
    steps:
      # Full history (blobs on demand) for the merge-base and the per-commit drift count.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # Node strips the script's types natively and it imports only `node:*`, so no install.
      - name: Check agentic review
        run: node .agents/skills/agentic-review/scripts/check-pr.ts --base=${{ github.event.pull_request.base.sha }}
