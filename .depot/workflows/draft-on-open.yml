name: Draft on open

# Converts a PR opened ready into a draft when its branch starts with one of DRAFT_PREFIXES, so CI runs
# only once someone marks it ready. The conversion triggers each PR workflow's `converted_to_draft`
# run, which skips every job and cancels the `opened` run in flight. Runs on open only, so marking a PR
# ready afterwards is never undone.

on:
  pull_request:
    types: [opened]

env:
  # Agents' branches and the Changesets Version PR's.
  DRAFT_PREFIXES: claude/ dm/ changeset-release/

permissions:
  contents: read

jobs:
  draft:
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: depot-ubuntu-latest
    timeout-minutes: 5
    # GitHub's draft mutation refuses a token without `contents: write`.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!process.env.DRAFT_PREFIXES.split(' ').some((prefix) => pr.head.ref.startsWith(prefix))) {
              return;
            }
            await github.graphql(
              'mutation($id: ID!) { convertPullRequestToDraft(input: { pullRequestId: $id }) { pullRequest { isDraft } } }',
              { id: pr.node_id },
            );
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: pr.number,
              body: 'Converted to a draft: CI runs once this is marked ready for review (`gh pr ready`).',
            });
