name: Performance nightly

# The measured flows from `packages/apps/composer-app/spec/PERF.mdl`, trended in PostHog.
#
# Never a PR gate: a measurement is not a pass/fail, and a shared runner's variance would make one
# a coin toss. The `e2e-perf` moon task is correspondingly outside the `e2e` pool, the same
# arrangement `e2e-startup` has.

on:
  schedule:
    # 04:00 UTC — after `assistant-evals` (03:00) so the two do not contend for runners, and a
    # perf run's numbers are worthless if something else is using the cell.
    - cron: '0 4 * * *'

  workflow_dispatch:
    inputs:
      scales:
        type: string
        description: 'DX_PERF_SCALE tiers to sweep, comma-separated (only smoke is supported; working and heavy need the archive fixture path)'
        default: 'smoke'
      modes:
        type: string
        description: 'DX_PERF_MODES per tier (measure, diagnose)'
        default: 'measure,diagnose'

permissions:
  contents: read
  packages: read

env:
  # Bound once here rather than at the setup call site: a composite action cannot read the
  # `secrets` context, but it does inherit the process environment.
  MOON_CACHE_CA_PEM: ${{ secrets.MOON_CACHE_CA_PEM }}
  MOON_CACHE_CLIENT_PEM: ${{ secrets.MOON_CACHE_CLIENT_PEM }}
  MOON_CACHE_CLIENT_KEY: ${{ secrets.MOON_CACHE_CLIENT_KEY }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancelled mid-flight: a half-run tier writes rows for some stages and not others, which
  # reads as a regression on whichever stages are missing.
  cancel-in-progress: false

jobs:
  perf:
    # A fixed, unshared runner size, because the numbers are only comparable night to night if the
    # machine is. Changing this resets every series in the dashboard.
    runs-on: depot-ubuntu-24.04-8
    container:
      image: ghcr.io/dxos/gh-actions:24.11.1
      credentials:
        username: dxos-bot
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      # `depot ci run` patches the caller's uncommitted changes in after checkout; nothing from the
      # tree runs before this, so a patched Setup cannot pass it.
      - name: Refuse a patched checkout
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The checkout has uncommitted changes; this workflow only runs committed code."
            git status --short
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]; then
            echo "::error::HEAD $(git rev-parse HEAD) is not the event's commit $EXPECTED_SHA."
            exit 1
          fi

      - name: Setup
        uses: ./.depot/actions/setup

      - name: Run the flows
        id: flows
        continue-on-error: true
        env:
          # `smoke` is the only tier in the default sweep: `working` and `heavy` cannot be built
          # through the operation layer (measured — see `spec/PERF.mdl`), so including either would
          # fail the flow step every night, and because the trending gate below requires a
          # successful flow, one unsupported tier would suppress the rows the OTHER tiers produced.
          # Both stay available via `inputs.scales` for whoever builds the archive path.
          SCALES: ${{ inputs.scales || 'smoke' }}
          MODES: ${{ inputs.modes || 'measure,diagnose' }}
          DX_PWA: 'false'
        run: |
          set -o pipefail
          # Cleared first so a re-run cannot inherit the previous attempt's rows and trend them
          # twice under a different wall time.
          rm -rf test-results/perf
          status=0
          IFS=',' read -ra tiers <<< "$SCALES"
          for tier in "${tiers[@]}"; do
            echo "::group::$tier"
            # One tier per invocation, serially: two flows measured at once contend for the same
            # cores and measure each other.
            DX_PERF_SCALE="$tier" DX_PERF_MODES="$MODES" moon run composer-app:e2e-perf || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Summarize
        if: always()
        run: |
          if [ ! -d test-results/perf ]; then
            echo "::warning::No rows were written; the run did not reach a stage."
            exit 0
          fi
          {
            echo '### Performance flows'
            echo
            echo '| flow | mode | scale | stage | wall ms | cpu ms | peak RSS MB | dom nodes | lag max ms |'
            echo '| --- | --- | --- | --- | --- | --- | --- | --- | --- |'
            # Read from the rows rather than recomputed: the harness already decided what each
            # column means, and a second implementation here would drift from it.
            cat test-results/perf/*.rows.ndjson 2>/dev/null | node -e '
              let input = "";
              process.stdin.on("data", (chunk) => (input += chunk));
              process.stdin.on("end", () => {
                for (const line of input.split("\n").filter(Boolean)) {
                  const row = JSON.parse(line);
                  const mb = (bytes) => Math.round(bytes / 1024 / 1024);
                  console.log(
                    `| ${row.flow} | ${row.mode} | ${row.scale} | ${row.stage} | ${row.wallMs} | ` +
                      `${row.cpuMsTotal} | ${mb(row.peakRssBytes)} | ${row.domNodes} | ${row.responsiveness.lagMaxMs} |`,
                  );
                }
              });
            '
          } >> "$GITHUB_STEP_SUMMARY"

      # Only `measure` rows from a COMPLETE run reach PostHog. `writePosthogBatch` drops the
      # diagnose rows (whose CPU carries the profiler's overhead) and the failed stages (whose
      # durations are the budgets they exhausted), but the flow step is `continue-on-error`, so a
      # tier that died partway would otherwise publish whatever it had managed to write — a trend
      # built from a truncated run reads as a regression nobody caused.
      - name: Trend the measured rows
        if: steps.flows.outcome == 'success' && github.event_name == 'schedule' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          DX_POSTHOG_API_KEY: ${{ secrets.COMPOSER_APP_PROD_POSTHOG_API_KEY }}
        run: |
          shopt -s nullglob
          batches=(test-results/perf/*.events.ndjson)
          if [ ${#batches[@]} -eq 0 ]; then
            echo "::warning::No measure-mode events to trend."
            exit 0
          fi
          for batch in "${batches[@]}"; do
            node scripts/ci-event.mjs --batch "$batch"
          done

      # The diagnose artifacts — per-stage `.cpuprofile` per realm, and the first/last frame of
      # each stage — are what a regression is read with. Not committed anywhere: a heavy tier's
      # profiles run to hundreds of MB.
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-nightly
          path: test-results/perf
          retention-days: 14

      - name: Fail on an incomplete run
        if: always() && steps.flows.outcome != 'success'
        run: |
          echo "::error::A flow did not complete; see the summary and the perf-nightly artifact."
          exit 1
